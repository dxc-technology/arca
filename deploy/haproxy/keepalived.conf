# keepalived — float a Virtual IP (VIP) across two HAProxy hosts so the Arca
# cluster has a single, highly-available client endpoint.
#
# Run this on BOTH load-balancer hosts. The MASTER owns the VIP; if its HAProxy
# (or the host) dies, the BACKUP takes the VIP over (VRRP). A track_script demotes
# a host whose HAProxy is down so the VIP never lands on a host that can't serve.
#
# Per-host edits:
#   - state           MASTER on the primary, BACKUP on the secondary
#   - priority        higher on the primary (e.g. 150 vs 100)
#   - interface       your real NIC (e.g. eth0)
#   - virtual_ipaddress  the shared VIP clients connect to
#   - auth_pass       a shared secret, identical on both hosts
#
# Install at /etc/keepalived/keepalived.conf, then: systemctl enable --now keepalived

global_defs {
    router_id arca_lb
    enable_script_security
    script_user root
}

# Demote this host when HAProxy is not running, so the VIP fails over.
vrrp_script chk_haproxy {
    script "/usr/bin/killall -0 haproxy"   # exit 0 while haproxy is alive
    interval 2
    weight -40        # drop priority below the peer's when HAProxy is down
    fall 2
    rise 2
}

vrrp_instance arca_vip {
    state MASTER              # <-- BACKUP on the secondary host
    interface eth0            # <-- your NIC
    virtual_router_id 51      # identical on both hosts, unique on the subnet
    priority 150              # <-- e.g. 100 on the secondary host
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass CHANGEME    # <-- identical shared secret on both hosts
    }

    virtual_ipaddress {
        10.0.0.10/24          # <-- the VIP clients use as the Arca endpoint
    }

    track_script {
        chk_haproxy
    }
}
