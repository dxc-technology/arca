# HAProxy — front a bare-metal 3-node Arca cluster on a single endpoint.
#
# Round-robins S3 / admin / console traffic across the live nodes, health-checking
# each via GET /admin/health: 200 while the node is serving; 503 while draining
# for shutdown OR while syncing (a node back from downtime re-pulling what it
# missed — it would answer stale 404s/partial listings), so both are pulled from
# rotation cleanly. A node that is up but read-only (lost write quorum) still
# answers 200: reads keep flowing, writes return 503 from the node itself (AWS
# SDKs retry 5xx by default and land on a writable node; see the write-aware
# pool below to take read-only nodes out of the write path entirely).
#
# fall 3 / rise 2 (~6s to evict, two clean checks to return) rides out a
# transient blip without flapping the pool. The test/demo cfg
# (docker/cluster/haproxy.cfg) uses fall 2 / rise 1 for faster convergence.
#
# Pair with keepalived (see keepalived.conf) to float a VIP across two HAProxy
# hosts for LB redundancy. Install at /etc/haproxy/haproxy.cfg.

global
    log /dev/log local0
    maxconn 8192
    # tune for many concurrent large object transfers
    tune.bufsize 32768

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    retries 2
    timeout connect 5s
    timeout client 300s        # large uploads / slow clients
    timeout server 300s        # large objects / slow backends
    timeout http-request 30s
    timeout queue 30s

# Optional: HAProxy stats UI on :8404 (bind to a management interface only).
listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 10s
    stats admin if TRUE

frontend arca_front
    bind *:9000
    # For TLS termination at the LB, instead use:
    #   bind *:9000 ssl crt /etc/haproxy/certs/arca.pem
    # (Arca can also do end-to-end TLS itself; then use `mode tcp` and pass through.)
    #
    # Optional write-aware routing (review D5) — see backend arca_writable:
    #   acl is_write method PUT POST DELETE
    #   use_backend arca_writable if is_write
    default_backend arca_nodes

backend arca_nodes
    # Round-robin spreads load but gives no read-your-writes through the LB: a
    # read can hit a node the write has not reached yet (during a partition, a
    # minority node can serve stale reads for the partition's whole duration).
    # For sticky sessions — each client pinned to one node, read-your-writes
    # restored — use instead:
    #   balance source
    balance roundrobin
    option httpchk
    http-check send meth GET uri /admin/health
    http-check expect status 200
    # Replace host:port with your node addresses.
    server arca-1 10.0.0.11:9000 check inter 2s fall 3 rise 2
    server arca-2 10.0.0.12:9000 check inter 2s fall 3 rise 2
    server arca-3 10.0.0.13:9000 check inter 2s fall 3 rise 2

# Optional write-aware pool (review D5): health-check ?writable=1 so a node
# that lost the write quorum (503 read_only) leaves THIS pool while staying in
# arca_nodes for reads. Enable together with the frontend ACL above.
# backend arca_writable
#     balance roundrobin
#     option httpchk
#     http-check send meth GET uri "/admin/health?writable=1"
#     http-check expect status 200
#     server arca-1 10.0.0.11:9000 check inter 2s fall 3 rise 2
#     server arca-2 10.0.0.12:9000 check inter 2s fall 3 rise 2
#     server arca-3 10.0.0.13:9000 check inter 2s fall 3 rise 2
