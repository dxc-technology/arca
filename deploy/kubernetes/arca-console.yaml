# Arca Console — Kubernetes Deployment
#
# Minimal manifest to deploy the Arca web console (nginx + SPA).
# Replace NAMESPACE placeholders or apply with:
#   kubectl apply -f arca-console.yaml -n <your-namespace>
#
# Prerequisites:
#   - Arca server reachable from the cluster (set ARCA_ENDPOINT below)
#   - The published ghcr.io/dxc-technology/arca-console image (public, multi-arch;
#     no image pull secret needed), or
#     your own build of console/Dockerfile pushed to your registry
#
# Customization:
#   - Adjust ARCA_ENDPOINT to point to your Arca server (internal service or external URL)
#   - The image is pinned to the release tag (X.Y.Z) of the Arca server it fronts;
#     bump it together with the server at every release
#   - For TLS on the console itself, mount certs and use nginx-tls.conf (see console docs)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arca-console
  namespace: NAMESPACE
  labels:
    app.kubernetes.io/name: arca-console
    app.kubernetes.io/component: console
    app.kubernetes.io/part-of: arca
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arca-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arca-console
        app.kubernetes.io/component: console
        app.kubernetes.io/part-of: arca
    spec:
      # The image's own user: uid 10001, gid 10001 (console/Dockerfile).
      # Both matter — the image pre-owns nginx's writable paths as 10001:10001,
      # and the entrypoint rewrites index.html and http.d/default.conf at startup.
      # fsGroup is Arca's service GID: when the console terminates TLS itself,
      # it reaches the mounted key through that supplementary group, not
      # through its own UID (see the TLS guide).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # The root filesystem is read-only, but the entrypoint rewrites index.html
      # (endpoint injection) and http.d/default.conf (TLS mode) at startup, so
      # those two directories are copied from the image into emptyDir volumes.
      initContainers:
        - name: seed-writable-paths
          image: ghcr.io/dxc-technology/arca-console:0.32.1
          command:
            - sh
            - -c
            - cp -R /usr/share/nginx/html/. /seed/html/ && cp -R /etc/nginx/http.d/. /seed/http.d/
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: html
              mountPath: /seed/html
            - name: http-d
              mountPath: /seed/http.d
      containers:
        - name: console
          image: ghcr.io/dxc-technology/arca-console:0.32.1   # keep in sync with the release: see RELEASING.md; tag strategy: "Choosing a tag" in the Installation guide
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The console listens on 8080 (8443 when it terminates TLS itself):
          # unprivileged ports, so no capability is needed.
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ARCA_ENDPOINT
              value: "http://arca:9000"  # <-- adjust to your Arca service URL
          # Every path nginx or the entrypoint writes to (console/Dockerfile,
          # the Alpine nginx package defaults): pid file in /tmp, temp dirs under
          # /var/lib/nginx/tmp, /var/cache/nginx, /run/nginx, logs in /var/log/nginx.
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: http-d
              mountPath: /etc/nginx/http.d
            - name: tmp
              mountPath: /tmp
            - name: nginx-temp
              mountPath: /var/lib/nginx/tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run/nginx
            - name: nginx-log
              mountPath: /var/log/nginx
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: html
          emptyDir: {}
        - name: http-d
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: nginx-temp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-log
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: arca-console
  namespace: NAMESPACE
  labels:
    app.kubernetes.io/name: arca-console
    app.kubernetes.io/component: console
    app.kubernetes.io/part-of: arca
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: arca-console
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arca-console
  namespace: NAMESPACE
  labels:
    app.kubernetes.io/name: arca-console
    app.kubernetes.io/component: console
    app.kubernetes.io/part-of: arca
  annotations:
    # Uncomment and adjust for your ingress controller:
    # nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # ingressClassName: nginx           # <-- uncomment and set your ingress class
  rules:
    - host: console.example.com       # <-- replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: arca-console
                port:
                  name: http
  # Uncomment for TLS termination at the ingress:
  # tls:
  #   - hosts:
  #       - console.example.com
  #     secretName: arca-console-tls
