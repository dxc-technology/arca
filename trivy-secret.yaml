# Secret-scanner allow-list for Trivy (`trivy fs` / `trivy image --scanners secret`).
#
# Referenced by trivy.yaml. Matches are exempted by VALUE, not by path, so the
# same fixed root/test credential is recognized wherever it appears (compose
# files, docs, test fixtures, the console login placeholder).
allow-rules:
  - id: arca-fixed-test-credentials
    description: >
      Arca's fixed root access key and secret key, used only to authenticate
      against Arca containers started locally by bin/test and bin/screenshots.
      Never valid against real AWS accounts. See tests/integration/conftest.py
      and docker/docker-compose.yml.
    regex: 'AKIA5B6BSHJA8CIHZSVG|hQBDe6WnX9umjbSGCrld7YRUoYfaQUhUcJS/UAgv'
