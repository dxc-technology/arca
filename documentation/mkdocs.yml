site_name: Arca
site_description: Open source S3-compatible object storage server written in Rust
site_url: https://dxc-technology.github.io/arca/
repo_url: https://github.com/dxc-technology/arca
repo_name: dxc-technology/arca

docs_dir: docs
site_dir: ../docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
  - User Guide:
    - Configuration: guide/configuration.md
    - Access Control: guide/access-control.md
    - TLS: guide/tls.md
    - Encryption: guide/encryption.md
    - Compression: guide/compression.md
    - Replication: guide/replication.md
    - High Availability: guide/ha.md
    - Notification Connectors: guide/connectors.md
    - Web Console: guide/console.md
    - CLI Reference: guide/cli.md
  - Reference:
    - Architecture: reference/architecture.md
    - S3 API: reference/s3-api.md
    - Admin API: reference/admin-api.md
  - Operations:
    - Disaster Recovery: operations/recovery.md
    - Monitoring & Logging: operations/monitoring.md
    - Production Deployment: operations/deployment.md
    - Troubleshooting: operations/troubleshooting.md
  - Roadmap: roadmap.md
  - Changelog: changelog.md
  - Technical Debt: tech-debt.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
