[server]
bind = "0.0.0.0"
port = 9000

# [server.tls]
# cert_dir = "/etc/arca/certs"       # auto-detect cert and key in this directory
# cert_file = "arca-server.crt"      # relative to cert_dir, or absolute path
# key_file = "arca-server.key"       # relative to cert_dir, or absolute path
# ca_file = "arca-ca.crt"            # client CA for mTLS (optional)

[storage]
data_dir = "/data"

# [encryption]
# enabled = true                       # encrypt all buckets by default (default: false)
# master_key = ""                      # base64-encoded 256-bit key (generate with: arca encryption generate-key)
#                                      # required when [encryption] section is present
#                                      # when enabled = false, per-bucket encryption is still available
# previous_master_key = ""             # previous key for rotation (optional)
