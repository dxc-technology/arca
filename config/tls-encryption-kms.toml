[server]
bind = "0.0.0.0"
port = 9000

[server.tls]
cert_dir = "/etc/arca/certs"

[storage]
data_dir = "/data"

[encryption]
# enabled = false by default; set to true for global encryption.
# Per-bucket encryption is available regardless.

[encryption.kms]
endpoint = "http://openbao:8200"
auth_method = "token"
token = "dev-root-token"
# Defaults: secret_path = "secret/arca/master-key", secret_field = "key"
