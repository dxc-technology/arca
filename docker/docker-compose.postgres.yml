# PostgreSQL metadata backend overlay for development and testing.
# Usage:
#   bin/arca start -d --build --dev --postgres
#   bin/test postgres

services:
  postgres:
    # Debian, not Alpine: glibc collates TEXT by the en_US.UTF-8 locale, as
    # most real deployments do, while musl compares bytes and would hide any
    # query that depends on the database locale (see migration 0017).
    image: postgres:17
    environment:
      POSTGRES_USER: arca
      POSTGRES_PASSWORD: arca
      POSTGRES_DB: arca
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arca"]
      interval: 5s
      timeout: 3s
      retries: 5

  arca:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
