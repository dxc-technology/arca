services:
  # A second Arca instance ("replica") on port 9001. The primary `arca`
  # service replicates to this instance via the PutBucketReplication rules
  # configured in the integration test setup.
  arca-replica:
    image: arca
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ${BUILD_TARGET:-production}
    ports:
      - "${ARCA_REPLICA_HOST_PORT:-9001}:9000"
    volumes:
      - arca-replica-data:/data
    environment:
      - ARCA_LOG=${ARCA_LOG:-info}
      - ARCA_ROOT_ACCESS_KEY=${ARCA_ROOT_ACCESS_KEY:-AKIA5B6BSHJA8CIHZSVG}
      - ARCA_ROOT_SECRET_KEY=${ARCA_ROOT_SECRET_KEY:-hQBDe6WnX9umjbSGCrld7YRUoYfaQUhUcJS/UAgv}

  # Integration-test client can reach both endpoints.
  test:
    environment:
      - ARCA_ENDPOINT=http://arca:9000
      - ARCA_REPLICA_ENDPOINT=http://arca-replica:9000
      - AWS_ACCESS_KEY_ID=AKIA5B6BSHJA8CIHZSVG
      - AWS_SECRET_ACCESS_KEY=hQBDe6WnX9umjbSGCrld7YRUoYfaQUhUcJS/UAgv
    depends_on:
      - arca
      - arca-replica

volumes:
  arca-replica-data:
