services:
  arca:
    image: arca
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ${BUILD_TARGET:-production}
    ports:
      - "9000:9000"
    volumes:
      - arca-data:/data
    environment:
      - RUST_LOG=info
      - ARCA_ROOT_ACCESS_KEY=AKIAIOSFODNN7EXAMPLE
      - ARCA_ROOT_SECRET_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

  unit-test:
    image: arca-unit-test
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    profiles:
      - test

  test:
    image: arca-test
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    environment:
      - ARCA_ENDPOINT=http://arca:9000
      - AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
      - AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    depends_on:
      - arca
    profiles:
      - test

  console:
    image: arca-console
    build:
      context: ../console
      dockerfile: Dockerfile
    ports:
      - "9080:3000"
    environment:
      - ARCA_ENDPOINT=http://localhost:9000
    depends_on:
      - arca
    profiles:
      - console

  s3-tests:
    image: arca-s3-tests
    build:
      context: s3-tests
      dockerfile: Dockerfile
    environment:
      - S3TEST_CONF=/s3-tests/s3tests.conf
    volumes:
      - ../s3-tests:/s3-tests/output
    depends_on:
      - arca
    profiles:
      - s3-tests

  perf-test:
    image: arca-perf-test
    build:
      context: ..
      dockerfile: docker/Dockerfile.perf
    environment:
      - ARCA_ENDPOINT=http://arca:9000
      - AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
      - AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    depends_on:
      - arca
    profiles:
      - perf

  screenshots-console:
    image: arca-console
    build:
      context: ../console
      dockerfile: Dockerfile
    depends_on:
      - arca
    profiles:
      - screenshots

  screenshots:
    image: arca-screenshots
    build:
      context: screenshots
      dockerfile: Dockerfile
    # Share network with screenshots-console so Playwright browser can reach
    # the console at localhost:3000 — required for crypto.subtle (Web Crypto API
    # only works in secure contexts: HTTPS or localhost).
    network_mode: "service:screenshots-console"
    environment:
      - ARCA_ENDPOINT=http://arca:9000
      - CONSOLE_URL=http://localhost:3000
      - AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
      - AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    volumes:
      - ../documentation/docs/assets/screenshots:/app/output
    depends_on:
      - arca
    profiles:
      - screenshots

volumes:
  arca-data:
