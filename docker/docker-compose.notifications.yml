services:
  webhook-receiver:
    # Explicit name, like every other locally built service (arca-test,
    # arca-console, arca-grpc-receiver). Without it compose derives
    # `docker-webhook-receiver` from the project dir and any image built
    # under the old name lingers as an untracked orphan.
    image: arca-webhook-receiver
    build:
      context: ./webhook-receiver
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8765/health"]
      interval: 2s
      timeout: 5s
      retries: 10
