# Config overlay -- mounts the auto-generated config into the Arca container.
# Used automatically by bin/lib/compose.sh when features are enabled.
# ARCA_GENERATED_CONFIG is set by use_test_project: each self-contained test
# suite generates its own config, never the developer's .generated.toml.

services:
  arca:
    volumes:
      - ${ARCA_GENERATED_CONFIG:-../config/.generated.toml}:/etc/arca/config.toml:ro
