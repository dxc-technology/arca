# TLS overlay -- adds HTTPS infrastructure to Arca and the console.
#
# Provides: certificate mounts, console HTTPS port.
# Config is handled separately by docker-compose.config.yml.
#
# ARCA_CERTS_DIR is where the certificates come from: ../certs (the user's
# own), ../certs/local (generated and kept valid by `arca tls ensure`), both
# chosen by bin/arca at start, or arca-tls-test-certs, the named volume the
# self-contained TLS suites generate throwaway certificates into.

services:
  arca:
    volumes:
      - ${ARCA_CERTS_DIR:-../certs}:/etc/arca/certs:ro
      - arca-data:/data
    ports:
      - "9000:9000"

  test:
    volumes:
      - ${ARCA_CERTS_DIR:-../certs}:/etc/arca/certs:ro
    profiles:
      - tls-test

  console:
    environment:
      - ARCA_ENDPOINT=
    # The console runs as uid 100, Arca as 65532, and both read the same key
    # from ${ARCA_CERTS_DIR} (see the header). The key is group-readable by Arca's service GID (0640,
    # group 65532), so the console needs that GID as a supplementary group —
    # the compose equivalent of the fsGroup in deploy/kubernetes.
    group_add: ["65532"]
    volumes:
      - ${ARCA_CERTS_DIR:-../certs}:/etc/nginx/certs:ro
    ports:
      - "9443:443"
    profiles:
      - console

volumes:
  # Fixed name: bin/lib/compose.sh (make_test_certs) creates and fills it
  # with plain `docker` commands, outside compose's project naming.
  arca-tls-test-certs:
    name: arca-tls-test-certs
