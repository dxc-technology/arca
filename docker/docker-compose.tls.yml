# TLS overlay -- adds HTTPS infrastructure to Arca and the console.
#
# Provides: tls-init service, certificate mounts, console HTTPS port.
# Config is handled separately by docker-compose.config.yml.

services:
  tls-init:
    image: arca
    volumes:
      - ../certs:/etc/arca/certs
    entrypoint: ["/usr/local/bin/arca", "tls", "generate", "--output-dir", "/etc/arca/certs", "--sans", "arca,localhost,127.0.0.1,::1"]
    profiles:
      - tls-init

  arca:
    volumes:
      - ../certs:/etc/arca/certs:ro
      - arca-data:/data
    ports:
      - "9000:9000"

  test:
    volumes:
      - ../certs:/etc/arca/certs:ro
    profiles:
      - tls-test

  console:
    environment:
      - ARCA_ENDPOINT=
    volumes:
      - ../certs:/etc/nginx/certs:ro
    ports:
      - "9443:443"
    profiles:
      - console
