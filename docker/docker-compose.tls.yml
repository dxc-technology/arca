services:
  tls-init:
    image: arca
    volumes:
      - tls-certs:/etc/arca/certs
    entrypoint: ["/usr/local/bin/arca", "tls", "generate", "--output-dir", "/etc/arca/certs", "--sans", "arca,localhost,127.0.0.1,::1"]
    profiles:
      - tls-init

  arca:
    volumes:
      - tls-certs:/etc/arca/certs:ro
      - arca-data:/data
      - ../config/tls-test.toml:/etc/arca/config.toml:ro
    ports:
      - "9000:9000"
    profiles:
      - tls

  test:
    environment:
      - ARCA_ENDPOINT=https://arca:9000
      - AWS_CA_BUNDLE=/etc/arca/certs/arca-ca.crt
    volumes:
      - tls-certs:/etc/arca/certs:ro
    profiles:
      - tls

volumes:
  tls-certs:
