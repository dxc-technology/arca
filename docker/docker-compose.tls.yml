# TLS overlay -- adds HTTPS infrastructure to Arca and the console.
#
# Provides: tls-init service, certificate mounts, console HTTPS port.
# Config is handled separately by docker-compose.config.yml.
#
# ARCA_CERTS_DIR is the certificate directory bin/arca chose at start:
# ../certs (the user's own certificates) or ../certs/local (generated and
# kept valid by `arca tls ensure`).

services:
  tls-init:
    image: ghcr.io/dxc-technology/arca:${BUILD_TARGET:-production}
    volumes:
      - ../certs:/etc/arca/certs
    entrypoint: ["/usr/local/bin/arca", "tls", "generate", "--output-dir", "/etc/arca/certs", "--sans", "arca,localhost,127.0.0.1,::1"]
    profiles:
      - tls-init

  arca:
    volumes:
      - ${ARCA_CERTS_DIR:-../certs}:/etc/arca/certs:ro
      - arca-data:/data
    ports:
      - "9000:9000"

  test:
    volumes:
      - ${ARCA_CERTS_DIR:-../certs}:/etc/arca/certs:ro
    profiles:
      - tls-test

  console:
    environment:
      - ARCA_ENDPOINT=
    # The console runs as uid 100, Arca as 65532, and both read the same key
    # from ./certs. The key is group-readable by Arca's service GID (0640,
    # group 65532), so the console needs that GID as a supplementary group —
    # the compose equivalent of the fsGroup in deploy/kubernetes.
    group_add: ["65532"]
    volumes:
      - ${ARCA_CERTS_DIR:-../certs}:/etc/nginx/certs:ro
    ports:
      - "9443:443"
    profiles:
      - console
