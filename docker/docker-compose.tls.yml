# TLS overlay — adds HTTPS support to Arca and the console.
#
# Used by:
#   bin/arca start --tls       (real certs in ./certs/, auto-detect config)
#   bin/console start --tls    (console serves HTTPS on port 9443)
#   bin/test tls               (self-signed certs, explicit filenames via tls-test overlay)

services:
  tls-init:
    image: arca
    volumes:
      - ../certs:/etc/arca/certs
    entrypoint: ["/usr/local/bin/arca", "tls", "generate", "--output-dir", "/etc/arca/certs", "--sans", "arca,localhost,127.0.0.1,::1"]
    profiles:
      - tls-init

  arca:
    volumes:
      - ../certs:/etc/arca/certs:ro
      - arca-data:/data
      - ../config/tls.toml:/etc/arca/config.toml:ro
    ports:
      - "9000:9000"

  test:
    environment:
      - ARCA_ENDPOINT=https://arca:9000
      - AWS_CA_BUNDLE=/etc/arca/certs/arca-ca.crt
    volumes:
      - ../certs:/etc/arca/certs:ro
    profiles:
      - tls-test

  console:
    environment:
      - ARCA_ENDPOINT=
    volumes:
      - ../certs:/etc/nginx/certs:ro
    ports:
      - "9443:3000"
    profiles:
      - console
