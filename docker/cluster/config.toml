# 3-node HA cluster config — IDENTICAL on every node (the symmetry invariant).
#
# Each node derives and persists its own node_id in its data volume and reaches
# peers via the static seed list (the three service names). Static discovery is
# used instead of mDNS because Docker's bridge network does not pass multicast.
# A node ignores its own entry in the seeds (it recognises its own node_id in
# the health response).
[server]
bind = "0.0.0.0"
port = 9000

[storage]
data_dir = "/data"

[cluster]
enabled = true
cluster_id = "arca-cluster"
# Shared secret authenticating inter-node /cluster/v1/* requests. DEV value
# (passes the M5 strength floor) — change for any real deployment
# (`openssl rand -hex 32`).
secret = "arca-itest-cluster-secret-3f9c2a71"
# CP policy: a write needs a majority (2 of 3) of live nodes to be acknowledged.
mode = "quorum"
cluster_size = 3
discovery = "static"
# The arca-N-cluster aliases exist ONLY on the compose `cluster` network, so a
# partition test (`bin/cluster partition <n>` = docker network disconnect) cuts
# inter-node traffic while the `mgmt` network keeps the node reachable by the
# test runner under its plain service name.
seeds = ["arca-1-cluster:9000", "arca-2-cluster:9000", "arca-3-cluster:9000"]
# Tighter intervals than the defaults for fast convergence in tests/demos.
health_interval_seconds = 3
anti_entropy_interval_seconds = 5
# Snappy fan-out/probe timeout so writes aimed at an unreachable peer fail fast
# during partition tests (not part of the config-drift fingerprint).
request_timeout_seconds = 5

# Short lifecycle-evaluation interval so the R6 worker-leader tests observe an
# expiry within seconds (default: 3600). Not part of the drift fingerprint.
[lifecycle]
interval_seconds = 5

# Audit + metrics enabled so the R8 per-node view tests (review D6, decision
# H9) can assert that `?node=` really reaches a specific node's own data: both
# stores are strictly node-local. Not part of the drift fingerprint.
[monitoring.audit]
enabled = true

[monitoring.metrics]
enabled = true
