# HAProxy for the 3-node Arca cluster: round-robins S3/admin/console traffic
# across the live nodes, health-checking each via GET /admin/health (200 = up,
# 503 = draining → taken out of rotation). A node that is up but read-only
# (lost write quorum) still answers 200, so reads keep flowing and writes return
# 503 from the node itself — the intended behaviour.
global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option http-server-close
    timeout connect 5s
    timeout client 75s
    timeout server 75s

frontend arca_front
    bind *:9000
    default_backend arca_nodes

backend arca_nodes
    balance roundrobin
    option httpchk
    http-check send meth GET uri /admin/health
    http-check expect status 200
    server arca-1 arca-1:9000 check inter 2s fall 2 rise 1
    server arca-2 arca-2:9000 check inter 2s fall 2 rise 1
    server arca-3 arca-3:9000 check inter 2s fall 2 rise 1
