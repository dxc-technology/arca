# HAProxy for the 3-node Arca cluster: round-robins S3/admin/console traffic
# across the live nodes, health-checking each via GET /admin/health (200 = up;
# 503 = draining or syncing — i.e. a node still re-pulling what it missed while
# down — taken out of rotation). A node that is up but read-only (lost write
# quorum) still answers 200, so reads keep flowing and writes return 503 from
# the node itself — the intended behaviour (see the write-pool note below for
# the alternative).
#
# fall 2 / rise 1 evicts a dead node in ~4s — tuned for tests and demos, where
# fast convergence matters more than stability. The production reference
# (deploy/haproxy/haproxy.cfg) uses fall 3 / rise 2 to ride out a transient
# blip without flapping the pool.
global
    log stdout format raw local0
    maxconn 4096

# Docker's embedded DNS. HAProxy otherwise resolves the node names once at
# startup: a node that restarts (docker kill + start, a partition heal) can
# come back with a different IP, and the LB would keep routing to the old one,
# i.e. to nothing or to whichever container got that IP. Re-resolved every
# second; a name that does not resolve (node stopped) puts the server in
# maintenance until it comes back.
resolvers docker
    nameserver docker_dns 127.0.0.11:53
    hold valid 1s

defaults
    mode http
    log global
    option httplog
    option http-server-close
    # A request whose connection to a node fails (typically a node that has
    # just died and is not evicted yet: the health check needs a few seconds)
    # is retried on ANOTHER node, not on the same dead one. Only connection
    # failures are retried (HAProxy's default `retry-on conn-failure`): the
    # request never reached Arca, so this is safe for non-idempotent writes.
    retries 2
    option redispatch 1
    # Local bridge network: a healthy node accepts in microseconds, so a short
    # connect timeout bounds the delay before the request is redispatched.
    timeout connect 1s
    # Every server: runtime re-resolution (see `resolvers docker`); `none`
    # lets HAProxy start even when a node name does not resolve yet.
    default-server resolvers docker init-addr libc,none
    timeout client 75s
    timeout server 75s

frontend arca_front
    bind *:9000
    default_backend arca_nodes

backend arca_nodes
    # Round-robin spreads load but gives no read-your-writes through the LB: a
    # read can hit a node the write has not reached yet. For sticky sessions
    # (each client pinned to one node) use instead:
    #   balance source
    balance roundrobin
    option httpchk
    http-check send meth GET uri /admin/health
    http-check expect status 200
    server arca-1 arca-1:9000 check inter 2s fall 2 rise 1
    server arca-2 arca-2:9000 check inter 2s fall 2 rise 1
    server arca-3 arca-3:9000 check inter 2s fall 2 rise 1

# Optional write-aware pool: health-check ?writable=1 so a node
# that lost the write quorum (503 read_only) leaves THIS pool while staying in
# the default one for reads. Route write methods to it from the frontend:
#   acl is_write method PUT POST DELETE
#   use_backend arca_writable if is_write
# backend arca_writable
#     balance roundrobin
#     option httpchk
#     http-check send meth GET uri "/admin/health?writable=1"
#     http-check expect status 200
#     server arca-1 arca-1:9000 check inter 2s fall 2 rise 1
#     server arca-2 arca-2:9000 check inter 2s fall 2 rise 1
#     server arca-3 arca-3:9000 check inter 2s fall 2 rise 1
