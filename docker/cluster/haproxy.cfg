# HAProxy for the 3-node Arca cluster: round-robins S3/admin/console traffic
# across the live nodes, health-checking each via GET /admin/health (200 = up;
# 503 = draining or syncing — i.e. a node still re-pulling what it missed while
# down — taken out of rotation). A node that is up but read-only (lost write
# quorum) still answers 200, so reads keep flowing and writes return 503 from
# the node itself — the intended behaviour (see the write-pool note below for
# the alternative).
#
# fall 2 / rise 1 evicts a dead node in ~4s — tuned for tests and demos, where
# fast convergence matters more than stability. The production reference
# (deploy/haproxy/haproxy.cfg) uses fall 3 / rise 2 to ride out a transient
# blip without flapping the pool.
global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option http-server-close
    timeout connect 5s
    timeout client 75s
    timeout server 75s

frontend arca_front
    bind *:9000
    default_backend arca_nodes

backend arca_nodes
    # Round-robin spreads load but gives no read-your-writes through the LB: a
    # read can hit a node the write has not reached yet. For sticky sessions
    # (each client pinned to one node) use instead:
    #   balance source
    balance roundrobin
    option httpchk
    http-check send meth GET uri /admin/health
    http-check expect status 200
    server arca-1 arca-1:9000 check inter 2s fall 2 rise 1
    server arca-2 arca-2:9000 check inter 2s fall 2 rise 1
    server arca-3 arca-3:9000 check inter 2s fall 2 rise 1

# Optional write-aware pool (review D5): health-check ?writable=1 so a node
# that lost the write quorum (503 read_only) leaves THIS pool while staying in
# the default one for reads. Route write methods to it from the frontend:
#   acl is_write method PUT POST DELETE
#   use_backend arca_writable if is_write
# backend arca_writable
#     balance roundrobin
#     option httpchk
#     http-check send meth GET uri "/admin/health?writable=1"
#     http-check expect status 200
#     server arca-1 arca-1:9000 check inter 2s fall 2 rise 1
#     server arca-2 arca-2:9000 check inter 2s fall 2 rise 1
#     server arca-3 arca-3:9000 check inter 2s fall 2 rise 1
