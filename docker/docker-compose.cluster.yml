# Standalone 3-node Arca HA cluster for integration tests and local demos.
#
# Run via `bin/cluster up` (not `bin/arca`, which manages the single-node dev
# flow). Three symmetric nodes (arca-1/2/3) share one identical cluster config
# and the same root credentials + cluster secret; each has its own data volume.
# HAProxy fronts them on :9000 with a /admin/health check; the console talks to
# the load balancer, exactly like a real deployment.
#
# Node ports 9001/9002/9003 are also exposed for direct per-node inspection
# (e.g. GET /admin/cluster on a specific node, or killing one mid-test).
#
# TWO networks, so partition tests can cut inter-node traffic without losing
# test access to the isolated node:
#   cluster  inter-node + LB traffic. Each node carries an `arca-N-cluster`
#            alias that exists ONLY here, and the seed list uses those aliases:
#            `bin/cluster partition <n>` (docker network disconnect) makes the
#            node unreachable BY PEERS while its process stays alive.
#   mgmt     test runner <-> every node, never partitioned. Plain service names
#            (arca-1/2/3) keep resolving here, so the runner can assert against
#            a partitioned node directly.
# NOTE: a partitioned node's published host port may stay dark until the
# container restarts (the port NATs to one container IP); tests poll node 1's
# host port only and reach partitioned nodes from inside the mgmt network.

x-arca-node: &arca-node
  image: arca
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: ${BUILD_TARGET:-production}
  # NOTE: each node overrides `volumes` (to add its own data volume) and
  # `networks` (its cluster-only alias); a YAML merge does not concatenate
  # lists/maps, so both blocks are repeated per node.
  environment:
    - ARCA_LOG=${ARCA_LOG:-info}
    - ARCA_ROOT_ACCESS_KEY=${ARCA_ROOT_ACCESS_KEY:-AKIA5B6BSHJA8CIHZSVG}
    - ARCA_ROOT_SECRET_KEY=${ARCA_ROOT_SECRET_KEY:-hQBDe6WnX9umjbSGCrld7YRUoYfaQUhUcJS/UAgv}
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  sysctls:
    net.core.somaxconn: "4096"

services:
  arca-1:
    <<: *arca-node
    volumes:
      - arca-1-data:/data
      - ../docker/cluster/config.toml:/etc/arca/config.toml:ro
    networks:
      cluster:
        aliases: [arca-1-cluster]
      mgmt: {}
    ports:
      - "${ARCA_NODE1_HOST_PORT:-9001}:9000"

  arca-2:
    <<: *arca-node
    volumes:
      - arca-2-data:/data
      - ../docker/cluster/config.toml:/etc/arca/config.toml:ro
    networks:
      cluster:
        aliases: [arca-2-cluster]
      mgmt: {}
    ports:
      - "${ARCA_NODE2_HOST_PORT:-9002}:9000"

  arca-3:
    <<: *arca-node
    volumes:
      - arca-3-data:/data
      - ../docker/cluster/config.toml:/etc/arca/config.toml:ro
    networks:
      cluster:
        aliases: [arca-3-cluster]
      mgmt: {}
    ports:
      - "${ARCA_NODE3_HOST_PORT:-9003}:9000"

  # Load balancer: single entry point on :9000, round-robin over live nodes.
  # Cluster network only: during a partition it loses the isolated node, like
  # a real LB would. HAProxy resolves backend names once at startup, so a
  # healed node that re-attached with a new IP may stay out of rotation; the
  # partition test phases are self-contained (fresh up/down) to absorb this.
  arca-lb:
    image: haproxy
    volumes:
      - ../docker/cluster/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${ARCA_HOST_PORT:-9000}:9000"
    networks:
      - cluster
    depends_on:
      - arca-1
      - arca-2
      - arca-3

  # Integration test runner (boto3/pytest). Talks to the load balancer for the
  # client-facing assertions and to each node directly for per-node replication
  # and catch-up checks. Driven by `bin/test cluster` (profile `test`). On both
  # networks: `cluster` to reach the LB, `mgmt` to reach partitioned nodes.
  test:
    image: arca-test
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    environment:
      - ARCA_ENDPOINT=http://arca-lb:9000
      - ARCA_NODE1_ENDPOINT=http://arca-1:9000
      - ARCA_NODE2_ENDPOINT=http://arca-2:9000
      - ARCA_NODE3_ENDPOINT=http://arca-3:9000
      - AWS_ACCESS_KEY_ID=${ARCA_ROOT_ACCESS_KEY:-AKIA5B6BSHJA8CIHZSVG}
      - AWS_SECRET_ACCESS_KEY=${ARCA_ROOT_SECRET_KEY:-hQBDe6WnX9umjbSGCrld7YRUoYfaQUhUcJS/UAgv}
    networks:
      - cluster
      - mgmt
    depends_on:
      - arca-lb
    profiles:
      - test

  # Web console, pointed at the load balancer (like a real deployment).
  console:
    image: arca-console
    build:
      context: ../console
      dockerfile: Dockerfile
    ports:
      - "${CONSOLE_HOST_PORT:-9080}:80"
    environment:
      - ARCA_ENDPOINT=${ARCA_CONSOLE_ENDPOINT:-http://localhost:9000}
    networks:
      - cluster
    depends_on:
      - arca-lb
    profiles:
      - console

networks:
  cluster:
  mgmt:

volumes:
  arca-1-data:
  arca-2-data:
  arca-3-data:
