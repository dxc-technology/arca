# Per-bucket encryption test overlay — starts Arca with encryption key
# available but global default OFF, to test per-bucket encryption.
# Used by: bin/test per-bucket-encryption

services:
  arca:
    volumes:
      - ../config/per-bucket-encryption-test.toml:/etc/arca/config.toml:ro

  test:
    environment:
      - ARCA_PER_BUCKET_ENCRYPTION=1
    profiles:
      - per-bucket-encryption-test
