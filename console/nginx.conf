server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Icons / favicons never change — safe to cache aggressively.
    location ~* \.(ico|png|svg)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Console JS is NOT fingerprinted (no content hash in the filename), so
    # `immutable` would pin stale versions in browser caches across console
    # rebuilds. Let nginx fall back to ETag-based revalidation: cheap, and
    # guarantees that a fresh console image deploys instantly.
    location ~* \.js$ {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
