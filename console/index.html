<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arca Console</title>

  <!-- Console version and documentation URL -->
  <script>
    window.ARCA_CONSOLE_VERSION = "0.22.0";
    window.ARCA_DOCS_URL = "https://dxc-technology.github.io/arca/";
  </script>

  <!-- Env var injection (replaced by docker-entrypoint.sh) -->
  <script>
    window.__ARCA_CONFIG__ = {
      endpoint: "ARCA_INJECT_ENDPOINT_HERE"
    };
  </script>

  <!-- Favicon (SVG, matches docs site) -->
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            vault: {
              bg: '#0f172a',
              card: '#1e293b',
              border: '#334155',
              text: '#e2e8f0',
              muted: '#94a3b8',
              accent: '#00d4ff',
              indigo: '#6366f1',
            }
          },
          fontFamily: {
            display: ['"DM Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Syntax highlighting (highlight.js) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github-dark-dimmed.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>

  <!-- Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>

  <!-- App module (registers Alpine.data before Alpine initializes).
       The ?v=... query param is fingerprinted per console version so browser
       caches never pin stale code across console upgrades. Keep this in sync
       with window.ARCA_CONSOLE_VERSION above. -->
  <script type="module" src="/js/app.js?v=0.22.0-xaxis-fix"></script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    [x-cloak] { display: none !important; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    /* Glassmorphism card */
    .glass {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.5);
    }

    /* Subtle glow on hover */
    .glass-hover:hover {
      border-color: rgba(0, 212, 255, 0.3);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.05);
    }

    /* Pulse animation for health dot */
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4); }
      50% { box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
    }
    .pulse-green { animation: pulse-glow 2s ease-in-out infinite; }

    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.4); }
      50% { box-shadow: 0 0 0 6px rgba(248, 113, 113, 0); }
    }
    .pulse-red { animation: pulse-red 2s ease-in-out infinite; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Hide scrollbar but keep scrolling */
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }

    /* Override highlight.js theme background to match our glass panels */
    pre code.hljs { background: transparent; padding: 0; }


    /* Drag-drop zone active */
    .drop-active {
      border-color: #00d4ff !important;
      background: rgba(0, 212, 255, 0.05) !important;
    }

    /* Ring chart transition */
    .ring-segment { transition: opacity 0.2s ease; }
    .ring-segment:hover { opacity: 0.8; }

    /* Treemap rect */
    .treemap-rect { transition: opacity 0.15s ease; cursor: pointer; }
    .treemap-rect:hover { opacity: 0.85; }

    /* Native form controls — force dark color-scheme so user-agent widgets
       (number-input spinners, <select> chevrons, date/time pickers, native
       scrollbars) render with light glyphs on our dark background. Without
       this Chromium/Safari draw near-invisible dark-grey arrows. */
    input[type="number"],
    input[type="date"],
    input[type="datetime-local"],
    input[type="time"],
    input[type="month"],
    input[type="week"],
    select,
    textarea {
      color-scheme: dark;
    }
    /* Legacy class used by a handful of inputs — kept for compatibility. */
    .setting-number { color-scheme: dark; }

    /* Inline-help system: tiny "?" button that shows a hover tooltip and
       opens the global help modal on click. Reused across every settings
       card — see console/js/help.js for the content catalog. */
    .help-trigger {
      width: 14px; height: 14px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%;
      font-size: 10px; font-weight: 700; line-height: 1;
      color: rgba(148,163,184,0.9); background: rgba(148,163,184,0.08);
      border: 1px solid rgba(148,163,184,0.25);
      cursor: help; transition: all 0.15s;
      font-family: 'DM Sans', system-ui, sans-serif;
    }
    .help-trigger:hover {
      color: #00d4ff; background: rgba(0,212,255,0.12);
      border-color: rgba(0,212,255,0.45);
    }
    .help-host { position: relative; display: inline-flex; align-items: center; }
    .help-tooltip {
      position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
      padding: 6px 10px; border-radius: 6px; font-size: 11px; line-height: 1.35;
      background: #111b2e; border: 1px solid rgba(148,163,184,0.25);
      color: #e2e8f0;
      max-width: 260px; width: max-content;
      white-space: normal; text-align: left;
      opacity: 0; pointer-events: none; transition: opacity 0.15s;
      z-index: 40;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    .help-tooltip::after {
      content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      border: 5px solid transparent; border-top-color: rgba(148,163,184,0.25);
    }
    .help-host:hover .help-tooltip { opacity: 1; }

    /* Algorithm / option row used inside the help modal body. */
    .help-row { display: grid; grid-template-columns: 100px 1fr; gap: 12px; padding: 9px 0; border-top: 1px solid rgba(148,163,184,0.12); }
    .help-row:first-child { border-top: 0; }
    .help-row-key { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #00d4ff; padding-top: 2px; }
    .help-row-text { font-size: 12px; line-height: 1.5; color: #e2e8f0; }
    .help-row-best { display: block; color: #94a3b8; font-size: 11px; margin-top: 3px; }
    .help-note { padding: 10px 12px; border-radius: 8px; font-size: 11.5px; line-height: 1.5; margin-top: 12px; }
    .help-note.info { background: rgba(0,212,255,0.07); border: 1px solid rgba(0,212,255,0.25); color: #bae6fd; }
    .help-note.warn { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.3); color: #fde68a; }
    .help-note.tip  { background: rgba(34,197,94,0.07); border: 1px solid rgba(34,197,94,0.25); color: #bbf7d0; }

    /* Column header filters */
    .col-filter { position: relative; user-select: none; }
    .col-label { cursor: pointer; display: flex; align-items: center; gap: 4px; transition: color 0.15s; white-space: nowrap; }
    .col-label:hover { color: #e2e8f0; }
    .col-label .fi { width: 10px; height: 10px; opacity: 0; transition: opacity 0.15s; flex-shrink: 0; }
    .col-filter:hover .fi { opacity: 0.5; }
    .col-filter.active .fi { opacity: 1; color: #00d4ff; }
    .col-filter.active::after {
      content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 16px; height: 2px; background: #00d4ff; border-radius: 1px;
      pointer-events: none;
    }
    /* In fixed-layout tables, <th> stretches full height so ::after leaks to table bottom.
       Clip it by making the <th> itself the containing block with bounded height. */
    table[style*="table-layout"] th { position: relative; overflow: hidden; }
    .filter-badge {
      display: inline-flex; align-items: center; gap: 3px;
      font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #00d4ff;
      max-width: 100%; cursor: pointer;
    }
    .filter-badge .val { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fbx {
      flex-shrink: 0; width: 12px; height: 12px; display: flex; align-items: center; justify-content: center;
      border-radius: 2px; cursor: pointer; opacity: 0.6; transition: opacity 0.1s, background 0.1s;
    }
    .fbx:hover { opacity: 1; background: rgba(0,212,255,0.15); }
    .col-popover {
      position: absolute; top: calc(100% + 6px); left: -8px; z-index: 50;
      border-radius: 8px; background: #1e293b; border: 1px solid rgba(51,65,85,0.7);
      box-shadow: 0 12px 32px rgba(0,0,0,0.4); animation: colPopIn 0.12s ease-out;
    }
    @keyframes colPopIn { from { opacity: 0; transform: translateY(-3px); } }
    .col-popover .pop-search { padding: 8px; border-bottom: 1px solid rgba(51,65,85,0.4); }
    .col-popover .pop-search input {
      width: 100%; background: rgba(15,23,42,0.8); border: 1px solid rgba(51,65,85,0.5);
      border-radius: 5px; color: #e2e8f0; font-size: 11px; padding: 4px 8px; outline: none;
      font-family: 'JetBrains Mono', monospace;
    }
    .col-popover .pop-search input::placeholder { color: #475569; }
    .col-popover .pop-search input:focus { border-color: rgba(0,212,255,0.4); }
    .col-popover .pop-list { max-height: 200px; overflow-y: auto; padding: 4px; }
    .col-popover .pop-list::-webkit-scrollbar { width: 4px; }
    .col-popover .pop-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    .pop-item {
      padding: 4px 8px; border-radius: 5px; cursor: pointer; transition: background 0.1s;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #94a3b8;
      display: flex; align-items: center; gap: 6px;
    }
    .pop-item:hover { background: rgba(0,212,255,0.08); color: #e2e8f0; }
    .pop-item.selected { color: #00d4ff; }
    .pop-item .check {
      width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid #475569;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.12s;
    }
    .pop-item.selected .check { border-color: #00d4ff; background: #00d4ff; }
    .pop-item .check svg { width: 8px; height: 8px; opacity: 0; }
    .pop-item.selected .check svg { opacity: 1; }
    .pop-item .cnt { margin-left: auto; font-size: 9px; color: #475569; }
    .time-pop {
      position: absolute; top: calc(100% + 6px); left: -8px; z-index: 50;
      padding: 10px; border-radius: 8px; background: #1e293b;
      border: 1px solid rgba(51,65,85,0.7); box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      animation: colPopIn 0.12s ease-out; min-width: 200px;
    }
    .time-pop label { display: block; font-size: 10px; color: #94a3b8; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .time-pop input[type="datetime-local"] {
      color-scheme: dark; width: 100%; background: rgba(15,23,42,0.8);
      border: 1px solid rgba(51,65,85,0.6); border-radius: 5px; color: #e2e8f0;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 4px 8px; outline: none;
    }
    .time-pop input:focus { border-color: rgba(0,212,255,0.5); }
    .key-inline {
      background: rgba(15,23,42,0.8); border: 1px solid rgba(0,212,255,0.3);
      border-radius: 4px; color: #e2e8f0; font-family: 'JetBrains Mono', monospace;
      font-size: 10px; padding: 2px 6px; outline: none;
      width: 100%; min-width: 80px; box-sizing: border-box;
    }
    .key-inline:focus { border-color: rgba(0,212,255,0.6); }
    .key-inline::placeholder { color: #475569; }
    /* Hide the blue underline when a text input is focused inside the filter */
    .col-filter:has(.key-inline:focus)::after { display: none; }

    /* Operation filter: presets */
    .op-presets { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; }
    .op-preset-btn {
      padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(51,65,85,0.6);
      background: transparent; color: #94a3b8; font-size: 10px; font-weight: 500;
      cursor: pointer; transition: all 0.15s; font-family: inherit;
    }
    .op-preset-btn:hover { border-color: rgba(0,212,255,0.3); color: #e2e8f0; }
    .op-preset-btn.active { background: rgba(0,212,255,0.1); border-color: #00d4ff; color: #00d4ff; }

    /* Operation filter: category chips */
    .op-chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 10px; }
    .op-chip {
      display: inline-flex; align-items: center; gap: 3px; padding: 5px 10px; border-radius: 7px;
      border: 1px solid rgba(51,65,85,0.6); background: transparent; color: #94a3b8;
      font-size: 11px; font-weight: 500; cursor: pointer; transition: all 0.15s;
      font-family: inherit; position: relative;
    }
    .op-chip:hover { border-color: rgba(0,212,255,0.3); color: #e2e8f0; }
    .op-chip.selected { background: rgba(0,212,255,0.1); border-color: rgba(0,212,255,0.3); color: #00d4ff; }
    .op-chip.partial { background: rgba(0,212,255,0.05); border-color: rgba(0,212,255,0.2); color: rgba(0,212,255,0.7); border-style: dashed; }
    .op-chip-count {
      font-size: 9px; background: rgba(0,212,255,0.15); color: #00d4ff;
      padding: 0 5px; border-radius: 10px; line-height: 16px;
    }
    .op-chip-arrow {
      width: 10px; height: 10px; margin-left: 1px; opacity: 0.4; transition: opacity 0.15s; flex-shrink: 0;
    }
    .op-chip:hover .op-chip-arrow { opacity: 1; }

    /* Operation filter: chip dropdown */
    .op-chip-dd {
      position: absolute; bottom: calc(100% + 4px); left: 0; z-index: 60;
      background: #1e293b; border: 1px solid rgba(51,65,85,0.7); border-radius: 8px;
      min-width: 220px; max-height: 260px; overflow-y: auto;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.3);
      animation: colPopIn 0.1s ease-out;
    }
    .op-chip-dd-item {
      display: flex; align-items: center; gap: 8px; padding: 5px 10px;
      cursor: pointer; font-size: 11px; font-family: 'JetBrains Mono', monospace;
      color: #94a3b8; transition: background 0.1s;
    }
    .op-chip-dd-item:hover { background: rgba(0,212,255,0.05); }
    .op-chip-dd-item.checked { color: #e2e8f0; }
    .op-chip-dd-item input[type="checkbox"] { accent-color: #00d4ff; width: 12px; height: 12px; cursor: pointer; }

    /* Slide-in panel */
    .slide-panel {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Login glow */
    .login-glow {
      background: radial-gradient(ellipse at 50% 0%, rgba(0, 212, 255, 0.08) 0%, transparent 60%);
    }

    /* Fade in animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    .fade-in-delay-1 { animation-delay: 0.05s; opacity: 0; }
    .fade-in-delay-2 { animation-delay: 0.1s; opacity: 0; }
    .fade-in-delay-3 { animation-delay: 0.15s; opacity: 0; }
    .fade-in-delay-4 { animation-delay: 0.2s; opacity: 0; }
  </style>
</head>

<body x-data="app" x-init="init()" @show-toast.window="showToast($event.detail.message, $event.detail.type)" class="min-h-screen bg-vault-bg">

  <!-- ==================== GLOBAL HELP MODAL ==================== -->
  <!-- One instance listens for `arca:open-help` events dispatched by every
       "?" trigger on the page. Content lives in console/js/help.js. -->
  <div x-data="helpModal" x-init="mount()" x-show="open" x-cloak
       class="fixed inset-0 z-[60] flex items-center justify-center p-4"
       style="background:rgba(5,10,20,0.72); backdrop-filter:blur(4px)"
       @click.self="close()">
    <template x-if="topic">
      <div class="glass rounded-xl p-6 w-full max-w-xl max-h-[85vh] overflow-y-auto"
           role="dialog" aria-modal="true" aria-labelledby="help-title">
        <div class="flex items-start justify-between mb-4">
          <div>
            <div class="text-[10px] uppercase tracking-widest mb-1 text-vault-muted" x-text="topic.section"></div>
            <h3 id="help-title" class="text-lg font-semibold text-vault-text" x-text="topic.title"></h3>
          </div>
          <button class="text-xl leading-none text-vault-muted hover:text-vault-text px-1" @click="close()" aria-label="Close help">×</button>
        </div>
        <div>
          <template x-for="(block, bi) in topic.body" :key="bi">
            <div>
              <!-- intro / paragraph -->
              <template x-if="block.kind === 'intro'">
                <p class="text-xs text-vault-muted leading-relaxed mb-4" x-text="block.text"></p>
              </template>
              <!-- bullets -->
              <template x-if="block.kind === 'bullets'">
                <ul class="list-disc list-outside pl-5 text-xs text-vault-text leading-relaxed space-y-1.5 mb-4">
                  <template x-for="(item, ii) in block.items" :key="ii"><li x-text="item"></li></template>
                </ul>
              </template>
              <!-- key/value rows (algorithms, modes, …) -->
              <template x-if="block.kind === 'rows'">
                <div class="mb-2">
                  <template x-for="(row, ri) in block.rows" :key="ri">
                    <div class="help-row">
                      <div class="help-row-key" x-text="row.key"></div>
                      <div class="help-row-text">
                        <span x-text="row.text"></span>
                        <span class="help-row-best" x-show="row.best" x-text="'Best for: ' + (row.best || '')"></span>
                      </div>
                    </div>
                  </template>
                </div>
              </template>
              <!-- callout note -->
              <template x-if="block.kind === 'note'">
                <div class="help-note" :class="block.tone || 'info'" x-text="block.text"></div>
              </template>
              <!-- code / shell -->
              <template x-if="block.kind === 'code'">
                <pre class="mono text-[11px] bg-vault-bg border border-vault-border rounded-md p-3 overflow-x-auto mb-4" x-text="block.text"></pre>
              </template>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>

  <!-- ==================== LOGIN SCREEN ==================== -->
  <template x-if="!authenticated">
    <div class="min-h-screen flex items-center justify-center login-glow" x-cloak>
      <div class="w-full max-w-sm mx-4">
        <!-- Logo -->
        <div class="flex justify-center mb-8">
          <img src="/assets/logo.svg" class="w-20 h-20" alt="Arca">
        </div>

        <h1 class="text-2xl font-semibold text-center mb-1 tracking-tight">Arca Console</h1>
        <p class="text-vault-muted text-sm text-center mb-8">Sign in to manage your storage</p>

        <form @submit.prevent="login()" class="space-y-4">
          <!-- Endpoint field (shown only if not injected) -->
          <div x-show="showEndpointField">
            <label class="block text-xs font-medium text-vault-muted mb-1.5 uppercase tracking-wider">Endpoint URL</label>
            <input type="url" x-model="loginForm.endpoint"
              placeholder="http://localhost:9000"
              class="w-full px-3.5 py-2.5 rounded-lg bg-vault-card border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 focus:ring-1 focus:ring-vault-accent/30 transition text-sm font-mono">
          </div>

          <div>
            <label class="block text-xs font-medium text-vault-muted mb-1.5 uppercase tracking-wider">Access Key ID</label>
            <input type="text" x-model="loginForm.accessKey" required autocomplete="username"
              placeholder="AKIAIOSFODNN7EXAMPLE"
              class="w-full px-3.5 py-2.5 rounded-lg bg-vault-card border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 focus:ring-1 focus:ring-vault-accent/30 transition text-sm font-mono">
          </div>

          <div>
            <label class="block text-xs font-medium text-vault-muted mb-1.5 uppercase tracking-wider">Secret Access Key</label>
            <input x-password-toggle type="password" x-model="loginForm.secretKey" required autocomplete="current-password"
              placeholder="wJalrXUtnFEMI/..."
              class="w-full px-3.5 py-2.5 rounded-lg bg-vault-card border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 focus:ring-1 focus:ring-vault-accent/30 transition text-sm font-mono">
          </div>

          <button type="submit" :disabled="loginLoading"
            class="w-full py-2.5 rounded-lg bg-gradient-to-r from-vault-accent to-cyan-400 text-vault-bg font-semibold text-sm hover:opacity-90 transition disabled:opacity-50 mt-2">
            <span x-show="!loginLoading">Sign In</span>
            <span x-show="loginLoading" class="flex items-center justify-center gap-2">
              <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
              Connecting...
            </span>
          </button>

          <p x-show="loginError" x-text="loginError" class="text-red-400 text-xs text-center mt-2"></p>
        </form>
      </div>
    </div>
  </template>

  <!-- ==================== MAIN LAYOUT ==================== -->
  <template x-if="authenticated">

            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>

            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 0 1 1.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.559.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.894.149c-.424.07-.764.383-.929.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 0 1-1.449.12l-.738-.527c-.35-.25-.806-.272-1.204-.107-.397.165-.71.505-.78.929l-.15.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 0 1-.12-1.45l.527-.737c.25-.35.272-.806.108-1.204-.165-.397-.506-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.108-1.204l-.526-.738a1.125 1.125 0 0 1 .12-1.45l.773-.773a1.125 1.125 0 0 1 1.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894ZM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>

        <!-- Session info + Logout -->
        <div class="px-3 pb-4 space-y-2">

            <span class="text-[10px] text-vault-muted truncate" x-text="sessionStorage.getItem('arca_access_key')?.slice(0, 12) + '…'"></span>

      <!-- Main content -->
      <main class="flex-1 overflow-auto pt-12 md:pt-0">

        <!-- ==================== DASHBOARD ==================== -->
        <template x-if="view === 'dashboard'">
          <div class="p-6 max-w-6xl" x-data="dashboardView" x-init="load()">
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-xl font-semibold tracking-tight">Dashboard</h2>
              <div class="flex items-center gap-2 text-xs text-vault-muted">
                <div :class="health === 'ok' ? 'bg-green-400 pulse-green' : 'bg-red-400 pulse-red'" class="w-2 h-2 rounded-full"></div>
                <span x-text="health === 'ok' ? 'Healthy' : 'Unreachable'"></span>
              </div>
            </div>

            <!-- Bento grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <!-- Server info (spans 2 cols) -->
              <div class="sm:col-span-2 glass rounded-xl p-5 glass-hover fade-in">
                <div class="flex items-center gap-2 mb-4">
                  <svg class="w-4 h-4 text-vault-accent" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 14.25h13.5m-13.5 0a3 3 0 01-3-3m3 3a3 3 0 100 6h13.5a3 3 0 100-6m-16.5-3a3 3 0 013-3h13.5a3 3 0 013 3m-19.5 0a4.5 4.5 0 01.9-2.7L5.737 5.1a3.375 3.375 0 012.7-1.35h7.126c1.062 0 2.062.5 2.7 1.35l2.587 3.45a4.5 4.5 0 01.9 2.7m0 0a3 3 0 01-3 3m0 3h.008v.008h-.008v-.008zm0-6h.008v.008h-.008v-.008zm-3 6h.008v.008h-.008v-.008zm0-6h.008v.008h-.008v-.008z"/></svg>
                  <span class="text-xs font-medium text-vault-muted uppercase tracking-wider">Server</span>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                  <div>
                    <div class="text-vault-muted text-xs mb-1">Version</div>
                    <div class="text-lg font-semibold font-mono" x-text="info.version || '—'"></div>
                  </div>
                  <div>
                    <div class="text-vault-muted text-xs mb-1">Uptime</div>
                    <div class="text-lg font-semibold" x-text="formatUptime(info.uptime_seconds)"></div>
                  </div>
                  <div>
                    <div class="text-vault-muted text-xs mb-1">Transport</div>
                    <div class="flex items-center gap-1.5">
                      <template x-if="info.tls_enabled">
                        <svg class="w-4 h-4 text-green-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>
                      </template>
                      <template x-if="!info.tls_enabled">
                        <svg class="w-4 h-4 text-vault-muted" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5V6.75a4.5 4.5 0 1 1 9 0v3.75M3.75 21.75h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H3.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>
                      </template>
                      <span x-text="info.tls_enabled ? 'TLS' : 'HTTP'"
                            :class="info.tls_enabled ? 'text-green-400' : 'text-vault-muted'"
                            class="text-lg font-semibold"></span>
                    </div>
                  </div>
                  <div>
                    <div class="text-vault-muted text-xs mb-1">Encryption</div>
                    <div class="flex items-center gap-1.5">
                      <template x-if="info.encryption_enabled || info.kms_provider">
                        <svg class="w-4 h-4 text-green-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>
                      </template>
                      <template x-if="!info.encryption_enabled && !info.kms_provider">
                        <svg class="w-4 h-4 text-vault-muted" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0-10.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285ZM12 15.75h.007v.008H12v-.008Z"/></svg>
                      </template>
                      <span x-text="info.encryption_enabled
                              ? (info.kms_provider === 'vault' ? 'SSE-S3 (Vault)' : 'SSE-S3 (Local)')
                              : (info.kms_provider === 'vault' ? 'Per-bucket (Vault)' : (info.kms_provider ? 'Per-bucket (Local)' : 'Off'))"
                            :class="(info.encryption_enabled || info.kms_provider) ? 'text-green-400' : 'text-vault-muted'"
                            class="text-lg font-semibold"></span>
                    </div>
                  </div>
                  <div>
                    <div class="text-vault-muted text-xs mb-1">Database</div>
                    <div class="flex items-center gap-1.5">
                      <svg class="w-4 h-4 text-vault-accent" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375m16.5 0v3.75m-16.5-3.75v3.75m16.5 0v3.75C20.25 16.153 16.556 18 12 18s-8.25-1.847-8.25-4.125v-3.75m16.5 0c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125"/></svg>
                      <span x-text="(info.metadata_backend || 'sqlite') === 'postgres' ? 'PostgreSQL' : 'SQLite'"
                            class="text-lg font-semibold text-vault-accent"></span>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Bucket count -->
              <div class="glass rounded-xl p-5 glass-hover fade-in fade-in-delay-1">
                <div class="text-vault-muted text-xs mb-3 uppercase tracking-wider font-medium">Buckets</div>
                <div class="text-3xl font-semibold text-vault-accent" x-text="stats.bucket_count ?? '—'"></div>
              </div>

              <!-- Object count -->
              <div class="glass rounded-xl p-5 glass-hover fade-in fade-in-delay-2">
                <div class="text-vault-muted text-xs mb-3 uppercase tracking-wider font-medium">Objects</div>
                <div class="text-3xl font-semibold text-vault-indigo" x-text="stats.object_count ?? '—'"></div>
              </div>

              <!-- Storage ring (spans 2 cols, 2 rows) -->
              <div class="sm:col-span-2 lg:row-span-2 glass rounded-xl p-5 glass-hover fade-in fade-in-delay-3">
                <div class="flex items-center gap-2 mb-4">
                  <svg class="w-4 h-4 text-vault-accent" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6a7.5 7.5 0 107.5 7.5h-7.5V6z"/><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5H21A7.5 7.5 0 0013.5 3v7.5z"/></svg>
                  <span class="text-xs font-medium text-vault-muted uppercase tracking-wider">Storage Distribution</span>
                </div>
                <div class="flex flex-col items-center">
                  <!-- Donut chart -->
                  <div x-html="renderRing()"></div>
                  <!-- Legend -->
                  <div class="mt-3 w-full space-y-1 overflow-hidden" x-show="bucketSizes.length > 0">
                    <template x-for="(b, i) in bucketSizes" :key="b.name">
                      <a :href="'#/buckets/' + encodeURIComponent(b.name)" class="flex items-center gap-2 text-xs rounded px-1 -mx-1 py-1 hover:bg-white/[0.03] transition group cursor-pointer no-underline text-inherit">
                        <div class="w-2.5 h-2.5 rounded-sm flex-shrink-0" :style="'background:' + ringColors[i % ringColors.length]"></div>
                        <span class="truncate flex-1 group-hover:text-vault-accent transition" x-text="b.name"></span>
                        <span x-show="b.encrypted" x-html="icons.encryptionShield" title="Encrypted"></span>
                        <span x-show="b.versioned" x-html="b.versioned === 'Suspended' ? icons.versioningSuspended : icons.versioningClock" :title="'Versioning: ' + b.versioned"></span>
                        <span x-show="b.locked" x-html="icons.objectLock" title="Object Lock"></span>
                        <span x-show="b.compressed" x-html="icons.compression" :title="'Compressed: ' + b.compressed"></span>
                        <span class="text-vault-muted font-mono" x-text="formatBytes(b.size)"></span>
                      </a>
                    </template>
                  </div>
                  <div x-show="bucketSizes.length === 0" class="text-vault-muted text-xs mt-4">No buckets yet</div>
                </div>
              </div>

              <!-- Total storage -->
              <div class="sm:col-span-2 glass rounded-xl p-5 glass-hover fade-in fade-in-delay-4">
                <div class="text-vault-muted text-xs mb-3 uppercase tracking-wider font-medium">Total Storage</div>
                <div class="text-3xl font-semibold">
                  <span class="bg-gradient-to-r from-vault-accent to-vault-indigo bg-clip-text text-transparent" x-text="formatBytes(stats.total_size_bytes || 0)"></span>
                </div>
                <template x-if="stats.disk_total_bytes">
                  <div class="mt-3">
                    <div class="flex justify-between text-xs text-vault-muted mb-1.5">
                      <span x-text="formatBytes(stats.disk_total_bytes - stats.disk_available_bytes) + ' used'"></span>
                      <span x-text="formatBytes(stats.disk_available_bytes) + ' free of ' + formatBytes(stats.disk_total_bytes)"></span>
                    </div>
                    <div class="w-full h-1.5 rounded-full bg-vault-border/50 overflow-hidden">
                      <div class="h-full rounded-full bg-gradient-to-r from-vault-accent to-vault-indigo transition-all duration-500"
                        :style="'width:' + Math.min(100, ((stats.disk_total_bytes - stats.disk_available_bytes) / stats.disk_total_bytes * 100)).toFixed(1) + '%'"></div>
                    </div>
                  </div>
                </template>
              </div>


            </div>
          </div>
        </template>

        <!-- ==================== BUCKETS LIST ==================== -->
        <template x-if="view === 'buckets'">
          <div class="p-6 max-w-6xl" x-data="bucketsView" x-init="load()">
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-xl font-semibold tracking-tight">Buckets</h2>
              <button @click="showCreateModal = true"
                class="px-3.5 py-1.5 rounded-lg bg-vault-accent/10 text-vault-accent border border-vault-accent/20 text-sm font-medium hover:bg-vault-accent/20 transition">
                + Create Bucket
              </button>
            </div>

            <!-- Search bar -->
            <div x-show="!loading && buckets.length > 0" class="relative mb-4">
              <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-vault-muted pointer-events-none" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
              </svg>
              <input type="text" x-model.debounce.300ms="searchQuery" placeholder="Search buckets..."
                class="w-full bg-transparent border-b border-vault-border/50 hover:border-vault-border focus:border-vault-accent text-sm text-vault-text placeholder-vault-muted/50 focus:outline-none pl-9 pr-8 py-2 transition">
              <button x-show="searchQuery" @click="searchQuery = ''"
                class="absolute right-2 top-1/2 -translate-y-1/2 p-0.5 rounded text-vault-muted hover:text-vault-text transition">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
                </svg>
              </button>
            </div>

            <!-- Bucket cards -->
            <div x-show="!loading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              <template x-for="b in filteredBuckets" :key="b.name">
                <div @click="openBucket(b.name)"
                  class="glass rounded-xl p-5 glass-hover cursor-pointer transition group">
                  <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                      <svg class="w-5 h-5 text-vault-accent" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"/></svg>
                      <span class="font-medium text-sm" x-text="b.name"></span>
                    </div>
                    <button @click.stop="window.location.hash = '#/buckets/' + encodeURIComponent(b.name) + '/settings'"
                      class="md:opacity-0 md:group-hover:opacity-100 p-1 rounded hover:bg-vault-accent/10 text-vault-muted hover:text-vault-accent transition" title="Bucket settings">
                      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    </button>
                  </div>
                  <div class="text-xs text-vault-muted mb-1.5">
                    Created <span x-text="new Date(b.creationDate).toLocaleDateString()"></span>
                  </div>
                  <div class="flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-vault-muted">
                    <template x-if="b.encrypted">
                      <span class="flex items-center gap-1 text-green-400" title="SSE-S3 (AES-256)">
                        <span x-html="icons.encryptionShield"></span>
                        <span class="text-[10px] font-medium">Encrypted</span>
                      </span>
                    </template>
                    <template x-if="b.versioned">
                      <span class="flex items-center gap-1" :class="b.versioned === 'Suspended' ? 'text-amber-400' : 'text-blue-400'" :title="'Versioning: ' + b.versioned">
                        <span x-html="b.versioned === 'Suspended' ? icons.versioningSuspended : icons.versioningClock"></span>
                        <span class="text-[10px] font-medium" x-text="b.versioned === 'Suspended' ? 'Suspended' : 'Versioned'"></span>
                      </span>
                    </template>
                    <template x-if="b.locked">
                      <span class="flex items-center gap-1 text-orange-400" title="Object Lock (WORM)">
                        <span x-html="icons.objectLock"></span>
                        <span class="text-[10px] font-medium">Locked</span>
                      </span>
                    </template>
                    <template x-if="b.compressed">
                      <span class="flex items-center gap-1 text-cyan-400" :title="'Compressed: ' + b.compressed">
                        <span x-html="icons.compression"></span>
                        <span class="text-[10px] font-medium">Compressed</span>
                      </span>
                    </template>
                  </div>
                </div>
              </template>
            </div>

            <div x-show="!loading && buckets.length > 0 && filteredBuckets.length === 0" class="text-center py-16">
              <svg class="w-10 h-10 mx-auto text-vault-border mb-3" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
              </svg>
              <p class="text-vault-muted text-sm">No results for "<span x-text="searchQuery" class="text-vault-text"></span>"</p>
            </div>

            <div x-show="!loading && buckets.length === 0" class="text-center py-16">
              <svg class="w-12 h-12 mx-auto text-vault-border mb-4" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"/></svg>
              <p class="text-vault-muted text-sm">No buckets yet. Create one to get started.</p>
            </div>

            <div x-show="loading" class="flex justify-center py-16">
              <svg class="animate-spin h-6 w-6 text-vault-accent" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            </div>

            <!-- Create bucket modal -->
            <div x-show="showCreateModal" x-transition.opacity x-effect="if (showCreateModal) $nextTick(() => $refs.bucketNameInput?.focus())" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="showCreateModal = false">
              <div class="glass rounded-xl p-6 w-full max-w-sm mx-4" @click.stop>
                <h3 class="text-lg font-semibold mb-4">Create Bucket</h3>
                <form @submit.prevent="createBucket()" autocomplete="off">
                  <input type="text" x-model="newBucketName" x-ref="bucketNameInput" required
                    name="bucket-id-x" autocomplete="nope"
                    placeholder="my-bucket" pattern="[a-z0-9][a-z0-9.\-]{1,61}[a-z0-9]"
                    class="w-full px-3.5 py-2.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 focus:ring-1 focus:ring-vault-accent/30 transition text-sm font-mono mb-1">
                  <p class="text-[10px] text-vault-muted mb-4">Lowercase letters, numbers, hyphens, dots. 3-63 characters.</p>
                  <label class="flex items-center gap-2 mb-4 cursor-pointer">
                    <input type="checkbox" x-model="newBucketObjectLock"
                      class="w-4 h-4 rounded border-vault-border bg-vault-bg text-vault-accent focus:ring-vault-accent/30 focus:ring-offset-0">
                    <span class="text-sm text-vault-muted">Enable Object Lock</span>
                    <span class="text-[10px] text-vault-muted/60">(WORM, auto-enables versioning, cannot be disabled later)</span>
                  </label>
                  <div class="flex gap-3 justify-end">
                    <button type="button" @click="showCreateModal = false" class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Cancel</button>
                    <button type="submit" :disabled="creating" class="px-4 py-2 rounded-lg bg-vault-accent text-vault-bg text-sm font-medium hover:opacity-90 transition disabled:opacity-50">Create</button>
                  </div>
                  <p x-show="createError" x-text="createError" class="text-red-400 text-xs mt-2"></p>
                </form>
              </div>
            </div>

          </div>
        </template>

        <!-- ==================== BUCKET SETTINGS ==================== -->
        <template x-if="view === 'bucket-settings'">
          <div class="p-6 max-w-3xl" x-data="bucketSettingsView" x-init="load()">
            <!-- Breadcrumbs -->
            <div class="flex items-center gap-2 text-sm mb-6">
              <a href="#/buckets" class="text-vault-muted hover:text-vault-accent transition">Buckets</a>
              <span class="text-vault-border">/</span>
              <a :href="'#/buckets/' + encodeURIComponent(bucketName)" class="text-vault-accent hover:underline font-medium" x-text="bucketName"></a>
              <span class="text-vault-border">/</span>
              <span class="text-vault-text">Settings</span>
            </div>

            <h2 class="text-xl font-semibold tracking-tight mb-6">Bucket Settings</h2>

            <div x-show="loading" class="flex justify-center py-16">
              <svg class="animate-spin h-6 w-6 text-vault-accent" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            </div>

            <div x-show="!loading" class="space-y-6">
              <!-- Encryption card -->
              <div class="glass rounded-xl p-5">
                <div class="flex items-center gap-2 mb-4">
                  <svg class="w-4 h-4 text-vault-accent" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>
                  <span class="text-sm font-semibold uppercase tracking-wider text-vault-muted">Encryption</span>
                  <span x-data="helpTrigger('encryption')" class="help-host">
                    <button class="help-trigger" @click="show()" aria-label="About encryption">?</button>
                    <span class="help-tooltip" x-text="topic.hint"></span>
                  </span>
                </div>

                <p class="text-xs text-vault-muted mb-3">Encrypt object contents at rest with AES-256 (SSE-S3). Clients see plaintext ETags, sizes, and ranged reads — encryption is transparent. Can be turned off later: existing ciphertext stays readable via the stored DEK.</p>

                <!-- Read-only: server-level encryption is ON -->
                <template x-if="adminInfoAvailable && serverEncryptionEnabled">
                  <div>
                    <div class="flex items-center gap-1.5 mb-2">
                      <svg class="w-4 h-4 text-green-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>
                      <span class="text-sm text-green-400 font-medium" x-text="kmsProvider === 'vault' ? 'SSE-S3 (Vault) Active' : 'SSE-S3 (AES-256) Active'"></span>
                    </div>
                    <p class="text-xs text-vault-muted" x-text="kmsProvider === 'vault' ? 'Encryption is enabled via Vault/OpenBAO KMS. All buckets are encrypted by default.' : 'Encryption is enabled at the server level. All buckets are encrypted by default.'"></p>
                  </div>
                </template>

                <!-- Interactive: server encryption OFF (or non-admin) -->
                <template x-if="!adminInfoAvailable || !serverEncryptionEnabled">
                  <div>
                    <!-- Server default info (admin only) -->
                    <div x-show="adminInfoAvailable" class="flex items-center gap-2 mb-4 text-xs">
                      <span class="text-vault-muted">Server default:</span>
                      <span class="text-vault-muted font-medium">Disabled</span>
                    </div>

                    <!-- Toggle -->
                    <div class="flex items-center justify-between">
                      <div>
                        <div class="text-sm font-medium text-vault-text">Per-bucket encryption</div>
                        <div class="text-xs text-vault-muted mt-0.5"
                          x-text="encryptionOverride ? 'AES-256 explicitly enabled for this bucket' : 'Not enabled'"></div>
                      </div>
                      <button @click="toggleEncryption()" :disabled="encryptionSaving"
                        :class="encryptionOverride ? 'bg-vault-accent' : 'bg-vault-border'"
                        class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors disabled:opacity-50">
                        <span :class="encryptionOverride ? 'translate-x-6' : 'translate-x-1'"
                          class="inline-block h-4 w-4 rounded-full bg-white transition-transform"></span>
                      </button>
                    </div>

                    <!-- Effective status -->
                    <div class="mt-4 pt-4 border-t border-vault-border/30">
                      <div class="flex items-center gap-2">
                        <template x-if="encryptionActive">
                          <div class="flex items-center gap-1.5">
                            <svg class="w-4 h-4 text-green-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>
                            <span class="text-sm text-green-400 font-medium" x-text="kmsProvider === 'vault' ? 'SSE-S3 (Vault) Active' : 'SSE-S3 (AES-256) Active'"></span>
                            <span class="text-xs text-vault-muted ml-1" x-text="encryptionOverride ? '(per-bucket)' : '(server default)'"></span>
                          </div>
                        </template>
                        <template x-if="!encryptionActive">
                          <div class="flex items-center gap-1.5">
                            <svg class="w-4 h-4 text-vault-muted" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0-10.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285ZM12 15.75h.007v.008H12v-.008Z"/></svg>
                            <span class="text-sm text-vault-muted font-medium">Not encrypted</span>
                          </div>
                        </template>
                      </div>
                    </div>

                    <p x-show="encryptionError" x-text="encryptionError" class="text-red-400 text-xs mt-3"></p>
                  </div>
                </template>
              </div>

              <!-- Compression card -->
              <div class="glass rounded-xl p-5">
                <div class="flex items-center gap-2 mb-4">
                  <svg class="w-4 h-4 text-vault-accent" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125S3.75 19.903 3.75 17.625V6.375m16.5 0v3.75m-16.5-3.75v3.75m16.5 0v3.75C20.25 16.153 16.556 18 12 18s-8.25-1.847-8.25-4.125v-3.75m16.5 0c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125"/></svg>
                  <span class="text-sm font-semibold uppercase tracking-wider text-vault-muted">Compression</span>
                  <span x-data="helpTrigger('compression.algorithm')" class="help-host">
                    <button class="help-trigger" @click="show()" aria-label="About compression algorithms">?</button>
                    <span class="help-tooltip" x-text="topic.hint"></span>
                  </span>
                </div>

                <p class="text-xs text-vault-muted mb-3">Compress object contents transparently before they hit disk to cut storage usage. Pick an algorithm and level, or use <span class="text-vault-text font-mono">auto</span> to let Arca choose per-object from Content-Type and size. Can be turned off later: existing compressed blobs stay readable.</p>

                <!-- Toggle -->
                <div class="flex items-center justify-between">
                  <div>
                    <div class="text-sm font-medium text-vault-text">Transparent compression</div>
                    <div class="text-xs text-vault-muted mt-0.5"
                      x-text="compressionEnabled ? 'All object writes are compressed before storage' : 'Not enabled'"></div>
                  </div>
                  <button @click="toggleCompression()" :disabled="compressionSaving"
                    :class="compressionEnabled ? 'bg-vault-accent' : 'bg-vault-border'"
                    class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors disabled:opacity-50">
                    <span :class="compressionEnabled ? 'translate-x-6' : 'translate-x-1'"
                      class="inline-block h-4 w-4 rounded-full bg-white transition-transform"></span>
                  </button>
                </div>

                <!-- Inline algorithm / level controls (visible only when ON). -->
                <div x-show="compressionEnabled" x-cloak class="mt-4 flex items-center gap-3">
                  <div class="flex items-center gap-2">
                    <label class="text-xs text-vault-muted">Algorithm</label>
                    <select x-model="compressionAlgorithm" @change="updateCompressionAlgorithm()"
                      :disabled="compressionSaving"
                      class="px-3 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text text-sm disabled:opacity-50">
                      <option value="auto">auto</option>
                      <option value="zstd">zstd</option>
                      <option value="lz4">lz4</option>
                      <option value="snappy">snappy</option>
                      <option value="gzip">gzip</option>
                      <option value="brotli">brotli</option>
                      <option value="xz">xz</option>
                    </select>
                  </div>
                  <div class="flex items-center gap-2" x-show="compressionLevels[compressionAlgorithm] && compressionLevels[compressionAlgorithm].levels !== false">
                    <label class="text-xs text-vault-muted flex items-center gap-1.5">
                      Level
                      <span x-data="helpTrigger('compression.level')" class="help-host">
                        <button class="help-trigger" @click="show()" aria-label="About compression level">?</button>
                        <span class="help-tooltip" x-text="topic.hint"></span>
                      </span>
                    </label>
                    <input type="number"
                      x-model.number="compressionLevel"
                      @change="updateCompressionLevel()"
                      :min="(compressionLevels[compressionAlgorithm] || {}).min"
                      :max="(compressionLevels[compressionAlgorithm] || {}).max"
                      :disabled="compressionSaving"
                      class="w-20 px-3 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text text-sm disabled:opacity-50">
                    <span class="text-[10px] text-vault-muted/60"
                      x-text="'(' + ((compressionLevels[compressionAlgorithm] || {}).min ?? '') + '–' + ((compressionLevels[compressionAlgorithm] || {}).max ?? '') + ')'"></span>
                  </div>
                </div>

                <!-- Effective status -->
                <div class="mt-4 pt-4 border-t border-vault-border/30">
                  <div class="flex items-center gap-2">
                    <template x-if="compressionEnabled">
                      <div class="flex items-center gap-1.5">
                        <svg class="w-4 h-4 text-green-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125S3.75 19.903 3.75 17.625V6.375m16.5 0v3.75m-16.5-3.75v3.75m16.5 0v3.75C20.25 16.153 16.556 18 12 18s-8.25-1.847-8.25-4.125v-3.75m16.5 0c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125"/></svg>
                        <span class="text-sm text-green-400 font-medium"
                          x-text="'Compressed: ' + compressionAlgorithm + (compressionLevel != null && compressionLevels[compressionAlgorithm] && compressionLevels[compressionAlgorithm].levels !== false ? ' (level ' + compressionLevel + ')' : '')"></span>
                      </div>
                    </template>
                    <template x-if="!compressionEnabled">
                      <div class="flex items-center gap-1.5">
                        <svg class="w-4 h-4 text-vault-muted" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125S3.75 19.903 3.75 17.625V6.375m16.5 0v3.75m-16.5-3.75v3.75m16.5 0v3.75C20.25 16.153 16.556 18 12 18s-8.25-1.847-8.25-4.125v-3.75m16.5 0c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125"/></svg>
                        <span class="text-sm text-vault-muted font-medium">Not compressed</span>
                      </div>
                    </template>
                  </div>
                </div>

                <p x-show="compressionError" x-text="compressionError" class="text-red-400 text-xs mt-3"></p>
              </div>

              <!-- Versioning card -->
              <div class="glass rounded-xl p-5" id="versioning-card">
                <div class="flex items-center gap-2 mb-4">
                  <svg class="w-4 h-4 text-vault-accent" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                  <span class="text-sm font-semibold uppercase tracking-wider text-vault-muted">Versioning</span>
                  <span x-data="helpTrigger('versioning')" class="help-host">
                    <button class="help-trigger" @click="show()" aria-label="About versioning">?</button>
                    <span class="help-tooltip" x-text="topic.hint"></span>
                  </span>
                </div>

                <!-- Warning shown only before the first enable -->
                <p x-show="!versioningStatus" x-cloak class="text-xs text-vault-muted mb-3">Enable Versioning to preserve every version of each object (overwrites and deletes keep the prior copy). Once enabled, versioning can only be suspended, not turned off. <span class="text-amber-400">This action cannot be undone.</span></p>

                <!-- Toggle -->
                <div class="flex items-center justify-between">
                  <div>
                    <div class="text-sm font-medium text-vault-text">Object Versioning</div>
                    <div class="text-xs text-vault-muted mt-0.5"
                      x-text="versioningStatus === 'Enabled' ? 'All object writes create new versions' : versioningStatus === 'Suspended' ? 'Suspended, new writes use null version ID' : 'Not enabled'"></div>
                  </div>
                  <button @click="requestToggleVersioning()" :disabled="versioningSaving || (objectLockEnabled && versioningStatus === 'Enabled')"
                    :class="versioningStatus === 'Enabled' ? 'bg-vault-accent' : versioningStatus === 'Suspended' ? 'bg-amber-500' : 'bg-vault-border'"
                    class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors disabled:opacity-50">
                    <span :class="versioningStatus === 'Enabled' || versioningStatus === 'Suspended' ? 'translate-x-6' : 'translate-x-1'"
                      class="inline-block h-4 w-4 rounded-full bg-white transition-transform"></span>
                  </button>
                </div>

                <!-- Effective status -->
                <div class="mt-4 pt-4 border-t border-vault-border/30">
                  <div class="flex items-center gap-2">
                    <template x-if="versioningStatus === 'Enabled'">
                      <div class="flex items-center gap-1.5">
                        <svg class="w-4 h-4 text-green-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                        <span class="text-sm text-green-400 font-medium">Versioning Active</span>
                      </div>
                    </template>
                    <template x-if="versioningStatus === 'Suspended'">
                      <div class="flex items-center gap-1.5">
                        <svg class="w-4 h-4 text-amber-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.25 9v6m-4.5 0V9M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                        <span class="text-sm text-amber-400 font-medium">Versioning Suspended</span>
                        <span class="text-xs text-vault-muted ml-1">(existing versions preserved)</span>
                      </div>
                    </template>
                    <template x-if="!versioningStatus">
                      <div class="flex items-center gap-1.5">
                        <svg class="w-4 h-4 text-vault-muted" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                        <span class="text-sm text-vault-muted font-medium">Not versioned</span>
                      </div>
                    </template>
                  </div>
                </div>

                <p x-show="versioningError" x-text="versioningError" class="text-red-400 text-xs mt-3"></p>
              </div>

              <!-- Object Lock card -->
              <div class="glass rounded-xl p-5">
                <div class="flex items-center justify-between mb-3">
                  <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-vault-accent" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>
                    <span class="text-sm font-semibold uppercase tracking-wider text-vault-text">Object Lock (WORM)</span>
                    <span x-data="helpTrigger('object-lock')" class="help-host">
                      <button class="help-trigger" @click="show()" aria-label="About Object Lock">?</button>
                      <span class="help-tooltip" x-text="topic.hint"></span>
                    </span>
                  </div>
                  <span x-show="objectLockEnabled" x-cloak class="text-[10px] px-1.5 py-0.5 rounded-full font-medium bg-emerald-500/15 text-emerald-400">Enabled</span>
                </div>

                <div x-show="objectLockEnabled" x-cloak>
                  <div class="text-xs text-vault-muted">
                    <span x-show="objectLockMode">Default retention: <span class="text-vault-text" x-text="objectLockMode"></span></span>
                    <span x-show="objectLockDays"> for <span class="text-vault-text" x-text="objectLockDays"></span> days</span>
                    <span x-show="!objectLockMode">Enabled with no default retention</span>
                  </div>
                  <p class="text-[11px] text-vault-muted/60 mt-1">Object Lock cannot be disabled once enabled.</p>
                </div>

                <div x-show="!objectLockEnabled">
                  <p class="text-xs text-vault-muted mb-3">Enable Object Lock to prevent objects from being deleted during a retention period (WORM compliance). This also enables versioning. <span class="text-amber-400">This action cannot be undone.</span></p>
                  <div class="flex items-center gap-3">
                    <select x-ref="lockMode" class="px-3 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text text-sm">
                      <option value="">No default retention</option>
                      <option value="GOVERNANCE">GOVERNANCE</option>
                      <option value="COMPLIANCE">COMPLIANCE</option>
                    </select>
                    <input type="number" min="1" x-ref="lockDays" placeholder="Days" class="w-20 px-3 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text text-sm placeholder-slate-500">
                    <button @click="requestEnableObjectLock($refs.lockMode.value, $refs.lockDays.value ? parseInt($refs.lockDays.value) : null)"
                      :disabled="objectLockSaving"
                      class="px-3 py-1.5 rounded-lg bg-vault-accent/10 text-vault-accent border border-vault-accent/30 text-sm font-medium hover:bg-vault-accent/20 transition disabled:opacity-40"
                      x-text="objectLockSaving ? 'Enabling...' : 'Enable Object Lock'"></button>
                  </div>
                  <p x-show="objectLockError" x-text="objectLockError" class="text-red-400 text-xs mt-2"></p>
                </div>
              </div>

              <!-- Lifecycle Rules card (modal-based editor) -->
              <div class="glass rounded-xl p-5">
                <div class="flex items-center justify-between mb-3">
                  <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-vault-accent" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                    <span class="text-sm font-semibold uppercase tracking-wider text-vault-text">Lifecycle Rules</span>
                    <span x-data="helpTrigger('lifecycle')" class="help-host">
                      <button class="help-trigger" @click="show()" aria-label="About Lifecycle rules">?</button>
                      <span class="help-tooltip" x-text="topic.hint"></span>
                    </span>
                    <svg x-show="lifecycleSaving" class="animate-spin h-3.5 w-3.5 text-vault-accent ml-1" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                  </div>
                  <button @click="openLifecycleAddModal()" :disabled="lifecycleSaving"
                    class="px-2.5 py-1 rounded-lg bg-vault-accent/10 text-vault-accent border border-vault-accent/30 text-xs font-medium hover:bg-vault-accent/20 transition disabled:opacity-40">
                    + Add Rule
                  </button>
                </div>

                <p class="text-xs text-vault-muted mb-3">Schedule automatic cleanup for this bucket: expire objects after N days, prune old noncurrent versions, or abort incomplete multipart uploads. Each rule can target a key prefix. Rules can be edited, disabled, or removed at any time.</p>

                <template x-if="lifecycleLoading">
                  <div class="flex justify-center py-4">
                    <svg class="animate-spin h-5 w-5 text-vault-accent" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                  </div>
                </template>

                <template x-if="!lifecycleLoading && lifecycleRules.length === 0 && !showLifecycleModal">
                  <p class="text-xs text-vault-muted py-2">No lifecycle rules configured. Objects and incomplete uploads will not be automatically cleaned up.</p>
                </template>

                <!-- Rules list (always in display mode; click opens edit modal) -->
                <template x-for="(rule, index) in lifecycleRules" :key="index">
                  <div class="py-2.5 border-b border-vault-border/30 last:border-0">
                    <div class="flex items-center gap-3">
                      <div class="flex-1 min-w-0 cursor-pointer group" @click="openLifecycleEditModal(index)">
                        <div class="flex items-center gap-2">
                          <span class="text-sm font-medium text-vault-text truncate group-hover:text-vault-accent transition" x-text="rule.id || '(unnamed)'"></span>
                          <button @click.stop="toggleRuleStatus(index)" :disabled="lifecycleSaving"
                            class="text-[10px] px-1.5 py-0.5 rounded-full font-medium cursor-pointer transition"
                            :class="rule.status === 'Enabled' ? 'bg-emerald-500/15 text-emerald-400 hover:bg-emerald-500/25' : 'bg-vault-border/30 text-vault-muted hover:bg-vault-border/50'"
                            x-text="rule.status"></button>
                          <svg class="w-3 h-3 text-vault-muted opacity-0 group-hover:opacity-100 transition" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Z"/></svg>
                        </div>
                        <div class="text-[11px] text-vault-muted mt-0.5 flex flex-wrap gap-x-2">
                          <span x-show="rule.prefix" class="inline-flex items-center gap-0.5"><span class="text-vault-muted/60">prefix:</span> <span x-text="rule.prefix"></span></span>
                          <span x-show="rule.expirationDays" class="inline-flex items-center gap-0.5"><span class="text-vault-muted/60">expire:</span> <span x-text="rule.expirationDays + ' days'"></span></span>
                          <span x-show="rule.noncurrentDays" class="inline-flex items-center gap-0.5"><span class="text-vault-muted/60">noncurrent:</span> <span x-text="rule.noncurrentDays + ' days'"></span></span>
                          <span x-show="rule.abortUploadDays" class="inline-flex items-center gap-0.5"><span class="text-vault-muted/60">abort uploads:</span> <span x-text="rule.abortUploadDays + ' days'"></span></span>
                          <span x-show="!rule.prefix && !rule.expirationDays && !rule.noncurrentDays && !rule.abortUploadDays" class="italic">no actions</span>
                        </div>
                      </div>
                      <button @click="removeRule(index)" :disabled="lifecycleSaving" class="text-vault-muted hover:text-red-400 transition p-1 flex-shrink-0" title="Remove rule">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
                      </button>
                    </div>
                  </div>
                </template>

                <template x-if="lifecycleRules.length > 0">
                  <div class="flex justify-end mt-3">
                    <button @click="deleteAllLifecycleRules()" :disabled="lifecycleSaving"
                      class="text-[11px] text-red-400/70 hover:text-red-400 transition">
                      Delete all rules
                    </button>
                  </div>
                </template>

                <p x-show="lifecycleError" x-text="lifecycleError" class="text-red-400 text-xs mt-2"></p>

                <!-- Lifecycle rule editor modal (teleported to body to escape stacking contexts). -->
                <template x-teleport="body">
                  <div x-show="showLifecycleModal" x-transition.opacity class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="closeLifecycleModal()" @keydown.escape.window="closeLifecycleModal()">
                    <div class="glass rounded-xl p-6 w-full max-w-xl mx-4 max-h-[85vh] overflow-y-auto" @click.stop>
                      <h3 class="text-lg font-semibold mb-4" x-text="lifecycleModalMode === 'add' ? 'Add Lifecycle Rule' : 'Edit Lifecycle Rule'"></h3>

                      <div class="space-y-3">
                        <div class="grid grid-cols-[1fr_1fr] gap-2">
                          <div>
                            <label class="text-[10px] uppercase tracking-wider text-vault-muted font-medium">Rule ID</label>
                            <input type="text" x-model="lifecycleForm.id" placeholder="rule-a1b2c3" autocomplete="off"
                              class="w-full px-2.5 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 text-xs">
                          </div>
                          <div>
                            <label class="text-[10px] uppercase tracking-wider text-vault-muted font-medium">Prefix filter <span class="normal-case text-vault-muted/50">(optional)</span></label>
                            <input type="text" x-model="lifecycleForm.prefix" placeholder="e.g. logs/" autocomplete="off"
                              class="w-full px-2.5 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 text-xs font-mono">
                          </div>
                        </div>

                        <div class="pt-2 border-t border-vault-border/30">
                          <div class="text-[10px] uppercase tracking-wider text-vault-muted/80 font-medium mb-2">Actions <span class="normal-case text-vault-muted/50">(set at least one)</span></div>
                          <div class="grid grid-cols-3 gap-2">
                            <div>
                              <label class="text-[10px] uppercase tracking-wider text-vault-muted font-medium">Expire after <span class="normal-case text-vault-muted/50">(days)</span></label>
                              <input type="number" min="1" x-model="lifecycleForm.expirationDays" placeholder="e.g. 90"
                                class="w-full px-2.5 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 text-xs">
                            </div>
                            <div>
                              <label class="text-[10px] uppercase tracking-wider text-vault-muted font-medium">Noncurrent <span class="normal-case text-vault-muted/50">(days)</span></label>
                              <input type="number" min="1" x-model="lifecycleForm.noncurrentDays" placeholder="e.g. 30"
                                class="w-full px-2.5 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 text-xs">
                            </div>
                            <div>
                              <label class="text-[10px] uppercase tracking-wider text-vault-muted font-medium">Abort uploads <span class="normal-case text-vault-muted/50">(days)</span></label>
                              <input type="number" min="1" x-model="lifecycleForm.abortUploadDays" placeholder="e.g. 7"
                                class="w-full px-2.5 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 text-xs">
                            </div>
                          </div>
                          <p class="text-[10px] text-vault-muted/60 mt-2 leading-relaxed">
                            <strong>Expire</strong> removes current-version objects after N days.
                            <strong>Noncurrent</strong> prunes prior versions N days after they stop being current (versioned buckets only).
                            <strong>Abort uploads</strong> cleans up multipart uploads that were never completed N days after initiation.
                          </p>
                        </div>
                      </div>

                      <p x-show="lifecycleFormError" x-text="lifecycleFormError" class="text-red-400 text-xs mt-3"></p>

                      <div class="flex gap-2 justify-end mt-5 pt-4 border-t border-vault-border/30">

              <!-- versioningEnabled mirrors the parent bucketSettingsView.versioningStatus

                   the "+ Add Rule" button without a page refresh. While the parent is still
