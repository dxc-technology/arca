<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arca Console</title>

  <!-- Console version and documentation URL -->
  <script>
    window.ARCA_CONSOLE_VERSION = "0.8.1";
    window.ARCA_DOCS_URL = "https://dxc-technology.github.io/arca/";
  </script>

  <!-- Env var injection (replaced by docker-entrypoint.sh) -->
  <script>
    window.__ARCA_CONFIG__ = {
      endpoint: "ARCA_INJECT_ENDPOINT_HERE"
    };
  </script>

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/assets/favicon.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/assets/favicon-16.png" sizes="16x16">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" href="/assets/apple-touch-icon-precomposed.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            vault: {
              bg: '#0f172a',
              card: '#1e293b',
              border: '#334155',
              text: '#e2e8f0',
              muted: '#94a3b8',
              accent: '#00d4ff',
              indigo: '#6366f1',
            }
          },
          fontFamily: {
            display: ['"DM Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- App module (registers Alpine.data before Alpine initializes) -->
  <script type="module" src="/js/app.js"></script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    [x-cloak] { display: none !important; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    /* Glassmorphism card */
    .glass {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.5);
    }

    /* Subtle glow on hover */
    .glass-hover:hover {
      border-color: rgba(0, 212, 255, 0.3);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.05);
    }

    /* Pulse animation for health dot */
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4); }
      50% { box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
    }
    .pulse-green { animation: pulse-glow 2s ease-in-out infinite; }

    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.4); }
      50% { box-shadow: 0 0 0 6px rgba(248, 113, 113, 0); }
    }
    .pulse-red { animation: pulse-red 2s ease-in-out infinite; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Hide scrollbar but keep scrolling */
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }

    /* Drag-drop zone active */
    .drop-active {
      border-color: #00d4ff !important;
      background: rgba(0, 212, 255, 0.05) !important;
    }

    /* Ring chart transition */
    .ring-segment { transition: opacity 0.2s ease; }
    .ring-segment:hover { opacity: 0.8; }

    /* Treemap rect */
    .treemap-rect { transition: opacity 0.15s ease; cursor: pointer; }
    .treemap-rect:hover { opacity: 0.85; }

    /* Slide-in panel */
    .slide-panel {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Login glow */
    .login-glow {
      background: radial-gradient(ellipse at 50% 0%, rgba(0, 212, 255, 0.08) 0%, transparent 60%);
    }

    /* Fade in animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    .fade-in-delay-1 { animation-delay: 0.05s; opacity: 0; }
    .fade-in-delay-2 { animation-delay: 0.1s; opacity: 0; }
    .fade-in-delay-3 { animation-delay: 0.15s; opacity: 0; }
    .fade-in-delay-4 { animation-delay: 0.2s; opacity: 0; }
  </style>
</head>

<body x-data="app" x-init="init()" class="min-h-screen bg-vault-bg">

  <!-- ==================== LOGIN SCREEN ==================== -->
  <template x-if="!authenticated">
    <div class="min-h-screen flex items-center justify-center login-glow" x-cloak>
      <div class="w-full max-w-sm mx-4">
        <!-- Logo -->
        <div class="flex justify-center mb-8">
          <img src="/assets/logo.svg" class="w-20 h-20" alt="Arca">
        </div>

        <h1 class="text-2xl font-semibold text-center mb-1 tracking-tight">Arca Console</h1>
        <p class="text-vault-muted text-sm text-center mb-8">Sign in to manage your storage</p>

        <form @submit.prevent="login()" class="space-y-4">
          <!-- Endpoint field (shown only if not injected) -->
          <div x-show="showEndpointField">
            <label class="block text-xs font-medium text-vault-muted mb-1.5 uppercase tracking-wider">Endpoint URL</label>
            <input type="url" x-model="loginForm.endpoint"
              placeholder="http://localhost:9000"
              class="w-full px-3.5 py-2.5 rounded-lg bg-vault-card border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 focus:ring-1 focus:ring-vault-accent/30 transition text-sm font-mono">
          </div>

          <div>
            <label class="block text-xs font-medium text-vault-muted mb-1.5 uppercase tracking-wider">Access Key ID</label>
            <input type="text" x-model="loginForm.accessKey" required autocomplete="username"
              placeholder="AKIAIOSFODNN7EXAMPLE"
              class="w-full px-3.5 py-2.5 rounded-lg bg-vault-card border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 focus:ring-1 focus:ring-vault-accent/30 transition text-sm font-mono">
          </div>

          <div>
            <label class="block text-xs font-medium text-vault-muted mb-1.5 uppercase tracking-wider">Secret Access Key</label>
            <input type="password" x-model="loginForm.secretKey" required autocomplete="current-password"
              placeholder="wJalrXUtnFEMI/..."
              class="w-full px-3.5 py-2.5 rounded-lg bg-vault-card border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 focus:ring-1 focus:ring-vault-accent/30 transition text-sm font-mono">
          </div>

          <button type="submit" :disabled="loginLoading"
            class="w-full py-2.5 rounded-lg bg-gradient-to-r from-vault-accent to-cyan-400 text-vault-bg font-semibold text-sm hover:opacity-90 transition disabled:opacity-50 mt-2">
            <span x-show="!loginLoading">Sign In</span>
            <span x-show="loginLoading" class="flex items-center justify-center gap-2">
              <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
              Connecting...
            </span>
          </button>

          <p x-show="loginError" x-text="loginError" class="text-red-400 text-xs text-center mt-2"></p>
        </form>
      </div>
    </div>
  </template>

  <!-- ==================== MAIN LAYOUT ==================== -->
  <template x-if="authenticated">
    <div class="flex min-h-screen" x-cloak>

      <!-- Sidebar -->
      <aside class="w-56 flex-shrink-0 border-r border-vault-border/50 flex flex-col bg-vault-bg/80">
        <!-- Logo area -->
        <div class="px-5 py-5 flex items-center gap-3">
          <img src="/assets/logo.svg" class="w-8 h-8 flex-shrink-0" alt="Arca">
          <div>
            <div class="text-sm font-semibold tracking-tight">Arca</div>
            <div class="text-[10px] text-vault-muted uppercase tracking-widest">Console</div>
          </div>
        </div>

        <!-- Nav links -->
        <nav class="flex-1 px-3 mt-2 space-y-0.5">
          <a x-show="isAdmin" href="#/dashboard" @click="navigate('dashboard')"
            :class="view === 'dashboard' ? 'bg-vault-accent/10 text-vault-accent border-vault-accent/30' : 'text-vault-muted hover:text-vault-text hover:bg-white/[0.03] border-transparent'"
            class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition border">
            <!-- Chart icon -->
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 006 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0118 16.5h-2.25m-7.5 0h7.5m-7.5 0l-1 3m8.5-3l1 3m0 0l.5 1.5m-.5-1.5h-9.5m0 0l-.5 1.5"/></svg>
            Dashboard
          </a>
          <a href="#/buckets" @click="navigate('buckets')"
            :class="(view === 'buckets' || view === 'bucket-detail' || view === 'bucket-settings') ? 'bg-vault-accent/10 text-vault-accent border-vault-accent/30' : 'text-vault-muted hover:text-vault-text hover:bg-white/[0.03] border-transparent'"
            class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition border">
            <!-- Bucket icon -->
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"/></svg>
            Buckets
          </a>
          <!-- Users (admin only) -->
          <a x-show="isAdmin" @click="navigate('users')" :class="view === 'users' || view === 'user-detail' ? 'text-vault-accent bg-vault-accent/10 border-r-2 border-vault-accent' : 'text-vault-muted hover:text-vault-text hover:bg-white/5'" class="flex items-center gap-3 px-4 py-2.5 text-sm cursor-pointer transition-all duration-150">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128H9m6 0a5.972 5.972 0 0 0-.786-3.07M9 19.128v-.003c0-1.113.285-2.16.786-3.07M9 19.128H3.375a1.125 1.125 0 0 1-1.125-1.125v-.003c0-2.278 1.848-4.125 4.125-4.125h1.5c.966 0 1.858.333 2.56.891M15.75 6.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
            Users
          </a>
          <!-- Teams (admin only) -->
          <a x-show="isAdmin" @click="navigate('teams')" :class="view === 'teams' || view === 'team-detail' ? 'text-vault-accent bg-vault-accent/10 border-r-2 border-vault-accent' : 'text-vault-muted hover:text-vault-text hover:bg-white/5'" class="flex items-center gap-3 px-4 py-2.5 text-sm cursor-pointer transition-all duration-150">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 0 0 3.741-.479 3 3 0 0 0-4.682-2.72m.94 3.198.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0 1 12 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 0 1 6 18.719m12 0a5.971 5.971 0 0 0-.941-3.197m0 0A5.995 5.995 0 0 0 12 12.75a5.995 5.995 0 0 0-5.058 2.772m0 0a3 3 0 0 0-4.681 2.72 8.986 8.986 0 0 0 3.74.477m.94-3.197a5.971 5.971 0 0 0-.94 3.197M15 6.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm6 3a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Zm-13.5 0a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Z"/></svg>
            Teams
          </a>
          <!-- Grants (admin only) -->
          <a x-show="isAdmin" @click="navigate('grants')" :class="view === 'grants' || view === 'grant-detail' ? 'text-vault-accent bg-vault-accent/10 border-r-2 border-vault-accent' : 'text-vault-muted hover:text-vault-text hover:bg-white/5'" class="flex items-center gap-3 px-4 py-2.5 text-sm cursor-pointer transition-all duration-150">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>
            Grants
          </a>
        </nav>

        <!-- Documentation link -->
        <div class="px-3 mb-2">
          <a :href="window.ARCA_DOCS_URL" target="_blank" rel="noopener"
            class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-accent hover:bg-white/[0.03] transition border border-transparent">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/></svg>
            Documentation
          </a>
        </div>

        <!-- Session info + Logout -->
        <div class="px-3 pb-4 space-y-2">
          <div class="flex items-center gap-2 px-3">
            <span :class="isAdmin ? 'bg-violet-500/20 text-violet-400' : 'bg-slate-500/20 text-slate-400'"
              class="text-[10px] px-1.5 py-0.5 rounded font-medium uppercase" x-text="isAdmin ? 'Admin' : 'User'"></span>
            <span class="text-[10px] text-vault-muted truncate" x-text="sessionStorage.getItem('arca_access_key')?.slice(0, 12) + '…'"></span>
          </div>
          <button @click="logout()"
            class="flex items-center gap-3 px-3 py-2 w-full rounded-lg text-sm text-vault-muted hover:text-red-400 hover:bg-red-500/5 transition">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>
            Sign Out
          </button>
          <div class="text-[10px] text-vault-muted/50 text-center pt-1" x-text="'Console v' + window.ARCA_CONSOLE_VERSION"></div>
        </div>
      </aside>

      <!-- Main content -->
      <main class="flex-1 overflow-auto">

        <!-- ==================== DASHBOARD ==================== -->
        <template x-if="view === 'dashboard'">
          <div class="p-6 max-w-6xl" x-data="dashboardView" x-init="load()">
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-xl font-semibold tracking-tight">Dashboard</h2>
              <div class="flex items-center gap-2 text-xs text-vault-muted">
                <div :class="health === 'ok' ? 'bg-green-400 pulse-green' : 'bg-red-400 pulse-red'" class="w-2 h-2 rounded-full"></div>
                <span x-text="health === 'ok' ? 'Healthy' : 'Unreachable'"></span>
              </div>
            </div>

            <!-- Bento grid -->
            <div class="grid grid-cols-4 gap-4">
              <!-- Server info (spans 2 cols) -->
              <div class="col-span-2 glass rounded-xl p-5 glass-hover fade-in">
                <div class="flex items-center gap-2 mb-4">
                  <svg class="w-4 h-4 text-vault-accent" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 14.25h13.5m-13.5 0a3 3 0 01-3-3m3 3a3 3 0 100 6h13.5a3 3 0 100-6m-16.5-3a3 3 0 013-3h13.5a3 3 0 013 3m-19.5 0a4.5 4.5 0 01.9-2.7L5.737 5.1a3.375 3.375 0 012.7-1.35h7.126c1.062 0 2.062.5 2.7 1.35l2.587 3.45a4.5 4.5 0 01.9 2.7m0 0a3 3 0 01-3 3m0 3h.008v.008h-.008v-.008zm0-6h.008v.008h-.008v-.008zm-3 6h.008v.008h-.008v-.008zm0-6h.008v.008h-.008v-.008z"/></svg>
                  <span class="text-xs font-medium text-vault-muted uppercase tracking-wider">Server</span>
                </div>
                <div class="grid grid-cols-3 gap-4">
                  <div>
                    <div class="text-vault-muted text-xs mb-1">Version</div>
                    <div class="text-lg font-semibold font-mono" x-text="info.version || '—'"></div>
                  </div>
                  <div>
                    <div class="text-vault-muted text-xs mb-1">Uptime</div>
                    <div class="text-lg font-semibold" x-text="formatUptime(info.uptime_seconds)"></div>
                  </div>
                  <div>
                    <div class="text-vault-muted text-xs mb-1">Transport</div>
                    <div class="flex items-center gap-1.5">
                      <template x-if="info.tls_enabled">
                        <svg class="w-4 h-4 text-green-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>
                      </template>
                      <template x-if="!info.tls_enabled">
                        <svg class="w-4 h-4 text-vault-muted" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5V6.75a4.5 4.5 0 1 1 9 0v3.75M3.75 21.75h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H3.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>
                      </template>
                      <span x-text="info.tls_enabled ? 'TLS' : 'HTTP'"
                            :class="info.tls_enabled ? 'text-green-400' : 'text-vault-muted'"
                            class="text-lg font-semibold"></span>
                    </div>
                  </div>
                  <div>
                    <div class="text-vault-muted text-xs mb-1">Encryption</div>
                    <div class="flex items-center gap-1.5">
                      <template x-if="info.encryption_enabled || info.kms_provider">
                        <svg class="w-4 h-4 text-green-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>
                      </template>
                      <template x-if="!info.encryption_enabled && !info.kms_provider">
                        <svg class="w-4 h-4 text-vault-muted" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0-10.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285ZM12 15.75h.007v.008H12v-.008Z"/></svg>
                      </template>
                      <span x-text="info.encryption_enabled
                              ? (info.kms_provider === 'vault' ? 'SSE-S3 (Vault)' : 'SSE-S3 (Local)')
                              : (info.kms_provider === 'vault' ? 'Per-bucket (Vault)' : (info.kms_provider ? 'Per-bucket (Local)' : 'Off'))"
                            :class="(info.encryption_enabled || info.kms_provider) ? 'text-green-400' : 'text-vault-muted'"
                            class="text-lg font-semibold"></span>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Bucket count -->
              <div class="glass rounded-xl p-5 glass-hover fade-in fade-in-delay-1">
                <div class="text-vault-muted text-xs mb-3 uppercase tracking-wider font-medium">Buckets</div>
                <div class="text-3xl font-semibold text-vault-accent" x-text="stats.bucket_count ?? '—'"></div>
              </div>

              <!-- Object count -->
              <div class="glass rounded-xl p-5 glass-hover fade-in fade-in-delay-2">
                <div class="text-vault-muted text-xs mb-3 uppercase tracking-wider font-medium">Objects</div>
                <div class="text-3xl font-semibold text-vault-indigo" x-text="stats.object_count ?? '—'"></div>
              </div>

              <!-- Storage ring (spans 2 cols, 2 rows) -->
              <div class="col-span-2 row-span-2 glass rounded-xl p-5 glass-hover fade-in fade-in-delay-3">
                <div class="flex items-center gap-2 mb-4">
                  <svg class="w-4 h-4 text-vault-accent" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6a7.5 7.5 0 107.5 7.5h-7.5V6z"/><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5H21A7.5 7.5 0 0013.5 3v7.5z"/></svg>
                  <span class="text-xs font-medium text-vault-muted uppercase tracking-wider">Storage Distribution</span>
                </div>
                <div class="flex flex-col items-center">
                  <!-- Donut chart -->
                  <div x-html="renderRing()"></div>
                  <!-- Legend -->
                  <div class="mt-3 w-full space-y-1 overflow-hidden" x-show="bucketSizes.length > 0">
                    <template x-for="(b, i) in bucketSizes" :key="b.name">
                      <a :href="'#/buckets/' + encodeURIComponent(b.name)" class="flex items-center gap-2 text-xs rounded px-1 -mx-1 py-1 hover:bg-white/[0.03] transition group cursor-pointer no-underline text-inherit">
                        <div class="w-2.5 h-2.5 rounded-sm flex-shrink-0" :style="'background:' + ringColors[i % ringColors.length]"></div>
                        <span class="truncate flex-1 group-hover:text-vault-accent transition" x-text="b.name"></span>
                        <span x-show="b.encrypted" x-html="icons.encryptionShield" title="Encrypted"></span>
                        <span x-show="b.versioned" x-html="b.versioned === 'Suspended' ? icons.versioningSuspended : icons.versioningClock" :title="'Versioning: ' + b.versioned"></span>
                        <span class="text-vault-muted font-mono" x-text="formatBytes(b.size)"></span>
                      </a>
                    </template>
                  </div>
                  <div x-show="bucketSizes.length === 0" class="text-vault-muted text-xs mt-4">No buckets yet</div>
                </div>
              </div>

              <!-- Total storage -->
              <div class="col-span-2 glass rounded-xl p-5 glass-hover fade-in fade-in-delay-4">
                <div class="text-vault-muted text-xs mb-3 uppercase tracking-wider font-medium">Total Storage</div>
                <div class="text-3xl font-semibold">
                  <span class="bg-gradient-to-r from-vault-accent to-vault-indigo bg-clip-text text-transparent" x-text="formatBytes(stats.total_size_bytes || 0)"></span>
                </div>
                <template x-if="stats.disk_total_bytes">
                  <div class="mt-3">
                    <div class="flex justify-between text-xs text-vault-muted mb-1.5">
                      <span x-text="formatBytes(stats.disk_total_bytes - stats.disk_available_bytes) + ' used'"></span>
                      <span x-text="formatBytes(stats.disk_available_bytes) + ' free of ' + formatBytes(stats.disk_total_bytes)"></span>
                    </div>
                    <div class="w-full h-1.5 rounded-full bg-vault-border/50 overflow-hidden">
                      <div class="h-full rounded-full bg-gradient-to-r from-vault-accent to-vault-indigo transition-all duration-500"
                        :style="'width:' + Math.min(100, ((stats.disk_total_bytes - stats.disk_available_bytes) / stats.disk_total_bytes * 100)).toFixed(1) + '%'"></div>
                    </div>
                  </div>
                </template>
              </div>


            </div>
          </div>
        </template>

        <!-- ==================== BUCKETS LIST ==================== -->
        <template x-if="view === 'buckets'">
          <div class="p-6 max-w-6xl" x-data="bucketsView" x-init="load()">
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-xl font-semibold tracking-tight">Buckets</h2>
              <button @click="showCreateModal = true"
                class="px-3.5 py-1.5 rounded-lg bg-vault-accent/10 text-vault-accent border border-vault-accent/20 text-sm font-medium hover:bg-vault-accent/20 transition">
                + Create Bucket
              </button>
            </div>

            <!-- Bucket cards -->
            <div x-show="!loading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              <template x-for="b in buckets" :key="b.name">
                <div @click="openBucket(b.name)"
                  class="glass rounded-xl p-5 glass-hover cursor-pointer transition group">
                  <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                      <svg class="w-5 h-5 text-vault-accent" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"/></svg>
                      <span class="font-medium text-sm" x-text="b.name"></span>
                    </div>
                    <button @click.stop="window.location.hash = '#/buckets/' + encodeURIComponent(b.name) + '/settings'"
                      class="opacity-0 group-hover:opacity-100 p-1 rounded hover:bg-vault-accent/10 text-vault-muted hover:text-vault-accent transition" title="Bucket settings">
                      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    </button>
                  </div>
                  <div class="flex items-center gap-2 text-xs text-vault-muted">
                    <span>Created <span x-text="new Date(b.creationDate).toLocaleDateString()"></span></span>
                    <template x-if="b.encrypted">
                      <span class="flex items-center gap-1 text-green-400" title="SSE-S3 (AES-256)">
                        <span x-html="icons.encryptionShield"></span>
                        <span class="text-[10px] font-medium">Encrypted</span>
                      </span>
                    </template>
                    <template x-if="b.versioned">
                      <span class="flex items-center gap-1" :class="b.versioned === 'Suspended' ? 'text-amber-400' : 'text-blue-400'" :title="'Versioning: ' + b.versioned">
                        <span x-html="b.versioned === 'Suspended' ? icons.versioningSuspended : icons.versioningClock"></span>
                        <span class="text-[10px] font-medium" x-text="b.versioned === 'Suspended' ? 'Suspended' : 'Versioned'"></span>
                      </span>
                    </template>
                  </div>
                </div>
              </template>
            </div>

            <div x-show="!loading && buckets.length === 0" class="text-center py-16">
              <svg class="w-12 h-12 mx-auto text-vault-border mb-4" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"/></svg>
              <p class="text-vault-muted text-sm">No buckets yet. Create one to get started.</p>
            </div>

            <div x-show="loading" class="flex justify-center py-16">
              <svg class="animate-spin h-6 w-6 text-vault-accent" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            </div>

            <!-- Create bucket modal -->
            <div x-show="showCreateModal" x-transition.opacity x-effect="if (showCreateModal) $nextTick(() => $refs.bucketNameInput?.focus())" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="showCreateModal = false">
              <div class="glass rounded-xl p-6 w-full max-w-sm mx-4" @click.stop>
                <h3 class="text-lg font-semibold mb-4">Create Bucket</h3>
                <form @submit.prevent="createBucket()">
                  <input type="text" x-model="newBucketName" x-ref="bucketNameInput" required
                    placeholder="my-bucket-name" pattern="[a-z0-9][a-z0-9.\-]{1,61}[a-z0-9]"
                    class="w-full px-3.5 py-2.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 focus:ring-1 focus:ring-vault-accent/30 transition text-sm font-mono mb-1">
                  <p class="text-[10px] text-vault-muted mb-4">Lowercase letters, numbers, hyphens, dots. 3-63 characters.</p>
                  <div class="flex gap-3 justify-end">
                    <button type="button" @click="showCreateModal = false" class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Cancel</button>
                    <button type="submit" :disabled="creating" class="px-4 py-2 rounded-lg bg-vault-accent text-vault-bg text-sm font-medium hover:opacity-90 transition disabled:opacity-50">Create</button>
                  </div>
                  <p x-show="createError" x-text="createError" class="text-red-400 text-xs mt-2"></p>
                </form>
              </div>
            </div>

          </div>
        </template>

        <!-- ==================== BUCKET SETTINGS ==================== -->
        <template x-if="view === 'bucket-settings'">
          <div class="p-6 max-w-3xl" x-data="bucketSettingsView" x-init="load()">
            <!-- Breadcrumbs -->
            <div class="flex items-center gap-2 text-sm mb-6">
              <a href="#/buckets" class="text-vault-muted hover:text-vault-accent transition">Buckets</a>
              <span class="text-vault-border">/</span>
              <a :href="'#/buckets/' + encodeURIComponent(bucketName)" class="text-vault-accent hover:underline font-medium" x-text="bucketName"></a>
              <span class="text-vault-border">/</span>
              <span class="text-vault-text">Settings</span>
            </div>

            <h2 class="text-xl font-semibold tracking-tight mb-6">Bucket Settings</h2>

            <div x-show="loading" class="flex justify-center py-16">
              <svg class="animate-spin h-6 w-6 text-vault-accent" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            </div>

            <div x-show="!loading" class="space-y-6">
              <!-- Encryption card -->
              <div class="glass rounded-xl p-5">
                <div class="flex items-center gap-2 mb-4">
                  <svg class="w-4 h-4 text-vault-accent" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>
                  <span class="text-sm font-semibold uppercase tracking-wider text-vault-muted">Encryption</span>
                </div>

                <!-- Read-only: server-level encryption is ON -->
                <template x-if="adminInfoAvailable && serverEncryptionEnabled">
                  <div>
                    <div class="flex items-center gap-1.5 mb-2">
                      <svg class="w-4 h-4 text-green-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>
                      <span class="text-sm text-green-400 font-medium" x-text="kmsProvider === 'vault' ? 'SSE-S3 (Vault) Active' : 'SSE-S3 (AES-256) Active'"></span>
                    </div>
                    <p class="text-xs text-vault-muted" x-text="kmsProvider === 'vault' ? 'Encryption is enabled via Vault/OpenBAO KMS. All buckets are encrypted by default.' : 'Encryption is enabled at the server level. All buckets are encrypted by default.'"></p>
                  </div>
                </template>

                <!-- Interactive: server encryption OFF (or non-admin) -->
                <template x-if="!adminInfoAvailable || !serverEncryptionEnabled">
                  <div>
                    <!-- Server default info (admin only) -->
                    <div x-show="adminInfoAvailable" class="flex items-center gap-2 mb-4 text-xs">
                      <span class="text-vault-muted">Server default:</span>
                      <span class="text-vault-muted font-medium">Disabled</span>
                    </div>

                    <!-- Toggle -->
                    <div class="flex items-center justify-between">
                      <div>
                        <div class="text-sm font-medium text-vault-text">Per-bucket encryption</div>
                        <div class="text-xs text-vault-muted mt-0.5"
                          x-text="encryptionOverride ? 'AES-256 explicitly enabled for this bucket' : 'Not enabled'"></div>
                      </div>
                      <button @click="toggleEncryption()" :disabled="encryptionSaving"
                        :class="encryptionOverride ? 'bg-vault-accent' : 'bg-vault-border'"
                        class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors disabled:opacity-50">
                        <span :class="encryptionOverride ? 'translate-x-6' : 'translate-x-1'"
                          class="inline-block h-4 w-4 rounded-full bg-white transition-transform"></span>
                      </button>
                    </div>

                    <!-- Effective status -->
                    <div class="mt-4 pt-4 border-t border-vault-border/30">
                      <div class="flex items-center gap-2">
                        <template x-if="encryptionActive">
                          <div class="flex items-center gap-1.5">
                            <svg class="w-4 h-4 text-green-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>
                            <span class="text-sm text-green-400 font-medium" x-text="kmsProvider === 'vault' ? 'SSE-S3 (Vault) Active' : 'SSE-S3 (AES-256) Active'"></span>
                            <span class="text-xs text-vault-muted ml-1" x-text="encryptionOverride ? '(per-bucket)' : '(server default)'"></span>
                          </div>
                        </template>
                        <template x-if="!encryptionActive">
                          <div class="flex items-center gap-1.5">
                            <svg class="w-4 h-4 text-vault-muted" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0-10.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285ZM12 15.75h.007v.008H12v-.008Z"/></svg>
                            <span class="text-sm text-vault-muted font-medium">Not encrypted</span>
                          </div>
                        </template>
                      </div>
                    </div>

                    <p x-show="encryptionError" x-text="encryptionError" class="text-red-400 text-xs mt-3"></p>
                  </div>
                </template>
              </div>

              <!-- Versioning card -->
              <div class="glass rounded-xl p-5">
                <div class="flex items-center gap-2 mb-4">
                  <svg class="w-4 h-4 text-vault-accent" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                  <span class="text-sm font-semibold uppercase tracking-wider text-vault-muted">Versioning</span>
                </div>

                <!-- Toggle -->
                <div class="flex items-center justify-between">
                  <div>
                    <div class="text-sm font-medium text-vault-text">Object Versioning</div>
                    <div class="text-xs text-vault-muted mt-0.5"
                      x-text="versioningStatus === 'Enabled' ? 'All object writes create new versions' : versioningStatus === 'Suspended' ? 'Suspended, new writes use null version ID' : 'Not enabled'"></div>
                  </div>
                  <button @click="toggleVersioning()" :disabled="versioningSaving"
                    :class="versioningStatus === 'Enabled' ? 'bg-vault-accent' : versioningStatus === 'Suspended' ? 'bg-amber-500' : 'bg-vault-border'"
                    class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors disabled:opacity-50">
                    <span :class="versioningStatus === 'Enabled' || versioningStatus === 'Suspended' ? 'translate-x-6' : 'translate-x-1'"
                      class="inline-block h-4 w-4 rounded-full bg-white transition-transform"></span>
                  </button>
                </div>

                <!-- Effective status -->
                <div class="mt-4 pt-4 border-t border-vault-border/30">
                  <div class="flex items-center gap-2">
                    <template x-if="versioningStatus === 'Enabled'">
                      <div class="flex items-center gap-1.5">
                        <svg class="w-4 h-4 text-green-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                        <span class="text-sm text-green-400 font-medium">Versioning Active</span>
                      </div>
                    </template>
                    <template x-if="versioningStatus === 'Suspended'">
                      <div class="flex items-center gap-1.5">
                        <svg class="w-4 h-4 text-amber-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.25 9v6m-4.5 0V9M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                        <span class="text-sm text-amber-400 font-medium">Versioning Suspended</span>
                        <span class="text-xs text-vault-muted ml-1">(existing versions preserved)</span>
                      </div>
                    </template>
                    <template x-if="!versioningStatus">
                      <div class="flex items-center gap-1.5">
                        <svg class="w-4 h-4 text-vault-muted" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                        <span class="text-sm text-vault-muted font-medium">Not versioned</span>
                      </div>
                    </template>
                  </div>
                </div>

                <p x-show="versioningError" x-text="versioningError" class="text-red-400 text-xs mt-3"></p>
              </div>

              <!-- Danger zone -->
              <div class="glass rounded-xl p-5 border-red-500/30" style="border-color: rgba(239, 68, 68, 0.3);">
                <div class="flex items-center gap-2 mb-4">
                  <svg class="w-4 h-4 text-red-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/></svg>
                  <span class="text-sm font-semibold uppercase tracking-wider text-red-400">Danger Zone</span>
                </div>
                <div class="flex items-center justify-between">
                  <div>
                    <div class="text-sm font-medium text-vault-text">Delete this bucket</div>
                    <div class="text-xs text-vault-muted mt-0.5">Once deleted, this bucket and its configuration cannot be recovered.</div>
                  </div>
                  <button @click="showDeleteModal = true"
                    class="px-3.5 py-1.5 rounded-lg bg-red-500/10 text-red-400 border border-red-500/30 text-sm font-medium hover:bg-red-500/20 transition whitespace-nowrap">
                    Delete Bucket
                  </button>
                </div>
              </div>
            </div>

            <!-- Delete confirm modal (type to confirm) -->
            <div x-show="showDeleteModal" x-transition.opacity x-effect="if (showDeleteModal) { deleteBucketConfirmName = ''; deleteError = ''; $nextTick(() => $refs.deleteConfirmInput?.focus()); }" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="showDeleteModal = false">
              <div class="glass rounded-xl p-6 w-full max-w-sm mx-4" @click.stop>
                <h3 class="text-lg font-semibold mb-2">Delete Bucket</h3>
                <p class="text-sm text-vault-muted mb-3">This action cannot be undone. Type <span class="text-vault-text font-mono" x-text="bucketName"></span> to confirm.</p>
                <form @submit.prevent="deleteBucket()">
                  <input type="text" x-model="deleteBucketConfirmName" x-ref="deleteConfirmInput"
                    placeholder="Type bucket name to confirm"
                    class="w-full px-3.5 py-2.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-red-500/50 focus:ring-1 focus:ring-red-500/30 transition text-sm font-mono mb-4">
                  <div class="flex gap-3 justify-end">
                    <button type="button" @click="showDeleteModal = false" class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Cancel</button>
                    <button type="submit" :disabled="deleteBucketConfirmName !== bucketName || deleting"
                      class="px-4 py-2 rounded-lg bg-red-500/20 text-red-400 border border-red-500/30 text-sm font-medium hover:bg-red-500/30 transition disabled:opacity-50"
                      x-text="deleting ? 'Deleting...' : 'Delete'"></button>
                  </div>
                  <p x-show="deleteError" x-text="deleteError" class="text-red-400 text-xs mt-2"></p>
                </form>
              </div>
            </div>
          </div>
        </template>

        <!-- ==================== BUCKET DETAIL (Object Browser) ==================== -->
        <template x-if="view === 'bucket-detail'">
          <div class="p-6 max-w-6xl overflow-hidden" x-data="bucketDetailView" x-init="load()">
            <!-- Header with breadcrumbs -->
            <div class="flex items-center justify-between mb-6 gap-4">
              <div data-breadcrumbs class="flex items-center gap-2 text-sm min-w-0 overflow-x-auto whitespace-nowrap scrollbar-hide">
                <a href="#/buckets" @click="$store.app && navigate('buckets')" class="text-vault-muted hover:text-vault-accent transition flex-shrink-0">Buckets</a>
                <span class="text-vault-border">/</span>
                <span x-show="bucketEncrypted" x-cloak title="Encrypted bucket" x-html="icons.encryptionShield"></span>
                <span x-show="bucketVersioned" x-cloak :title="'Versioning: ' + bucketVersioned" x-html="bucketVersioned === 'Suspended' ? icons.versioningSuspended : icons.versioningClock"></span>
                <button @click="navigatePrefix('')" class="text-vault-accent hover:underline font-medium" x-text="bucketName"></button>
                <template x-for="(part, i) in prefixParts" :key="i">
                  <span class="flex items-center gap-2">
                    <span class="text-vault-border">/</span>
                    <button @click="navigatePrefix(prefixUpTo(i))" class="text-vault-accent hover:underline" x-text="part"></button>
                  </span>
                </template>
              </div>
              <div class="flex items-center gap-2 flex-shrink-0">
                <!-- Show deleted toggle (versioned buckets only) -->
                <div x-show="bucketVersioned" x-cloak class="flex items-center gap-1.5 mr-1">
                  <span class="text-[11px] text-vault-muted">Show deleted</span>
                  <button @click="toggleShowDeleted()"
                    :class="showDeleted ? 'bg-red-500' : 'bg-vault-border'"
                    class="relative inline-flex h-5 w-9 items-center rounded-full transition-colors"
                    title="Show deleted objects">
                    <span :class="showDeleted ? 'translate-x-5' : 'translate-x-0.5'"
                      class="inline-block h-3.5 w-3.5 rounded-full bg-white transition-transform"></span>
                  </button>
                </div>
                <a :href="'#/buckets/' + encodeURIComponent(bucketName) + '/settings'"
                  class="p-2 rounded-lg border border-vault-border/50 hover:border-vault-accent/30 text-vault-muted hover:text-vault-accent transition" title="Bucket settings">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                </a>
                <button @click="showTreemap = !showTreemap; if (showTreemap) computeTreemap()"
                  :class="showTreemap ? 'bg-vault-accent/20 text-vault-accent' : 'text-vault-muted'"
                  class="p-2 rounded-lg border border-vault-border/50 hover:border-vault-accent/30 transition" title="Treemap view">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
                </button>
                <button @click="showCreateFolderModal = true"
                  class="px-3.5 py-1.5 rounded-lg bg-vault-indigo/10 text-vault-indigo border border-vault-indigo/20 text-sm font-medium hover:bg-vault-indigo/20 transition">
                  + Folder
                </button>
                <label class="px-3.5 py-1.5 rounded-lg bg-vault-accent/10 text-vault-accent border border-vault-accent/20 text-sm font-medium hover:bg-vault-accent/20 transition cursor-pointer">
                  Upload Files
                  <input type="file" multiple class="hidden" @change="uploadFiles($event.target.files); $event.target.value = ''">
                </label>
                <label class="px-3.5 py-1.5 rounded-lg bg-vault-accent/10 text-vault-accent border border-vault-accent/20 text-sm font-medium hover:bg-vault-accent/20 transition cursor-pointer">
                  Upload Folder
                  <input type="file" webkitdirectory class="hidden" @change="uploadFiles($event.target.files); $event.target.value = ''">
                </label>
              </div>
            </div>

            <!-- Selection action bar -->
            <div x-show="selectedKeys.size > 0" x-transition
              class="glass rounded-xl px-4 py-2.5 mb-3 flex items-center justify-between">
              <span class="text-sm text-vault-muted">
                <span class="text-vault-accent font-semibold" x-text="selectedKeys.size"></span> selected
              </span>
              <div class="flex items-center gap-2">
                <button @click="downloadSelected()" :disabled="archiving"
                  class="px-3 py-1.5 rounded-lg bg-vault-accent/10 text-vault-accent border border-vault-accent/20 text-sm font-medium hover:bg-vault-accent/20 transition disabled:opacity-50 flex items-center gap-1.5">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                  <span x-text="archiving ? 'Archiving...' : 'Download .tar.gz'"></span>
                </button>
                <button @click="confirmDeleteSelected()" :disabled="deleting"
                  class="px-3 py-1.5 rounded-lg bg-red-500/10 text-red-400 border border-red-500/20 text-sm font-medium hover:bg-red-500/20 transition disabled:opacity-50 flex items-center gap-1.5">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
                  Delete
                </button>
                <button @click="selectedKeys = new Set()" class="p-1.5 rounded-lg text-vault-muted hover:text-vault-text transition" title="Clear selection">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
            </div>

            <!-- Drop zone -->
            <div x-show="!showTreemap"
              @dragover.prevent="dragActive = true"
              @dragleave.prevent="dragActive = false"
              @drop.prevent="dragActive = false; handleDrop($event)"
              :class="dragActive ? 'drop-active' : ''"
              class="border-2 border-dashed border-vault-border/50 rounded-xl mb-4 transition"
              :style="dragActive ? '' : 'border-color: transparent'">

              <!-- Upload progress -->
              <div x-show="uploading" class="px-5 py-3">
                <div class="flex items-center justify-between text-sm mb-2">
                  <span class="text-vault-muted">Uploading <span x-text="uploadFileName"></span></span>
                  <span class="text-vault-accent font-mono" x-text="uploadProgress + '%'"></span>
                </div>
                <div class="w-full h-1.5 rounded-full bg-vault-border/30 overflow-hidden">
                  <div class="h-full bg-gradient-to-r from-vault-accent to-vault-indigo rounded-full transition-all duration-300" :style="'width:' + uploadProgress + '%'"></div>
                </div>
              </div>

              <!-- Object list header (select all) -->
              <div x-show="!loading && (directories.length > 0 || objects.length > 0)"
                class="flex items-center gap-3 px-5 py-2 border-b border-vault-border/30">
                <input type="checkbox" @click.stop
                  :checked="allSelected" @change="toggleSelectAll()"
                  class="w-3.5 h-3.5 rounded border-vault-border bg-vault-bg text-vault-accent focus:ring-vault-accent/30 focus:ring-offset-0 cursor-pointer">
                <span class="text-[10px] uppercase tracking-wider text-vault-muted/60">Select all</span>
              </div>

              <!-- Object list -->
              <div x-show="!loading">
                <!-- Directories -->
                <template x-for="dir in directories" :key="dir">
                  <div class="flex items-center gap-3 px-5 py-3 hover:bg-white/[0.02] cursor-pointer transition border-b border-vault-border/20 group"
                    :class="selectedKeys.has('dir:' + dir) ? 'bg-vault-accent/5' : ''">
                    <input type="checkbox" @click.stop
                      :checked="selectedKeys.has('dir:' + dir)" @change="toggleSelect('dir:' + dir)"
                      class="w-3.5 h-3.5 rounded border-vault-border bg-vault-bg text-vault-accent focus:ring-vault-accent/30 focus:ring-offset-0 cursor-pointer">
                    <div @click="navigatePrefix(dir)" class="flex items-center gap-3 flex-1 min-w-0">
                      <svg class="w-5 h-5 text-vault-accent/70 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"/></svg>
                      <span class="text-sm flex-1" x-text="dirName(dir)"></span>
                    </div>
                    <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
                      <button @click.stop="confirmDeleteDir(dir)" class="p-1 rounded hover:bg-red-500/10 text-vault-muted hover:text-red-400 transition" title="Delete folder">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
                      </button>
                    </div>
                  </div>
                </template>

                <!-- Deleted directories (shown when "Show deleted" is on) -->
                <template x-for="dir in deletedDirectories" :key="'deld:' + dir">
                  <div class="flex items-center gap-3 px-5 py-2.5 hover:bg-white/[0.02] cursor-pointer transition border-b border-vault-border/20 opacity-50"
                    @click="navigatePrefix(dir)">
                    <div class="w-3.5 h-3.5"></div>
                    <svg class="w-5 h-5 text-red-400/60 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"/></svg>
                    <span class="text-sm flex-1 line-through text-red-400/60" x-text="dirName(dir)"></span>
                    <span class="text-[9px] px-1.5 py-0.5 rounded bg-red-500/15 text-red-400 font-medium uppercase">Deleted</span>
                  </div>
                </template>

                <!-- Files -->
                <template x-for="obj in objects" :key="obj.key">
                  <div class="flex items-center gap-3 px-5 py-3 hover:bg-white/[0.02] cursor-pointer transition border-b border-vault-border/20 group"
                    :class="selectedKeys.has(obj.key) ? 'bg-vault-accent/5' : ''"
                    @click="selectObject(obj)">
                    <input type="checkbox" @click.stop
                      :checked="selectedKeys.has(obj.key)" @change="toggleSelect(obj.key)"
                      class="w-3.5 h-3.5 rounded border-vault-border bg-vault-bg text-vault-accent focus:ring-vault-accent/30 focus:ring-offset-0 cursor-pointer">
                    <svg class="w-5 h-5 text-vault-muted shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
                    <span class="text-sm flex-1 truncate" x-text="fileName(obj.key)"></span>
                    <span class="text-xs text-vault-muted font-mono" x-text="formatBytes(obj.size)"></span>
                    <span class="text-xs text-vault-muted" x-text="new Date(obj.lastModified).toLocaleDateString()"></span>
                    <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
                      <button @click.stop="openShareModal(obj.key)" class="p-1 rounded hover:bg-vault-accent/10 text-vault-muted hover:text-vault-accent transition" title="Share">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 7.5 9.566 5.314m0 0a2.25 2.25 0 1 0 3.935 2.186 2.25 2.25 0 0 0-3.935-2.186Zm0-12.814a2.25 2.25 0 1 0 3.933-2.185 2.25 2.25 0 0 0-3.933 2.185Z"/></svg>
                      </button>
                      <button @click.stop="downloadObject(obj.key)" class="p-1 rounded hover:bg-vault-accent/10 text-vault-muted hover:text-vault-accent transition" title="Download">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                      </button>
                      <button @click.stop="confirmDeleteObject(obj.key)" class="p-1 rounded hover:bg-red-500/10 text-vault-muted hover:text-red-400 transition" title="Delete">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
                      </button>
                    </div>
                  </div>
                </template>

                <!-- Deleted objects (shown when "Show deleted" is on) -->
                <template x-for="obj in deletedObjects" :key="'del:' + obj.key">
                  <div class="flex items-center gap-3 px-5 py-3 hover:bg-white/[0.02] cursor-pointer transition border-b border-vault-border/20 group opacity-50"
                    @click="selectObject({key: obj.key, size: 0, lastModified: obj.lastModified, etag: '', _deleted: true})">
                    <div class="w-3.5 h-3.5"></div>
                    <svg class="w-5 h-5 text-red-400/60 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
                    <span class="text-sm flex-1 truncate line-through text-red-400/60" x-text="fileName(obj.key)"></span>
                    <span class="text-[9px] px-1.5 py-0.5 rounded bg-red-500/15 text-red-400 font-medium uppercase">Deleted</span>
                    <span class="text-xs text-vault-muted" x-text="new Date(obj.lastModified).toLocaleDateString()"></span>
                  </div>
                </template>
              </div>

              <!-- Empty state -->
              <div x-show="!loading && directories.length === 0 && objects.length === 0" class="py-16 text-center">
                <svg class="w-12 h-12 mx-auto text-vault-border mb-4" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/></svg>
                <p class="text-vault-muted text-sm mb-1">This location is empty</p>
                <p class="text-vault-muted/60 text-xs">Drag and drop files or folders here, or click Upload</p>
              </div>

              <div x-show="loading" class="flex justify-center py-16">
                <svg class="animate-spin h-6 w-6 text-vault-accent" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
              </div>
            </div>

            <!-- Treemap -->
            <div x-show="showTreemap && objects.length > 0" class="glass rounded-xl p-4"
              x-html="renderTreemap()"></div>

            <!-- Object detail panel -->
            <div x-show="selectedObject" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
              class="fixed right-0 top-0 h-full w-80 glass border-l border-vault-border/50 z-40 slide-panel overflow-y-auto">
              <div class="p-5">
                <div class="flex items-center justify-between mb-5">
                  <h3 class="text-sm font-semibold uppercase tracking-wider text-vault-muted">Object Detail</h3>
                  <button @click="selectedObject = null" class="p-1 rounded hover:bg-white/5 text-vault-muted hover:text-vault-text transition">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                  </button>
                </div>
                <template x-if="selectedObject">
                  <div class="space-y-4">
                    <div>
                      <div class="text-xs text-vault-muted mb-1">Key</div>
                      <div class="text-sm font-mono break-all" x-text="selectedObject.key"></div>
                    </div>
                    <div>
                      <div class="text-xs text-vault-muted mb-1">Size</div>
                      <div class="text-sm font-mono" x-text="formatBytes(selectedObject.size)"></div>
                    </div>
                    <div>
                      <div class="text-xs text-vault-muted mb-1">ETag</div>
                      <div class="text-sm font-mono break-all" x-text="selectedObject.etag"></div>
                    </div>
                    <div>
                      <div class="text-xs text-vault-muted mb-1">Last Modified</div>
                      <div class="text-sm" x-text="new Date(selectedObject.lastModified).toLocaleString()"></div>
                    </div>
                    <template x-if="selectedObject.encrypted">
                      <div>
                        <div class="text-xs text-vault-muted mb-1">Encryption</div>
                        <div class="flex items-center gap-1.5">
                          <svg class="w-3.5 h-3.5 text-green-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>
                          <span class="text-sm text-green-400 font-medium">Encrypted</span>
                        </div>
                      </div>
                    </template>
                    <div class="flex gap-2 pt-2">
                      <button @click="openShareModal(selectedObject.key)" class="flex-1 py-2 rounded-lg bg-vault-indigo/10 text-vault-indigo text-sm font-medium hover:bg-vault-indigo/20 transition">Share</button>
                      <button @click="downloadObject(selectedObject.key)" class="flex-1 py-2 rounded-lg bg-vault-accent/10 text-vault-accent text-sm font-medium hover:bg-vault-accent/20 transition">Download</button>
                      <button @click="confirmDeleteObject(selectedObject.key)" class="flex-1 py-2 rounded-lg bg-red-500/10 text-red-400 text-sm font-medium hover:bg-red-500/20 transition">Delete</button>
                    </div>

                    <!-- Version History (only for versioned buckets) -->
                    <div x-show="bucketVersioned" class="pt-2 border-t border-vault-border/30">
                      <button @click="toggleVersions()" class="flex items-center justify-between w-full py-2 text-sm font-medium text-vault-muted hover:text-vault-text transition">
                        <span class="flex items-center gap-1.5">
                          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                          Versions
                          <span x-show="versions.length > 0" class="text-[10px] px-1.5 py-0.5 rounded-full bg-vault-accent/20 text-vault-accent font-medium" x-text="versions.length"></span>
                        </span>
                        <svg :class="versionsExpanded ? 'rotate-180' : ''" class="w-4 h-4 transition-transform" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
                      </button>

                      <div x-show="versionsExpanded" x-transition>
                        <!-- Loading -->
                        <div x-show="versionsLoading" class="flex justify-center py-4">
                          <svg class="animate-spin h-4 w-4 text-vault-accent" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                        </div>

                        <!-- Error -->
                        <p x-show="versionsError" x-text="versionsError" class="text-red-400 text-xs py-2"></p>

                        <!-- No versions -->
                        <div x-show="!versionsLoading && !versionsError && versions.length === 0" class="text-vault-muted/60 text-xs text-center py-4">
                          No version history available
                        </div>

                        <!-- Version list -->
                        <div x-show="!versionsLoading && versions.length > 0" class="space-y-1.5 max-h-64 overflow-y-auto">
                          <template x-for="ver in versions" :key="ver.versionId">
                            <div class="rounded-lg p-2.5 text-xs"
                              :class="ver.isDeleteMarker ? 'bg-red-500/5 border border-red-500/20' : (ver.isLatest ? 'bg-vault-accent/5 border border-vault-accent/20' : 'bg-vault-border/20 border border-vault-border/30')">
                              <div class="flex items-center justify-between mb-1">
                                <div class="flex items-center gap-1.5">
                                  <span class="font-mono text-vault-text" :title="ver.versionId" x-text="truncateVersionId(ver.versionId)"></span>
                                  <span x-show="ver.isLatest" class="text-[9px] px-1 py-0.5 rounded bg-vault-accent/20 text-vault-accent font-medium uppercase">Latest</span>
                                  <span x-show="ver.isDeleteMarker" class="text-[9px] px-1 py-0.5 rounded bg-red-500/20 text-red-400 font-medium uppercase">Delete Marker</span>
                                </div>
                                <div class="flex items-center gap-0.5">
                                  <button x-show="!ver.isDeleteMarker" @click="downloadVersion(ver.key, ver.versionId)"
                                    class="p-1 rounded hover:bg-vault-accent/10 text-vault-muted hover:text-vault-accent transition" title="Download this version">
                                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                                  </button>
                                  <button @click="confirmDeleteVersion(ver.key, ver.versionId, ver.isDeleteMarker, ver.isLatest)"
                                    class="p-1 rounded hover:bg-red-500/10 text-vault-muted hover:text-red-400 transition" title="Permanently delete this version">
                                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
                                  </button>
                                </div>
                              </div>
                              <div class="flex items-center gap-3 text-vault-muted">
                                <span x-text="new Date(ver.lastModified).toLocaleString()"></span>
                                <span x-show="!ver.isDeleteMarker" x-text="formatBytes(ver.size)"></span>
                              </div>
                            </div>
                          </template>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>

            <!-- Delete object modal -->
            <div x-show="showDeleteObjModal" x-transition.opacity class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="showDeleteObjModal = false">
              <div class="glass rounded-xl p-6 w-full max-w-sm mx-4" @click.stop>
                <h3 class="text-lg font-semibold mb-2" x-text="deleteIsDir ? 'Delete Folder' : 'Delete Object'"></h3>
                <p class="text-sm text-vault-muted mb-1">Are you sure you want to delete:</p>
                <p class="text-sm font-mono text-vault-text mb-3 break-all" x-text="deleteObjKey"></p>
                <template x-if="deleteIsDir">
                  <div class="mb-3">
                    <label class="flex items-center gap-2 cursor-pointer">
                      <input type="checkbox" x-model="deleteRecursive"
                        class="w-4 h-4 rounded border-vault-border bg-vault-bg text-red-500 focus:ring-red-500/30 focus:ring-offset-0">
                      <span class="text-sm text-vault-muted">Delete all contents recursively</span>
                    </label>
                    <p x-show="!deleteRecursive" class="text-[10px] text-vault-muted/60 mt-1 ml-6">Only the empty folder marker will be deleted.</p>
                    <p x-show="deleteRecursive" class="text-[10px] text-red-400/80 mt-1 ml-6">All objects under this folder will be permanently deleted.</p>
                  </div>
                </template>
                <p x-show="deleteError" x-text="deleteError" class="text-red-400 text-xs mb-3"></p>
                <p x-show="deleteProgress" x-text="deleteProgress" class="text-vault-muted text-xs mb-3"></p>
                <div class="flex gap-3 justify-end">
                  <button @click="showDeleteObjModal = false" class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Cancel</button>
                  <button @click="deleteObject()" :disabled="deleting" class="px-4 py-2 rounded-lg bg-red-500/20 text-red-400 border border-red-500/30 text-sm font-medium hover:bg-red-500/30 transition disabled:opacity-50" x-text="deleting ? 'Deleting...' : 'Delete'"></button>
                </div>
              </div>
            </div>

            <!-- Batch delete confirm modal -->
            <div x-show="showDeleteBatchModal" x-transition.opacity class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="showDeleteBatchModal = false">
              <div class="glass rounded-xl p-6 w-full max-w-sm mx-4" @click.stop>
                <h3 class="text-lg font-semibold mb-2">Delete Selected Items</h3>
                <p class="text-sm text-vault-muted mb-3">Are you sure you want to delete
                  <span class="text-vault-text font-medium" x-text="deleteBatchFileCount + deleteBatchDirCount"></span> selected item<span x-show="deleteBatchFileCount + deleteBatchDirCount > 1">s</span>?
                </p>
                <template x-if="deleteBatchFileCount + deleteBatchDirCount > 1">
                  <div class="mb-3 p-2.5 rounded-lg bg-amber-500/10 border border-amber-500/20">
                    <p class="text-xs text-amber-400 flex items-start gap-1.5">
                      <svg class="w-4 h-4 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
                      <span>You are about to delete <strong x-text="deleteBatchFileCount + deleteBatchDirCount"></strong> items. This action cannot be undone.</span>
                    </p>
                  </div>
                </template>
                <template x-if="deleteBatchDirCount > 0">
                  <div class="mb-3 p-2.5 rounded-lg bg-red-500/10 border border-red-500/20">
                    <p class="text-xs text-red-400 flex items-start gap-1.5">
