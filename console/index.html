                   loading (its own `loading` flag — resolved via scope walk-up because this
                   card deliberately renames its own loading flag to `rulesLoading`) we hold
                   the child flag at null so the amber banner stays hidden. -->
              <div class="glass rounded-xl p-5" x-data="bucketReplicationEditor"
                   x-init="load(bucketName)"
                   x-effect="versioningEnabled = loading ? null : (versioningStatus === 'Enabled')">
                <div class="flex items-center justify-between mb-3">
                  <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-vault-accent" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5"/></svg>
                    <span class="text-sm font-semibold uppercase tracking-wider text-vault-text">Replication</span>
                    <span x-data="helpTrigger('replication')" class="help-host">
                      <button class="help-trigger" @click="show()" aria-label="About replication">?</button>
                      <span class="help-tooltip" x-text="topic.hint"></span>
                    </span>
                    <svg x-show="saving" class="animate-spin h-3.5 w-3.5 text-vault-accent ml-1" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                  </div>
                  <button @click="openAddModal()" :disabled="saving || versioningEnabled === false"
                    class="px-2.5 py-1 rounded-lg bg-vault-accent/10 text-vault-accent border border-vault-accent/30 text-xs font-medium hover:bg-vault-accent/20 transition disabled:opacity-40">
                    + Add Rule
                  </button>
                </div>

                <p class="text-xs text-vault-muted mb-3">Asynchronously copy new objects, delete markers and tag changes to a bucket on any S3-compatible endpoint. Delivery retries with exponential backoff; mirror setups between two Arcas are loop-safe.</p>

                <!-- Versioning-required banner -->
                <template x-if="versioningEnabled === false">
                  <div class="flex items-start gap-2 mb-3 rounded-lg border border-amber-500/30 bg-amber-500/5 px-3 py-2">
                    <svg class="w-4 h-4 text-amber-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/></svg>
                    <div class="flex-1 text-xs">
                      <div class="text-amber-400 font-medium">Versioning required</div>
                      <div class="text-vault-muted mt-0.5">Replication operates on object versions. <button @click="scrollToVersioning()" class="text-amber-400 underline hover:text-amber-300">Enable versioning</button> on this bucket before adding rules.</div>
                    </div>
                  </div>
                </template>

                <template x-if="rulesLoading">
                  <div class="flex justify-center py-4">
                    <svg class="animate-spin h-5 w-5 text-vault-accent" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                  </div>
                </template>

                <template x-if="!rulesLoading && rules.length === 0 && !showModal">
                  <p class="text-xs text-vault-muted py-2">No replication rules configured. Objects will not be replicated.</p>
                </template>

                <!-- Rules list -->
                <template x-for="(r, index) in rules" :key="r.id">
                  <div class="py-2.5 border-b border-vault-border/30 last:border-0">
                    <div class="flex items-center gap-3">
                      <div class="flex-1 min-w-0 cursor-pointer group" @click="openEditModal(index)">
                        <div class="flex items-center gap-2 flex-wrap">
                          <span class="text-sm font-medium text-vault-text truncate group-hover:text-vault-accent transition" x-text="r.id"></span>
                          <!-- source ➜ destination flow -->
                          <span class="flex items-center gap-1.5 text-[11px] text-vault-muted font-mono">
                            <span x-text="bucketName" class="truncate max-w-[120px]"></span>
                            <svg class="w-3 h-3 text-vault-accent/60 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg>
                            <span class="text-vault-text/80 truncate max-w-[200px]" x-text="shortDestination(r)"></span>
                          </span>
                          <button @click.stop="toggleEnabled(index, bucketName)" :disabled="saving"
                            class="text-[10px] px-1.5 py-0.5 rounded-full font-medium cursor-pointer transition"
                            :class="statusChipClass(r.status)"
                            x-text="r.status"></button>
                          <svg class="w-3 h-3 text-vault-muted opacity-0 group-hover:opacity-100 transition" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Z"/></svg>
                        </div>
                        <div class="text-[11px] text-vault-muted mt-0.5 flex flex-wrap gap-x-3 gap-y-1">
                          <span x-show="r.prefix" class="inline-flex items-center gap-0.5"><span class="text-vault-muted/60">prefix:</span> <span class="font-mono" x-text="r.prefix"></span></span>
                          <template x-for="t in (r.tags || [])" :key="t.key">
                            <span class="inline-flex items-center gap-0.5 font-mono px-1.5 py-0 rounded bg-vault-accent/10 text-vault-accent/90 border border-vault-accent/20">
                              <span x-text="t.key"></span><span class="text-vault-accent/50">=</span><span x-text="t.value"></span>
                            </span>
                          </template>
                          <span class="inline-flex items-center gap-0.5"><span class="text-vault-muted/60">priority:</span> <span x-text="r.priority"></span></span>
                          <span class="inline-flex items-center gap-0.5"><span class="text-vault-muted/60">creds:</span> <span class="font-mono" x-text="r.credentialRef"></span></span>
                          <span class="inline-flex items-center gap-0.5" :class="r.deleteMarkers ? '' : 'text-vault-muted/50 line-through'">
                            <span class="text-vault-muted/60">delete markers:</span>
                            <span x-text="r.deleteMarkers ? 'replicated' : 'ignored'"></span>
                          </span>
                        </div>
                      </div>
                      <button @click="removeRule(index, bucketName)" :disabled="saving" class="text-vault-muted hover:text-red-400 transition p-1 flex-shrink-0" title="Remove rule">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
                      </button>
                    </div>
                  </div>
                </template>

                <template x-if="rules.length > 0">
                  <div class="flex justify-end mt-3">
                    <button @click="deleteAllRules(bucketName)" :disabled="saving"
                      class="text-[11px] text-red-400/70 hover:text-red-400 transition">
                      Delete all rules
                    </button>
                  </div>
                </template>

                <p x-show="error" x-text="error" class="text-red-400 text-xs mt-2"></p>

                <!-- Rule editor modal -->
                <template x-teleport="body">
                  <div x-show="showModal" x-transition.opacity class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="closeModal()" @keydown.escape.window="closeModal()">
                    <div class="glass rounded-xl p-6 w-full max-w-xl mx-4 max-h-[85vh] overflow-y-auto" @click.stop>
                      <h3 class="text-lg font-semibold mb-4" x-text="modalMode === 'add' ? 'Add Replication Rule' : 'Edit Replication Rule'"></h3>

                      <div class="space-y-3">
                        <div class="grid grid-cols-[1fr_100px] gap-2">
                          <div>
                            <label class="text-[10px] uppercase tracking-wider text-vault-muted font-medium">Rule ID</label>
                            <input type="text" x-model="editForm.id" placeholder="rule-a1b2c3" autocomplete="off"
                              class="w-full px-2.5 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 text-xs">
                          </div>
                          <div>
                            <label class="text-[10px] uppercase tracking-wider text-vault-muted font-medium">Priority</label>
                            <input type="number" min="1" x-model.number="editForm.priority"
                              class="w-full px-2.5 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text focus:outline-none focus:border-vault-accent/50 text-xs">
                          </div>
                        </div>

                        <div>
                          <label class="text-[10px] uppercase tracking-wider text-vault-muted font-medium">Prefix <span class="normal-case text-vault-muted/50">(optional — replicate only objects under this prefix)</span></label>
                          <input type="text" x-model="editForm.prefix" placeholder="e.g. logs/" autocomplete="off"
                            class="w-full px-2.5 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 text-xs font-mono">
                        </div>

                        <div>
                          <div class="flex items-center justify-between mb-1">
                            <label class="text-[10px] uppercase tracking-wider text-vault-muted font-medium">Tag filter <span class="normal-case text-vault-muted/50">(optional — replicate only objects with ALL these tags)</span></label>
                            <button type="button" @click="addTagRow()"
                              class="text-[11px] px-2 py-0.5 rounded-md bg-vault-accent/10 text-vault-accent border border-vault-accent/30 hover:bg-vault-accent/20 transition">
                              + Tag
                            </button>
                          </div>
                          <template x-if="editForm.tags.length === 0">
                            <p class="text-[10px] text-vault-muted/60 italic">No tag filter — the rule applies to every object whose key matches the prefix.</p>
                          </template>
                          <template x-for="(t, ti) in editForm.tags" :key="ti">
                            <div class="grid grid-cols-[1fr_1fr_auto] gap-2 mb-1.5 items-center">
                              <input type="text" x-model="t.key" placeholder="key (e.g. env)" autocomplete="off"
                                class="px-2.5 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 text-xs font-mono">
                              <input type="text" x-model="t.value" placeholder="value (e.g. prod)" autocomplete="off"
                                class="px-2.5 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 text-xs font-mono">
                              <button type="button" @click="removeTagRow(ti)" class="text-vault-muted hover:text-red-400 transition p-1" title="Remove tag">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
                              </button>
                            </div>
                          </template>
                        </div>

                        <div class="pt-2 border-t border-vault-border/30">
                          <div class="text-[10px] uppercase tracking-wider text-vault-muted/80 font-medium mb-2">Destination</div>
                          <div class="grid grid-cols-1 md:grid-cols-[1fr_130px] gap-2">
                            <div>
                              <label class="text-[10px] uppercase tracking-wider text-vault-muted font-medium">Bucket</label>
                              <input type="text" x-model="editForm.destBucket" placeholder="destination-bucket" autocomplete="off"
                                class="w-full px-2.5 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 text-xs font-mono">
                            </div>
                            <div>
                              <label class="text-[10px] uppercase tracking-wider text-vault-muted font-medium">Region</label>
                              <input type="text" x-model="editForm.destRegion" placeholder="us-east-1" autocomplete="off"
                                class="w-full px-2.5 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 text-xs font-mono">
                            </div>
                          </div>
                          <div class="mt-2">
                            <label class="text-[10px] uppercase tracking-wider text-vault-muted font-medium">Endpoint URL</label>
                            <input type="url" x-model="editForm.destEndpoint" placeholder="https://replica.example.com" autocomplete="off"
                              class="w-full px-2.5 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 text-xs font-mono">
                          </div>
                        </div>

                        <div class="pt-2 border-t border-vault-border/30">
                          <div class="flex items-center gap-2 mb-2">
                            <div class="text-[10px] uppercase tracking-wider text-vault-muted/80 font-medium">Destination credentials</div>
                            <span class="text-[10px] text-vault-muted/50">stored in server settings</span>
                          </div>

                          <template x-if="!editForm.newCredentialMode">
                            <div class="flex items-center gap-2">
                              <select x-model="editForm.credentialRef"
                                class="flex-1 px-2.5 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text focus:outline-none focus:border-vault-accent/50 text-xs font-mono">
                                <option value="">(select a credential)</option>
                                <template x-for="ref in knownCredentialRefs" :key="ref">
                                  <option :value="ref" x-text="ref"></option>
                                </template>
                              </select>
                              <button type="button" @click="startNewCredential()"
                                class="px-2.5 py-1.5 rounded-lg text-[11px] font-medium bg-vault-accent/10 text-vault-accent border border-vault-accent/30 hover:bg-vault-accent/20 transition">
                                + New
                              </button>
                            </div>
                          </template>

                          <template x-if="editForm.newCredentialMode">
                            <div class="space-y-2">
                              <div class="flex items-center gap-2">
                                <input type="text" x-model="editForm.credentialRef" placeholder="credential name (e.g. replica-creds)" autocomplete="off"
                                  class="flex-1 px-2.5 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 text-xs font-mono">
                                <button type="button" @click="editForm.newCredentialMode = false; editForm.credentialRef = knownCredentialRefs.length === 1 ? knownCredentialRefs[0] : ''"
                                  class="px-2.5 py-1.5 rounded-lg text-[11px] font-medium text-vault-muted border border-vault-border hover:text-vault-text transition">
                                  Use existing
                                </button>
                              </div>
                              <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                                <div>
                                  <label class="text-[10px] uppercase tracking-wider text-vault-muted font-medium">Access key ID</label>
                                  <input type="text" x-model="editForm.newAccessKey" placeholder="AKIA..." autocomplete="off"
                                    class="w-full px-2.5 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 text-xs font-mono">
                                </div>
                                <div>
                                  <label class="text-[10px] uppercase tracking-wider text-vault-muted font-medium">Secret key</label>
                                  <input x-password-toggle type="password" x-model="editForm.newSecretKey" placeholder="secret (never colon-separated)" autocomplete="new-password"
                                    class="w-full px-2.5 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 text-xs font-mono">
                                </div>
                              </div>
                            </div>
                          </template>
                        </div>

                        <!-- Connection test — signed HEAD on the destination bucket -->
                        <div class="pt-2 border-t border-vault-border/30">
                          <div class="flex items-center justify-between gap-2 mb-1.5">
                            <div>
                              <div class="text-[10px] uppercase tracking-wider text-vault-muted/80 font-medium">Connection test</div>
                              <div class="text-[10px] text-vault-muted/50 mt-0.5">Signed HEAD on the destination bucket — no data is written.</div>
                            </div>
                            <button type="button" @click="testDestination()" :disabled="testing"
                              class="px-3 py-1.5 rounded-lg text-[11px] font-medium bg-vault-accent/10 text-vault-accent border border-vault-accent/30 hover:bg-vault-accent/20 transition disabled:opacity-40 flex items-center gap-1.5 flex-shrink-0">
                              <svg x-show="!testing" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9.348 14.651a3.75 3.75 0 0 1 0-5.303m5.304 0a3.75 3.75 0 0 1 0 5.303m-7.425 2.122a6.75 6.75 0 0 1 0-9.547m9.546 0a6.75 6.75 0 0 1 0 9.547M5.106 18.894c-3.808-3.808-3.808-9.98 0-13.789m13.788 0c3.808 3.808 3.808 9.98 0 13.789M12 12h.008v.008H12V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/></svg>
                              <svg x-show="testing" class="animate-spin w-3.5 h-3.5" viewBox="0 0 24 24" aria-hidden="true"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                              <span x-text="testing ? 'Testing…' : 'Test'"></span>
                            </button>
                          </div>
                          <template x-if="testResult">
                            <div class="mt-2 rounded-lg border px-2.5 py-2 text-[11px]"
                                 :class="testResult.success
                                   ? 'border-emerald-500/30 bg-emerald-500/5 text-emerald-400'
                                   : 'border-red-500/30 bg-red-500/5 text-red-400'">
                              <div class="flex items-start gap-1.5">
                                <svg x-show="testResult.success" class="w-3.5 h-3.5 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
                                <svg x-show="!testResult.success" class="w-3.5 h-3.5 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
                                <div class="flex-1 min-w-0">
                                  <div x-text="testResult.message" class="font-medium"></div>
                                  <!-- Destination identity, captured from the Server header on the test HEAD response. -->
                                  <div x-show="testResult.server" class="text-[10px] opacity-70 mt-0.5 font-mono">
                                    Server: <span x-text="testResult.server"></span>
                                  </div>
                                  <!-- Loop-prevention note only when the destination actually is Arca
                                       (Server header starts with "Arca"). -->
                                  <div x-show="testResult.isArca" class="text-[10px] opacity-80 mt-0.5 flex items-center gap-1">
                                    <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5"/></svg>
                                    Arca destination — loop prevention applies automatically.
                                  </div>
                                  <div x-show="testResult.detail" x-text="testResult.detail" class="text-[10px] opacity-70 mt-0.5 break-all font-mono"></div>
                                </div>
                              </div>
                            </div>
                          </template>
                        </div>

                        <div class="pt-2 border-t border-vault-border/30 flex items-start gap-2">
                          <input type="checkbox" id="dmr-toggle" x-model="editForm.deleteMarkers"
                            class="mt-0.5 accent-vault-accent w-3.5 h-3.5">
                          <label for="dmr-toggle" class="text-xs text-vault-text">
                            Replicate delete markers
                            <span class="block text-[10px] text-vault-muted/70 mt-0.5">When enabled, DeleteObject on the source creates a delete marker on the destination too. Hard deletes of specific versions are never replicated either way.</span>
                          </label>
                        </div>
                      </div>

                      <p x-show="error" x-text="error" class="text-red-400 text-xs mt-3"></p>

                      <div class="flex gap-2 justify-end mt-5 pt-4 border-t border-vault-border/30">
                        <button @click="closeModal()" class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Cancel</button>
                        <button @click="saveFromModal(bucketName)" :disabled="saving"
                          class="px-4 py-2 rounded-lg bg-vault-accent text-vault-bg text-sm font-medium hover:opacity-90 transition disabled:opacity-50"
                          x-text="modalMode === 'add' ? 'Add rule' : 'Save'"></button>
                      </div>
                    </div>
                  </div>
                </template>
              </div>

              <!-- Danger zone -->
              <div class="glass rounded-xl p-5 border-red-500/30" style="border-color: rgba(239, 68, 68, 0.3);">
                <div class="flex items-center gap-2 mb-4">
                  <svg class="w-4 h-4 text-red-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/></svg>
                  <span class="text-sm font-semibold uppercase tracking-wider text-red-400">Danger Zone</span>
                </div>
                <div class="flex items-center justify-between">
                  <div>
                    <div class="text-sm font-medium text-vault-text">Delete this bucket</div>
                    <div class="text-xs text-vault-muted mt-0.5">Once deleted, this bucket and its configuration cannot be recovered.</div>
                  </div>
                  <button @click="showDeleteModal = true"
                    class="px-3.5 py-1.5 rounded-lg bg-red-500/10 text-red-400 border border-red-500/30 text-sm font-medium hover:bg-red-500/20 transition whitespace-nowrap">
                    Delete Bucket
                  </button>
                </div>
              </div>
            </div>

            <!-- Delete confirm modal (type to confirm) -->
            <div x-show="showDeleteModal" x-transition.opacity x-effect="if (showDeleteModal) { deleteBucketConfirmName = ''; deleteError = ''; $nextTick(() => $refs.deleteConfirmInput?.focus()); }" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="showDeleteModal = false">
              <div class="glass rounded-xl p-6 w-full max-w-sm mx-4" @click.stop>
                <h3 class="text-lg font-semibold mb-2">Delete Bucket</h3>
                <p class="text-sm text-vault-muted mb-3">This action cannot be undone. Type <span class="text-vault-text font-mono" x-text="bucketName"></span> to confirm.</p>
                <form @submit.prevent="deleteBucket()">
                  <input type="text" x-model="deleteBucketConfirmName" x-ref="deleteConfirmInput"
                    placeholder="Type bucket name to confirm"
                    class="w-full px-3.5 py-2.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-red-500/50 focus:ring-1 focus:ring-red-500/30 transition text-sm font-mono mb-4">
                  <div class="flex gap-3 justify-end">
                    <button type="button" @click="showDeleteModal = false" class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Cancel</button>
                    <button type="submit" :disabled="deleteBucketConfirmName !== bucketName || deleting"
                      class="px-4 py-2 rounded-lg bg-red-500/20 text-red-400 border border-red-500/30 text-sm font-medium hover:bg-red-500/30 transition disabled:opacity-50"
                      x-text="deleting ? 'Deleting...' : 'Delete'"></button>
                  </div>
                  <p x-show="deleteError" x-text="deleteError" class="text-red-400 text-xs mt-2"></p>
                </form>
              </div>
            </div>

            <!-- Enable Versioning confirmation (irreversible first-time enable) -->
            <div x-show="showEnableVersioningModal" x-cloak x-transition.opacity x-effect="if (showEnableVersioningModal) $nextTick(() => $refs.enableVersioningInput?.focus())" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="showEnableVersioningModal = false">
              <div class="glass rounded-xl p-6 w-full max-w-md mx-4" @click.stop>
                <h3 class="text-lg font-semibold mb-2 text-amber-400">Enable Versioning</h3>
                <p class="text-sm text-vault-muted mb-2">Versioning on <span class="text-vault-text font-mono" x-text="bucketName"></span> <span class="text-amber-400">cannot be turned off once enabled</span>, only suspended. Every subsequent overwrite or delete will create a new version, growing storage usage until lifecycle rules prune old ones.</p>
                <p class="text-sm text-vault-muted mb-3">Type <span class="text-vault-text font-mono" x-text="bucketName"></span> to confirm.</p>
                <form @submit.prevent="if (enableVersioningConfirmName === bucketName) confirmEnableVersioning()">
                  <input type="text" x-model="enableVersioningConfirmName" x-ref="enableVersioningInput"
                    placeholder="Type bucket name to confirm"
                    class="w-full px-3.5 py-2.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/30 transition text-sm font-mono mb-4">
                  <div class="flex gap-3 justify-end">
                    <button type="button" @click="showEnableVersioningModal = false" class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Cancel</button>
                    <button type="submit" :disabled="enableVersioningConfirmName !== bucketName || versioningSaving"
                      class="px-4 py-2 rounded-lg bg-amber-500/20 text-amber-400 border border-amber-500/30 text-sm font-medium hover:bg-amber-500/30 transition disabled:opacity-50">Enable</button>
                  </div>
                </form>
              </div>
            </div>

            <!-- Enable Object Lock confirmation (irreversible) -->
            <div x-show="showEnableObjectLockModal" x-cloak x-transition.opacity x-effect="if (showEnableObjectLockModal) $nextTick(() => $refs.enableObjectLockInput?.focus())" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="showEnableObjectLockModal = false">
              <div class="glass rounded-xl p-6 w-full max-w-md mx-4" @click.stop>
                <h3 class="text-lg font-semibold mb-2 text-amber-400">Enable Object Lock (WORM)</h3>
                <p class="text-sm text-vault-muted mb-2">Object Lock on <span class="text-vault-text font-mono" x-text="bucketName"></span> <span class="text-amber-400">cannot be disabled</span> afterwards. Versioning will be enabled automatically and cannot be suspended while Object Lock is active. Objects within retention cannot be deleted or overwritten, even by administrators under COMPLIANCE mode.</p>
                <template x-if="pendingLockMode">
                  <p class="text-xs text-vault-muted mb-2">Default retention: <span class="text-vault-text font-mono" x-text="pendingLockMode"></span> <span x-show="pendingLockDays">for <span class="text-vault-text" x-text="pendingLockDays"></span> days</span></p>
                </template>
                <p class="text-sm text-vault-muted mb-3">Type <span class="text-vault-text font-mono" x-text="bucketName"></span> to confirm.</p>
                <form @submit.prevent="if (enableObjectLockConfirmName === bucketName) confirmEnableObjectLock()">
                  <input type="text" x-model="enableObjectLockConfirmName" x-ref="enableObjectLockInput"
                    placeholder="Type bucket name to confirm"
                    class="w-full px-3.5 py-2.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/30 transition text-sm font-mono mb-4">
                  <div class="flex gap-3 justify-end">
                    <button type="button" @click="showEnableObjectLockModal = false" class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Cancel</button>
                    <button type="submit" :disabled="enableObjectLockConfirmName !== bucketName || objectLockSaving"
                      class="px-4 py-2 rounded-lg bg-amber-500/20 text-amber-400 border border-amber-500/30 text-sm font-medium hover:bg-amber-500/30 transition disabled:opacity-50">Enable Object Lock</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </template>

        <!-- ==================== BUCKET DETAIL (Object Browser) ==================== -->
        <template x-if="view === 'bucket-detail'">
          <div class="p-6 max-w-6xl overflow-hidden" x-data="bucketDetailView" x-init="load(); $watch('searchQuery', () => { if (showTreemap) computeTreemap(); })">
            <!-- Header with breadcrumbs -->
            <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between mb-6">
              <div data-breadcrumbs class="flex items-center gap-2 text-sm min-w-0 overflow-x-auto whitespace-nowrap scrollbar-hide">
                <a href="#/buckets" @click="$store.app && navigate('buckets')" class="text-vault-muted hover:text-vault-accent transition flex-shrink-0">Buckets</a>
                <span class="text-vault-border">/</span>
                <span x-show="bucketEncrypted" x-cloak title="Encrypted bucket" x-html="icons.encryptionShield"></span>
                <span x-show="bucketVersioned" x-cloak :title="'Versioning: ' + bucketVersioned" x-html="bucketVersioned === 'Suspended' ? icons.versioningSuspended : icons.versioningClock"></span>
                <span x-show="bucketLocked" x-cloak title="Object Lock (WORM)" x-html="icons.objectLock"></span>
                <span x-show="bucketCompressed" x-cloak :title="'Compressed: ' + bucketCompressed" x-html="icons.compression"></span>
                <button @click="navigatePrefix('')" class="text-vault-accent hover:underline font-medium" x-text="bucketName"></button>
                <template x-for="(part, i) in prefixParts" :key="i">
                  <span class="flex items-center gap-2">
                    <span class="text-vault-border">/</span>
                    <button @click="navigatePrefix(prefixUpTo(i))" class="text-vault-accent hover:underline" x-text="part"></button>
                  </span>
                </template>
              </div>
              <div class="flex items-center gap-2 flex-shrink-0 flex-wrap">
                <!-- Show deleted toggle (versioned buckets only) -->
                <div x-show="bucketVersioned" x-cloak class="flex items-center gap-1.5 mr-1">
                  <span class="text-[11px] text-vault-muted hidden md:inline">Show deleted</span>
                  <button @click="toggleShowDeleted()"
                    :class="showDeleted ? 'bg-red-500' : 'bg-vault-border'"
                    class="relative inline-flex h-5 w-9 items-center rounded-full transition-colors"
                    title="Show deleted objects">
                    <span :class="showDeleted ? 'translate-x-5' : 'translate-x-0.5'"
                      class="inline-block h-3.5 w-3.5 rounded-full bg-white transition-transform"></span>
                  </button>
                </div>
                <a :href="'#/buckets/' + encodeURIComponent(bucketName) + '/settings'"
                  class="p-2 rounded-lg border border-vault-border/50 hover:border-vault-accent/30 text-vault-muted hover:text-vault-accent transition" title="Bucket settings">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                </a>
                <button @click="showTreemap = !showTreemap; if (showTreemap) computeTreemap()"
                  :class="showTreemap ? 'bg-vault-accent/20 text-vault-accent' : 'text-vault-muted'"
                  class="p-2 rounded-lg border border-vault-border/50 hover:border-vault-accent/30 transition" title="Treemap view">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
                </button>
                <button @click="showCreateFolderModal = true"
                  class="p-2 md:px-3.5 md:py-1.5 rounded-lg bg-vault-indigo/10 text-vault-indigo border border-vault-indigo/20 text-sm font-medium hover:bg-vault-indigo/20 transition" title="New folder">
                  <svg class="w-4 h-4 md:hidden" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10.5v6m3-3H9m4.06-7.19-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z"/></svg>
                  <span class="hidden md:inline">+ Folder</span>
                </button>
                <label class="p-2 md:px-3.5 md:py-1.5 rounded-lg bg-vault-accent/10 text-vault-accent border border-vault-accent/20 text-sm font-medium hover:bg-vault-accent/20 transition cursor-pointer" title="Upload files">
                  <svg class="w-4 h-4 md:hidden" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5"/></svg>
                  <span class="hidden md:inline">Upload Files</span>
                  <input type="file" multiple class="hidden" @change="uploadFiles($event.target.files); $event.target.value = ''">
                </label>
                <label class="p-2 md:px-3.5 md:py-1.5 rounded-lg bg-vault-accent/10 text-vault-accent border border-vault-accent/20 text-sm font-medium hover:bg-vault-accent/20 transition cursor-pointer" title="Upload folder">
                  <svg class="w-4 h-4 md:hidden" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 8.25H7.5a2.25 2.25 0 0 0-2.25 2.25v9a2.25 2.25 0 0 0 2.25 2.25h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25H15m0-3-3-3m0 0-3 3m3-3V15"/></svg>
                  <span class="hidden md:inline">Upload Folder</span>
                  <input type="file" webkitdirectory class="hidden" @change="uploadFiles($event.target.files); $event.target.value = ''">
                </label>
              </div>
            </div>

            <!-- Selection action bar -->
            <div x-show="selectedKeys.size > 0" x-transition
              class="glass rounded-xl px-4 py-2.5 mb-3 flex flex-wrap items-center justify-between gap-2">
              <span class="text-sm text-vault-muted">
                <span class="text-vault-accent font-semibold" x-text="selectedKeys.size"></span> selected
              </span>
              <div class="flex items-center gap-2">
                <button @click="downloadSelected()" :disabled="archiving"
                  class="px-3 py-1.5 rounded-lg bg-vault-accent/10 text-vault-accent border border-vault-accent/20 text-sm font-medium hover:bg-vault-accent/20 transition disabled:opacity-50 flex items-center gap-1.5">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                  <span x-text="archiving ? 'Archiving...' : 'Download .tar.gz'"></span>
                </button>
                <button @click="confirmDeleteSelected()" :disabled="deleting"
                  class="px-3 py-1.5 rounded-lg bg-red-500/10 text-red-400 border border-red-500/20 text-sm font-medium hover:bg-red-500/20 transition disabled:opacity-50 flex items-center gap-1.5">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
                  Delete
                </button>
                <button @click="selectedKeys = new Set()" class="p-1.5 rounded-lg text-vault-muted hover:text-vault-text transition" title="Clear selection">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
            </div>

            <!-- Search bar -->
            <div x-show="!loading && (directories.length > 0 || objects.length > 0)" class="relative mb-4">
              <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-vault-muted pointer-events-none" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
              </svg>
              <input type="text" x-model.debounce.300ms="searchQuery" placeholder="Search files and folders..."
                class="w-full bg-transparent border-b border-vault-border/50 hover:border-vault-border focus:border-vault-accent text-sm text-vault-text placeholder-vault-muted/50 focus:outline-none pl-9 pr-8 py-2 transition">
              <button x-show="searchQuery" @click="searchQuery = ''"
                class="absolute right-2 top-1/2 -translate-y-1/2 p-0.5 rounded text-vault-muted hover:text-vault-text transition">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
                </svg>
              </button>
            </div>

            <!-- Drop zone -->
            <div x-show="!showTreemap"
              @dragover.prevent="dragActive = true"
              @dragleave.prevent="dragActive = false"
              @drop.prevent="dragActive = false; handleDrop($event)"
              :class="dragActive ? 'drop-active' : ''"
              class="border-2 border-dashed border-vault-border/50 rounded-xl mb-4 transition"
              :style="dragActive ? '' : 'border-color: transparent'">

              <!-- Upload progress -->
              <div x-show="uploading" class="px-5 py-3">
                <div class="flex items-center justify-between text-sm mb-2">
                  <span class="text-vault-muted">Uploading <span x-text="uploadFileName"></span></span>
                  <span class="text-vault-accent font-mono" x-text="uploadProgress + '%'"></span>
                </div>
                <div class="w-full h-1.5 rounded-full bg-vault-border/30 overflow-hidden">
                  <div class="h-full bg-gradient-to-r from-vault-accent to-vault-indigo rounded-full transition-all duration-300" :style="'width:' + uploadProgress + '%'"></div>
                </div>
              </div>

              <!-- Object list header (select all) -->
              <div x-show="!loading && (filteredDirectories.length > 0 || filteredObjects.length > 0)"
                class="flex items-center gap-3 px-5 py-2 border-b border-vault-border/30">
                <input type="checkbox" @click.stop
                  :checked="allSelected" @change="toggleSelectAll()"
                  class="w-3.5 h-3.5 rounded border-vault-border bg-vault-bg text-vault-accent focus:ring-vault-accent/30 focus:ring-offset-0 cursor-pointer">
                <span class="text-[10px] uppercase tracking-wider text-vault-muted/60">Select all</span>
              </div>

              <!-- Object list -->
              <div x-show="!loading">
                <!-- Directories -->
                <template x-for="dir in filteredDirectories" :key="dir">
                  <div class="flex items-center gap-3 px-5 py-3 hover:bg-white/[0.02] cursor-pointer transition border-b border-vault-border/20 group"
                    :class="selectedKeys.has('dir:' + dir) ? 'bg-vault-accent/5' : ''">
                    <input type="checkbox" @click.stop
                      :checked="selectedKeys.has('dir:' + dir)" @change="toggleSelect('dir:' + dir)"
                      class="w-3.5 h-3.5 rounded border-vault-border bg-vault-bg text-vault-accent focus:ring-vault-accent/30 focus:ring-offset-0 cursor-pointer">
                    <div @click="navigatePrefix(dir)" class="flex items-center gap-3 flex-1 min-w-0">
                      <svg class="w-5 h-5 text-vault-accent/70 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"/></svg>
                      <span class="text-sm flex-1" x-text="dirName(dir)"></span>
                    </div>
                    <div class="flex items-center gap-1 md:opacity-0 md:group-hover:opacity-100 transition">
                      <button @click.stop="confirmDeleteDir(dir)" class="p-1 rounded hover:bg-red-500/10 text-vault-muted hover:text-red-400 transition" title="Delete folder">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
                      </button>
                    </div>
                  </div>
                </template>

                <!-- Deleted directories (shown when "Show deleted" is on) -->
                <template x-for="dir in filteredDeletedDirectories" :key="'deld:' + dir">
                  <div class="flex items-center gap-3 px-5 py-2.5 hover:bg-white/[0.02] cursor-pointer transition border-b border-vault-border/20 opacity-50"
                    @click="navigatePrefix(dir)">
                    <div class="w-3.5 h-3.5"></div>
                    <svg class="w-5 h-5 text-red-400/60 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"/></svg>
                    <span class="text-sm flex-1 line-through text-red-400/60" x-text="dirName(dir)"></span>
                    <span class="text-[9px] px-1.5 py-0.5 rounded bg-red-500/15 text-red-400 font-medium uppercase">Deleted</span>
                  </div>
                </template>

                <!-- Files -->
                <template x-for="obj in filteredObjects" :key="obj.key">
                  <div class="flex items-center gap-3 px-5 py-3 hover:bg-white/[0.02] cursor-pointer transition border-b border-vault-border/20 group"
                    :class="selectedKeys.has(obj.key) ? 'bg-vault-accent/5' : ''"
                    @click="selectObject(obj)">
                    <input type="checkbox" @click.stop
                      :checked="selectedKeys.has(obj.key)" @change="toggleSelect(obj.key)"
                      class="w-3.5 h-3.5 rounded border-vault-border bg-vault-bg text-vault-accent focus:ring-vault-accent/30 focus:ring-offset-0 cursor-pointer">
                    <svg class="w-5 h-5 text-vault-muted shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
                    <span class="text-sm flex-1 truncate" x-text="fileName(obj.key)"></span>
                    <span class="text-xs text-vault-muted font-mono" x-text="formatBytes(obj.size)"></span>
                    <span class="text-xs text-vault-muted hidden sm:inline" x-text="new Date(obj.lastModified).toLocaleDateString()"></span>
                    <!-- Always-visible blue share icon when active presigned URLs exist -->
                    <button x-show="hasActivePresignedUrl(obj.key)" @click.stop="openPresignedDetail(obj.key)"
                      class="p-1 rounded hover:bg-blue-500/10 text-blue-400 transition" title="Active shared link">
                      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 7.5 9.566 5.314m0 0a2.25 2.25 0 1 0 3.935 2.186 2.25 2.25 0 0 0-3.935-2.186Zm0-12.814a2.25 2.25 0 1 0 3.933-2.185 2.25 2.25 0 0 0-3.933 2.185Z"/></svg>
                    </button>
                    <!-- Hover-only actions -->
                    <div class="flex items-center gap-1 md:opacity-0 md:group-hover:opacity-100 transition">
                      <button x-show="!hasActivePresignedUrl(obj.key)" @click.stop="openShareModal(obj.key)" class="p-1 rounded hover:bg-vault-accent/10 text-vault-muted hover:text-vault-accent transition" title="Share">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 7.5 9.566 5.314m0 0a2.25 2.25 0 1 0 3.935 2.186 2.25 2.25 0 0 0-3.935-2.186Zm0-12.814a2.25 2.25 0 1 0 3.933-2.185 2.25 2.25 0 0 0-3.933 2.185Z"/></svg>
                      </button>
                      <button @click.stop="downloadObject(obj.key)" class="p-1 rounded hover:bg-vault-accent/10 text-vault-muted hover:text-vault-accent transition" title="Download">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                      </button>
                      <button @click.stop="confirmDeleteObject(obj.key)" class="p-1 rounded hover:bg-red-500/10 text-vault-muted hover:text-red-400 transition" title="Delete">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
                      </button>
                    </div>
                  </div>
                </template>

                <!-- Deleted objects (shown when "Show deleted" is on) -->
                <template x-for="obj in filteredDeletedObjects" :key="'del:' + obj.key">
                  <div class="flex items-center gap-3 px-5 py-3 hover:bg-white/[0.02] cursor-pointer transition border-b border-vault-border/20 group opacity-50"
                    @click="selectObject({key: obj.key, size: 0, lastModified: obj.lastModified, etag: '', _deleted: true})">
                    <div class="w-3.5 h-3.5"></div>
                    <svg class="w-5 h-5 text-red-400/60 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
                    <span class="text-sm flex-1 truncate line-through text-red-400/60" x-text="fileName(obj.key)"></span>
                    <span class="text-[9px] px-1.5 py-0.5 rounded bg-red-500/15 text-red-400 font-medium uppercase">Deleted</span>
                    <span class="text-xs text-vault-muted hidden sm:inline" x-text="new Date(obj.lastModified).toLocaleDateString()"></span>
                  </div>
                </template>
              </div>

              <!-- No search results -->
              <div x-show="!loading && (directories.length > 0 || objects.length > 0) && filteredDirectories.length === 0 && filteredObjects.length === 0" class="py-16 text-center">
                <svg class="w-10 h-10 mx-auto text-vault-border mb-3" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
                </svg>
                <p class="text-vault-muted text-sm">No results for "<span x-text="searchQuery" class="text-vault-text"></span>"</p>
              </div>

              <!-- Empty state -->
              <div x-show="!loading && directories.length === 0 && objects.length === 0" class="py-16 text-center">
                <svg class="w-12 h-12 mx-auto text-vault-border mb-4" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/></svg>
                <p class="text-vault-muted text-sm mb-1">This location is empty</p>
                <p class="text-vault-muted/60 text-xs">Drag and drop files or folders here, or click Upload</p>
              </div>

              <div x-show="loading" class="flex justify-center py-16">
                <svg class="animate-spin h-6 w-6 text-vault-accent" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
              </div>
            </div>

            <!-- Treemap -->
            <div x-show="showTreemap && objects.length > 0" class="glass rounded-xl p-4"
              x-html="renderTreemap()"></div>

            <!-- Object detail backdrop (mobile) -->
            <div x-show="selectedObject" @click="selectedObject = null" class="fixed inset-0 bg-black/40 z-30 md:hidden"></div>
            <!-- Object detail panel -->
            <div x-show="selectedObject" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
              class="fixed right-0 top-12 md:top-0 h-[calc(100%-3rem)] md:h-full w-full md:w-80 glass border-l border-vault-border/50 z-40 slide-panel overflow-y-auto">
              <div class="p-5">
                <div class="flex items-center justify-between mb-5">
                  <h3 class="text-sm font-semibold uppercase tracking-wider text-vault-muted">Object Detail</h3>
                  <button @click="selectedObject = null" class="p-1 rounded hover:bg-white/5 text-vault-muted hover:text-vault-text transition">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                  </button>
                </div>
                <template x-if="selectedObject">
                  <div class="space-y-4">
                    <div>
                      <div class="text-xs text-vault-muted mb-1">Key</div>
                      <div class="text-sm font-mono break-all" x-text="selectedObject.key"></div>
                    </div>
                    <div>
                      <div class="text-xs text-vault-muted mb-1">Size</div>
                      <div class="text-sm font-mono" x-text="formatBytes(selectedObject.size)"></div>
                    </div>
                    <div>
                      <div class="text-xs text-vault-muted mb-1">ETag</div>
                      <div class="text-sm font-mono break-all" x-text="selectedObject.etag"></div>
                    </div>
                    <div>
                      <div class="text-xs text-vault-muted mb-1">Last Modified</div>
                      <div class="text-sm" x-text="new Date(selectedObject.lastModified).toLocaleString()"></div>
                    </div>
                    <template x-if="selectedObject.encrypted">
                      <div>
                        <div class="text-xs text-vault-muted mb-1">Encryption</div>
                        <div class="flex items-center gap-1.5">
                          <svg class="w-3.5 h-3.5 text-green-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>
                          <span class="text-sm text-green-400 font-medium">Encrypted</span>
                        </div>
                      </div>
                    </template>
                    <div class="flex gap-2 pt-2">
                      <button @click="openShareModal(selectedObject.key)" class="flex-1 py-2 rounded-lg bg-vault-indigo/10 text-vault-indigo text-sm font-medium hover:bg-vault-indigo/20 transition">Share</button>
                      <button @click="downloadObject(selectedObject.key)" class="flex-1 py-2 rounded-lg bg-vault-accent/10 text-vault-accent text-sm font-medium hover:bg-vault-accent/20 transition">Download</button>
                      <button @click="confirmDeleteObject(selectedObject.key)" class="flex-1 py-2 rounded-lg bg-red-500/10 text-red-400 text-sm font-medium hover:bg-red-500/20 transition">Delete</button>
                    </div>

                    <!-- Object Preview -->
                    <div class="pt-2 border-t border-vault-border/30">
                      <div class="flex items-center justify-between py-2">
                        <button @click="togglePreview()" class="flex items-center gap-1.5 text-sm font-medium text-vault-muted hover:text-vault-text transition">
                          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
                          Preview
                        </button>
                        <div class="flex items-center gap-1">
                          <button x-show="previewType" @click="$data.showPreviewModal = true" class="p-1 rounded hover:bg-white/5 text-vault-muted hover:text-vault-text transition" title="Expand preview">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15"/></svg>
                          </button>
                          <button @click="togglePreview()" class="p-1 rounded hover:bg-white/5 text-vault-muted hover:text-vault-text transition">
                            <svg :class="previewExpanded ? 'rotate-180' : ''" class="w-4 h-4 transition-transform" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
                          </button>
                        </div>
                      </div>

                      <div x-show="previewExpanded" x-transition>
                        <!-- Loading -->
                        <div x-show="previewLoading" class="flex justify-center py-4">
                          <svg class="animate-spin h-4 w-4 text-vault-accent" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                        </div>

                        <!-- Error / unsupported -->
                        <p x-show="previewError" x-text="previewError" class="text-vault-muted/60 text-xs text-center py-4"></p>

                        <!-- Image preview -->
                        <template x-if="previewType === 'image'">
                          <div class="rounded-lg overflow-hidden bg-black/20">
                            <img :src="previewUrl" class="w-full h-auto max-h-96 object-contain" :alt="selectedObject.key">
                          </div>
                        </template>

                        <!-- Video preview -->
                        <template x-if="previewType === 'video'">
                          <div class="rounded-lg overflow-hidden bg-black/20">
                            <video :src="previewUrl" controls disablepictureinpicture controlslist="nodownload" x-webkit-airplay="deny" class="w-full max-h-96">Your browser does not support this video format.</video>
                          </div>
                        </template>

                        <!-- Text / code preview (syntax highlighted) -->
                        <template x-if="previewType === 'text'">
                          <pre class="rounded-lg bg-black/30 p-3 text-xs font-mono overflow-auto max-h-96 whitespace-pre-wrap break-all"><code x-html="$data.previewHtml"></code></pre>
                        </template>

                        <!-- HTML / Markdown preview (sandboxed iframe) -->
                        <template x-if="previewType === 'html'">
                          <iframe :src="previewUrl" sandbox class="w-full rounded-lg border border-vault-border/30" style="height:400px"></iframe>
                        </template>

                        <!-- PDF preview -->
                        <template x-if="previewType === 'pdf'">
                          <iframe :src="previewUrl" class="w-full rounded-lg border border-vault-border/30" style="height:400px"></iframe>
                        </template>
                      </div>
                    </div>

                    <!-- Tags -->
                    <div class="pt-2 border-t border-vault-border/30">
                      <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-medium text-vault-muted uppercase tracking-wider">Tags</span>
                        <span x-show="tagsLoading" class="text-[10px] text-vault-muted">Loading...</span>
                      </div>
                      <!-- Existing tags -->
                      <div x-show="objectTags.length > 0" class="space-y-1 mb-2">
                        <template x-for="tag in objectTags" :key="tag.key">
                          <div class="flex items-center justify-between gap-2 px-2 py-1 rounded bg-vault-bg/50 text-xs">
                            <span class="font-mono text-vault-accent truncate" x-text="tag.key"></span>
                            <span class="text-vault-muted">=</span>
                            <span class="font-mono text-vault-text truncate flex-1" x-text="tag.value || '(empty)'"></span>
                            <button @click="removeObjectTag(tag.key)" :disabled="tagSaving"
                              class="p-0.5 rounded hover:bg-red-500/10 text-vault-muted hover:text-red-400 transition flex-shrink-0 disabled:opacity-30">
                              <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                          </div>
                        </template>
                      </div>
                      <div x-show="!tagsLoading && objectTags.length === 0" class="text-[10px] text-vault-muted/50 mb-2">No tags</div>
                      <!-- Add tag form -->
                      <div x-show="objectTags.length < 10" class="flex gap-1">
                        <input type="text" x-model="newTagKey" placeholder="Key"
                          class="flex-1 px-2 py-1 rounded bg-vault-bg border border-vault-border text-[11px] font-mono text-vault-text focus:outline-none focus:border-vault-accent/50 transition min-w-0">
                        <input type="text" x-model="newTagValue" placeholder="Value"
                          class="flex-1 px-2 py-1 rounded bg-vault-bg border border-vault-border text-[11px] font-mono text-vault-text focus:outline-none focus:border-vault-accent/50 transition min-w-0">
                        <button @click="addObjectTag()" :disabled="!newTagKey.trim() || tagSaving"
                          class="px-2 py-1 rounded bg-vault-accent/10 text-vault-accent text-[10px] font-medium hover:bg-vault-accent/20 transition disabled:opacity-30 flex-shrink-0">
                          +
                        </button>
                      </div>
                    </div>

                    <!-- Version History (only for versioned buckets) -->
                    <div x-show="bucketVersioned" class="pt-2 border-t border-vault-border/30">
                      <button @click="toggleVersions()" class="flex items-center justify-between w-full py-2 text-sm font-medium text-vault-muted hover:text-vault-text transition">
                        <span class="flex items-center gap-1.5">
                          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                          Versions
                          <span x-show="versions.length > 0" class="text-[10px] px-1.5 py-0.5 rounded-full bg-vault-accent/20 text-vault-accent font-medium" x-text="versions.length"></span>
                        </span>
                        <svg :class="versionsExpanded ? 'rotate-180' : ''" class="w-4 h-4 transition-transform" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
                      </button>

                      <div x-show="versionsExpanded" x-transition>
                        <!-- Loading -->
                        <div x-show="versionsLoading" class="flex justify-center py-4">
                          <svg class="animate-spin h-4 w-4 text-vault-accent" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                        </div>

                        <!-- Error -->
                        <p x-show="versionsError" x-text="versionsError" class="text-red-400 text-xs py-2"></p>

                        <!-- No versions -->
                        <div x-show="!versionsLoading && !versionsError && versions.length === 0" class="text-vault-muted/60 text-xs text-center py-4">
                          No version history available
                        </div>

                        <!-- Version list -->
                        <div x-show="!versionsLoading && versions.length > 0" class="space-y-1.5 max-h-64 overflow-y-auto">
                          <template x-for="ver in versions" :key="ver.versionId">
                            <div class="rounded-lg p-2.5 text-xs"
                              :class="ver.isDeleteMarker ? 'bg-red-500/5 border border-red-500/20' : (ver.isLatest ? 'bg-vault-accent/5 border border-vault-accent/20' : 'bg-vault-border/20 border border-vault-border/30')">
                              <div class="flex items-center justify-between mb-1">
                                <div class="flex items-center gap-1.5">
                                  <span class="font-mono text-vault-text" :title="ver.versionId" x-text="truncateVersionId(ver.versionId)"></span>
                                  <span x-show="ver.isLatest" class="text-[9px] px-1 py-0.5 rounded bg-vault-accent/20 text-vault-accent font-medium uppercase">Latest</span>
                                  <span x-show="ver.isDeleteMarker" class="text-[9px] px-1 py-0.5 rounded bg-red-500/20 text-red-400 font-medium uppercase">Delete Marker</span>
                                </div>
                                <div class="flex items-center gap-0.5">
                                  <button x-show="!ver.isDeleteMarker" @click="downloadVersion(ver.key, ver.versionId)"
                                    class="p-1 rounded hover:bg-vault-accent/10 text-vault-muted hover:text-vault-accent transition" title="Download this version">
                                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                                  </button>
                                  <button @click="confirmDeleteVersion(ver.key, ver.versionId, ver.isDeleteMarker, ver.isLatest)"
                                    class="p-1 rounded hover:bg-red-500/10 text-vault-muted hover:text-red-400 transition" title="Permanently delete this version">
                                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
                                  </button>
                                </div>
                              </div>
                              <div class="flex items-center gap-3 text-vault-muted">
                                <span x-text="new Date(ver.lastModified).toLocaleString()"></span>
                                <span x-show="!ver.isDeleteMarker" x-text="formatBytes(ver.size)"></span>
                              </div>
                            </div>
                          </template>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>

            <!-- Preview modal (fullscreen) -->
            <div x-show="$data.showPreviewModal" x-transition.opacity class="fixed inset-0 bg-black/80 z-50 flex flex-col" @keydown.escape.window="$data.showPreviewModal = false">
              <div class="flex items-center justify-between px-6 py-3 border-b border-vault-border/30">
                <div class="flex items-center gap-2 text-sm text-vault-muted min-w-0">
                  <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
                  <span class="font-mono truncate" x-text="selectedObject?.key"></span>
                </div>
                <button @click="$data.showPreviewModal = false" class="p-1.5 rounded hover:bg-white/10 text-vault-muted hover:text-vault-text transition">
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
              <div class="flex-1 overflow-auto p-6 flex items-start justify-center">
                <template x-if="previewType === 'image'">
                  <img :src="previewUrl" class="max-w-full max-h-full object-contain" :alt="selectedObject?.key">
                </template>
                <template x-if="previewType === 'video'">
                  <video :src="previewUrl" controls disablepictureinpicture controlslist="nodownload" x-webkit-airplay="deny" class="max-w-full max-h-full">Your browser does not support this video format.</video>
                </template>
                <template x-if="previewType === 'text'">
                  <pre class="w-full rounded-lg bg-black/30 p-4 text-sm font-mono overflow-auto whitespace-pre-wrap break-all"><code x-html="$data.previewHtml"></code></pre>
                </template>
                <template x-if="previewType === 'html'">
                  <iframe :src="previewUrl" sandbox class="w-full h-full rounded-lg border border-vault-border/30"></iframe>
                </template>
                <template x-if="previewType === 'pdf'">
                  <iframe :src="previewUrl" class="w-full h-full rounded-lg border border-vault-border/30"></iframe>
                </template>
              </div>
            </div>

            <!-- Delete object modal -->
            <div x-show="showDeleteObjModal" x-transition.opacity class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="showDeleteObjModal = false">
              <div class="glass rounded-xl p-6 w-full max-w-sm mx-4" @click.stop>
                <h3 class="text-lg font-semibold mb-2" x-text="deleteIsDir ? 'Delete Folder' : 'Delete Object'"></h3>
                <p class="text-sm text-vault-muted mb-1">Are you sure you want to delete:</p>
                <p class="text-sm font-mono text-vault-text mb-3 break-all" x-text="deleteObjKey"></p>
                <template x-if="deleteIsDir">
                  <div class="mb-3">
                    <label class="flex items-center gap-2 cursor-pointer">
                      <input type="checkbox" x-model="deleteRecursive"
                        class="w-4 h-4 rounded border-vault-border bg-vault-bg text-red-500 focus:ring-red-500/30 focus:ring-offset-0">
                      <span class="text-sm text-vault-muted">Delete all contents recursively</span>
                    </label>
                    <p x-show="!deleteRecursive" class="text-[10px] text-vault-muted/60 mt-1 ml-6">Only the empty folder marker will be deleted.</p>
                    <p x-show="deleteRecursive" class="text-[10px] text-red-400/80 mt-1 ml-6">All objects under this folder will be permanently deleted.</p>
                  </div>
                </template>
                <p x-show="deleteError" x-text="deleteError" class="text-red-400 text-xs mb-3"></p>
                <p x-show="deleteProgress" x-text="deleteProgress" class="text-vault-muted text-xs mb-3"></p>
                <div class="flex gap-3 justify-end">
