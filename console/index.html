                          <div class="pop-search"><input type="text" x-model="bucketSearch" placeholder="Search..."></div>
                          <div class="pop-list">
                            <template x-for="item in bucketValues" :key="item.name">
                              <div class="pop-item" :class="{ selected: selectedBuckets.has(item.name) }"
                                x-show="!bucketSearch || item.name.toLowerCase().includes(bucketSearch.toLowerCase())"
                                @click="toggleSet(selectedBuckets, item.name); selectedBuckets = new Set(selectedBuckets); page = 0">
                                <div class="check"><svg fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="white"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg></div>
                                <span x-text="item.name"></span>
                                <span class="cnt" x-text="item.count"></span>
                              </div>
                            </template>
                          </div>
                        </div>
                      </div>
                    </th>
                    <!-- KEY header (inline text filter, same as audit Key) -->
                    <th class="px-4 py-3">
                      <div class="col-filter" :class="{ active: filterKey }">
                        <div class="col-label" @click="keyEditing = true; $nextTick(() => $refs.nKeyInput.focus())" x-show="!keyEditing && !filterKey">
                          Key <svg class="fi" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z"/></svg>
                        </div>
                        <div x-show="filterKey && !keyEditing" class="filter-badge" @click="keyEditing = true; $nextTick(() => $refs.nKeyInput.focus())">
                          <span class="val" x-text="filterKey"></span>
                          <span class="fbx" @click.stop="filterKey = ''; page = 0"><svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></span>
                        </div>
                        <input type="text" x-ref="nKeyInput" x-model="filterKey" x-show="keyEditing" class="key-inline"
                          @focus="keyEditing = true" @blur="keyEditing = false"
                          @keydown.enter="keyEditing = false; $refs.nKeyInput.blur(); page = 0"
                          @keydown.escape="filterKey = ''; keyEditing = false; $refs.nKeyInput.blur(); page = 0"
                          placeholder="filter key...">
                      </div>
                    </th>
                    <!-- DESTINATION header (inline text filter) -->
                    <th class="px-4 py-3">
                      <div class="col-filter" :class="{ active: filterDestination }">
                        <div class="col-label" @click="destEditing = true; $nextTick(() => $refs.nDestInput.focus())" x-show="!destEditing && !filterDestination">
                          Destination <svg class="fi" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z"/></svg>
                        </div>
                        <div x-show="filterDestination && !destEditing" class="filter-badge" @click="destEditing = true; $nextTick(() => $refs.nDestInput.focus())">
                          <span class="val" x-text="filterDestination"></span>
                          <span class="fbx" @click.stop="filterDestination = ''; page = 0"><svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></span>
                        </div>
                        <input type="text" x-ref="nDestInput" x-model="filterDestination" x-show="destEditing" class="key-inline"
                          @focus="destEditing = true" @blur="destEditing = false"
                          @keydown.enter="destEditing = false; $refs.nDestInput.blur(); page = 0"
                          @keydown.escape="filterDestination = ''; destEditing = false; $refs.nDestInput.blur(); page = 0"
                          placeholder="filter url...">
                      </div>
                    </th>
                    <!-- STATUS header (value list dropdown, same as audit Status) -->
                    <th class="px-4 py-3 text-right">
                      <div class="col-filter" :class="{ active: selectedStatuses.size > 0 }" @click.outside="statusOpen = false" style="display:flex;justify-content:flex-end">
                        <div class="col-label" @click="statusOpen = !statusOpen" x-show="selectedStatuses.size === 0">
                          Status <svg class="fi" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z"/></svg>
                        </div>
                        <div x-show="selectedStatuses.size > 0" class="filter-badge" @click="statusOpen = !statusOpen">
                          <span class="val" x-text="[...selectedStatuses].join(', ')"></span>
                          <span class="fbx" @click.stop="selectedStatuses = new Set(); statusOpen = false; page = 0"><svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></span>
                        </div>
                        <div class="col-popover" x-show="statusOpen" x-cloak style="min-width:min(120px, calc(100vw - 2rem));right:-8px;left:auto">
                          <div class="pop-list">
                            <template x-for="item in statusValues" :key="item.name">
                              <div class="pop-item" :class="{ selected: selectedStatuses.has(item.name) }"
                                @click="toggleSet(selectedStatuses, item.name); selectedStatuses = new Set(selectedStatuses); page = 0">
                                <div class="check"><svg fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="white"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg></div>
                                <span :class="statusClass(item.name)" x-text="item.name"></span>
                                <span class="cnt" x-text="item.count"></span>
                              </div>
                            </template>
                          </div>
                        </div>
                      </div>
                    </th>
                    <th class="px-4 py-3 text-right">Attempts</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="entry in pagedEntries" :key="entry.id">
                    <tr @click="selectEntry(entry)" class="border-b border-vault-border/10 hover:bg-white/[0.02] cursor-pointer transition"
                      :class="selectedEntry?.id === entry.id ? 'bg-vault-accent/5' : ''">
                      <td class="px-4 py-2.5 text-xs text-vault-muted whitespace-nowrap" x-text="formatTime(entry.event_time)"></td>
                      <td class="px-4 py-2.5">
                        <span class="text-xs font-mono px-1.5 py-0.5 rounded bg-vault-border/20" x-text="entry.event_name.replace('s3:','')"></span>
                      </td>
                      <td class="px-4 py-2.5 text-xs text-vault-text" x-text="entry.bucket || '\u2014'"></td>
                      <td class="px-4 py-2.5 text-xs text-vault-muted max-w-[200px] truncate" :title="entry.key" x-text="entry.key || '\u2014'"></td>
                      <td class="px-4 py-2.5 text-xs text-vault-muted max-w-[200px] truncate" :title="entry.destination_url" x-text="entry.destination_url || '\u2014'"></td>
                      <td class="px-4 py-2.5 text-xs text-right">
                        <span :class="statusBadgeClass(entry.delivery_status)" class="px-2 py-0.5 rounded-full text-xs font-medium" x-text="entry.delivery_status"></span>
                      </td>
                      <td class="px-4 py-2.5 text-xs text-right text-vault-muted" x-text="entry.delivery_attempts"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <!-- Empty state -->
              <div x-show="pagedEntries.length === 0" class="py-12 text-center text-vault-muted text-sm">
                No notification events found
              </div>
            </div>

            <!-- Bottom pagination bar (same as top) -->
            <div x-show="!loading && total > 0" class="flex flex-wrap items-center justify-end gap-3 mt-4">
              <div class="flex items-center gap-3 flex-shrink-0">
                <span class="text-xs text-vault-muted" x-text="'Page ' + currentPage + ' of ' + totalPages"></span>
                <div class="flex gap-0.5">
                  <button @click="firstPage()" :disabled="page === 0" class="p-1 rounded-lg border border-vault-border text-vault-muted hover:text-vault-text transition disabled:opacity-30" title="First page"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M18.75 19.5l-7.5-7.5 7.5-7.5m-6 15L5.25 12l7.5-7.5"/></svg></button>
                  <button @click="prevPage()" :disabled="page === 0" class="p-1 rounded-lg border border-vault-border text-vault-muted hover:text-vault-text transition disabled:opacity-30" title="Previous page"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg></button>
                  <button @click="nextPage()" :disabled="currentPage >= totalPages" class="p-1 rounded-lg border border-vault-border text-vault-muted hover:text-vault-text transition disabled:opacity-30" title="Next page"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg></button>
                  <button @click="lastPage()" :disabled="currentPage >= totalPages" class="p-1 rounded-lg border border-vault-border text-vault-muted hover:text-vault-text transition disabled:opacity-30" title="Last page"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 4.5l7.5 7.5-7.5 7.5m6-15l7.5 7.5-7.5 7.5"/></svg></button>
                </div>
              </div>
            </div>

            <!-- Clear events modal -->
            <div x-show="showClearModal" x-transition.opacity class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="showClearModal = false">
              <div class="glass rounded-xl p-6 w-full max-w-sm mx-4" @click.stop>
                <h3 class="text-lg font-semibold mb-2 text-red-400">Clear Notification Events</h3>
                <p class="text-sm text-vault-muted mb-3">This will permanently delete all notification event records. This cannot be undone.</p>
                <p class="text-sm text-vault-muted mb-3">Type <strong class="text-vault-text">CLEAR EVENTS</strong> to confirm:</p>
                <input type="text" x-model="clearConfirmText" class="w-full px-3.5 py-2.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-red-500/50 focus:ring-1 focus:ring-red-500/30 transition text-sm mb-4" placeholder="CLEAR EVENTS">
                <div class="flex gap-3 justify-end">
                  <button @click="showClearModal = false" class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Cancel</button>
                  <button @click="clearAllEvents()" :disabled="clearConfirmText !== 'CLEAR EVENTS' || clearing"
                    class="px-4 py-2 rounded-lg bg-red-500/20 text-red-400 border border-red-500/30 text-sm font-medium hover:bg-red-500/30 transition disabled:opacity-30"
                    x-text="clearing ? 'Clearing...' : 'Clear All'"></button>
                </div>
              </div>
            </div>

            <!-- Detail backdrop (mobile) -->
            <div x-show="selectedEntry" @click="selectedEntry = null" class="fixed inset-0 bg-black/40 z-30 md:hidden"></div>
            <!-- Side panel (matches audit) -->
            <div x-show="selectedEntry" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
              class="fixed right-0 top-12 md:top-0 h-[calc(100%-3rem)] md:h-full w-full md:w-80 glass border-l border-vault-border/50 z-40 slide-panel overflow-y-auto">
              <div class="p-5">
                <div class="flex items-center justify-between mb-5">
                  <h3 class="text-sm font-semibold uppercase tracking-wider text-vault-accent">Event Details</h3>
                  <button @click="selectedEntry = null" class="text-vault-muted hover:text-vault-text p-1 rounded-lg hover:bg-white/5 transition">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                  </button>
                </div>
                <template x-if="selectedEntry">
                  <div class="space-y-4 text-sm">
                    <div><span class="text-[11px] text-vault-muted uppercase tracking-wider block mb-0.5">Event</span><span class="font-mono text-xs" x-text="selectedEntry.event_name"></span></div>
                    <div><span class="text-[11px] text-vault-muted uppercase tracking-wider block mb-0.5">Time</span><span x-text="formatTime(selectedEntry.event_time)"></span></div>
                    <div><span class="text-[11px] text-vault-muted uppercase tracking-wider block mb-0.5">Bucket</span><span x-text="selectedEntry.bucket"></span></div>
                    <div><span class="text-[11px] text-vault-muted uppercase tracking-wider block mb-0.5">Key</span><span class="font-mono text-xs break-all" x-text="selectedEntry.key"></span></div>
                    <div><span class="text-[11px] text-vault-muted uppercase tracking-wider block mb-0.5">Destination</span><span class="font-mono text-xs break-all" x-text="selectedEntry.destination_url"></span></div>
                    <div><span class="text-[11px] text-vault-muted uppercase tracking-wider block mb-0.5">Config ID</span><span class="font-mono text-xs" x-text="selectedEntry.configuration_id"></span></div>
                    <div><span class="text-[11px] text-vault-muted uppercase tracking-wider block mb-0.5">Status</span><span :class="statusBadgeClass(selectedEntry.delivery_status)" class="px-2 py-0.5 rounded-full text-xs font-medium" x-text="selectedEntry.delivery_status"></span></div>
                    <div><span class="text-[11px] text-vault-muted uppercase tracking-wider block mb-0.5">Attempts</span><span x-text="selectedEntry.delivery_attempts"></span></div>
                    <div x-show="selectedEntry.last_error"><span class="text-[11px] text-vault-muted uppercase tracking-wider block mb-0.5">Error</span><span class="text-red-400 text-xs" x-text="selectedEntry.last_error"></span></div>
                    <div><span class="text-[11px] text-vault-muted uppercase tracking-wider block mb-0.5">ID</span><span class="font-mono text-[10px] text-vault-muted break-all" x-text="selectedEntry.id"></span></div>
                    <div>
                      <span class="text-[11px] text-vault-muted uppercase tracking-wider block mb-1">Payload</span>
                      <pre class="p-3 bg-black/30 rounded-lg text-[10px] overflow-auto max-h-64 font-mono text-vault-text" x-text="JSON.stringify(JSON.parse(selectedEntry.payload || '{}'), null, 2)"></pre>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>

        <!-- ==================== REPLICATION ==================== -->
        <template x-if="view === 'replication'">
          <div class="p-6 max-w-7xl">

            <!-- Destination credentials card (global, shared across buckets). -->
            <div class="glass rounded-xl p-5 mb-6" x-data="replicationCredentials" x-init="init()">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                <div>
                  <h2 class="text-xl font-semibold tracking-tight">Destination credentials</h2>
                  <p class="text-xs text-vault-muted mt-0.5">AWS-style access key pairs reused by replication rules across every bucket. Secrets are write-only — they never leave the server.</p>
                </div>
                <div class="flex items-center gap-2">
                  <button @click="load()" class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs text-vault-muted hover:text-vault-text border border-vault-border/30 hover:border-vault-border/60 transition" title="Reload">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182"/></svg>
                    Reload
                  </button>
                  <button @click="openAdd()" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-vault-accent/10 text-vault-accent border border-vault-accent/30 hover:bg-vault-accent/20 transition">+ New credential</button>
                </div>
              </div>

              <div x-show="loading" class="flex justify-center py-6">
                <svg class="animate-spin h-5 w-5 text-vault-accent" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
              </div>

              <div x-show="!loading && error" class="rounded-lg border border-red-500/30 bg-red-500/10 text-red-400 px-3 py-2 text-xs" x-text="error"></div>

              <div x-show="!loading && !error && credentials.length === 0" class="text-xs text-vault-muted italic px-1 py-2">
                No destination credentials stored yet. Add one to make it selectable when creating a replication rule on any bucket.
              </div>

              <div x-show="!loading && !error && credentials.length > 0" class="rounded-lg border border-vault-border/30 overflow-hidden">
                <table class="w-full text-sm">
                  <thead class="text-[11px] uppercase tracking-wider text-vault-muted border-b border-vault-border/30">
                    <tr>
                      <th class="text-left px-3 py-2 font-medium">Name</th>
                      <th class="text-left px-3 py-2 font-medium">Access key ID</th>
                      <th class="text-right px-3 py-2 font-medium w-20">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="cred in credentials" :key="cred.name">
                      <tr class="border-b border-vault-border/10 last:border-b-0 hover:bg-white/[0.02] transition">
                        <td class="px-3 py-2 font-mono text-xs text-vault-text" x-text="cred.name"></td>
                        <td class="px-3 py-2 font-mono text-xs text-vault-muted" x-text="cred.access_key_id"></td>
                        <td class="px-3 py-2 text-right">
                          <button @click="askDelete(cred)" class="p-1 rounded-lg text-red-400/70 hover:text-red-400 hover:bg-red-500/10 transition" title="Delete credential">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/></svg>
                          </button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>

              <!-- Add credential modal -->
              <template x-teleport="body">
                <div x-show="showAddModal" x-transition.opacity class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="showAddModal = false" x-cloak>
                  <div class="glass rounded-xl p-6 w-full max-w-md mx-4" @click.stop>
                    <h3 class="text-lg font-semibold mb-1">New destination credential</h3>
                    <p class="text-xs text-vault-muted mb-4">Pick a short, memorable name (used as a reference in replication rules). The secret is stored server-side and never returned.</p>
                    <div class="space-y-3">
                      <div>
                        <label class="text-[10px] uppercase tracking-wider text-vault-muted font-medium">Name</label>
                        <input type="text" x-model="addForm.name" placeholder="replica-creds" autocomplete="off" class="w-full mt-0.5 px-2.5 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 text-xs font-mono">
                      </div>
                      <div>
                        <label class="text-[10px] uppercase tracking-wider text-vault-muted font-medium">Access key ID</label>
                        <input type="text" x-model="addForm.access_key_id" placeholder="AKIA..." autocomplete="off" class="w-full mt-0.5 px-2.5 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 text-xs font-mono">
                      </div>
                      <div>
                        <label class="text-[10px] uppercase tracking-wider text-vault-muted font-medium">Secret access key</label>
                        <input x-password-toggle type="password" x-model="addForm.secret_access_key" placeholder="secret (no colons)" autocomplete="new-password" class="w-full mt-0.5 px-2.5 py-1.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 text-xs font-mono">
                      </div>
                      <div x-show="addError" class="rounded-lg border border-red-500/30 bg-red-500/10 text-red-400 px-3 py-2 text-xs" x-text="addError"></div>
                    </div>
                    <div class="flex justify-end gap-2 mt-5">
                      <button @click="showAddModal = false" class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Cancel</button>
                      <button @click="saveAdd()" :disabled="adding" class="px-4 py-2 rounded-lg bg-vault-accent/20 text-vault-accent border border-vault-accent/30 text-sm font-medium hover:bg-vault-accent/30 transition disabled:opacity-40" x-text="adding ? 'Saving…' : 'Save credential'"></button>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Delete credential modal -->
              <template x-teleport="body">
                <div x-show="showDeleteModal" x-transition.opacity class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="showDeleteModal = false" x-cloak>
                  <div class="glass rounded-xl p-6 w-full max-w-md mx-4" @click.stop>
                    <h3 class="text-lg font-semibold mb-2 text-red-400">Delete credential</h3>

                    <!-- Loading state -->

                <div class="flex items-center justify-end gap-3 pt-1">
                  <button @click="showExportModal = false" class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Cancel</button>
                  <button @click="doExport()" :disabled="exportBusy || !Object.values(exportSections).some(v => v)"
                    class="px-4 py-2 rounded-lg bg-vault-accent/20 text-vault-accent border border-vault-accent/30 text-sm font-medium hover:bg-vault-accent/30 transition disabled:opacity-50">
                    <span x-show="!exportBusy">Export</span>
                    <span x-show="exportBusy" class="flex items-center gap-1.5">
                      <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                      Exporting...
                    </span>
                  </button>
                </div>
              </div>
            </div>

            <!-- Import Modal -->
            <div x-show="showImportModal" x-transition.opacity class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="closeImportModal()" @keydown.escape.window="closeImportModal()">
              <div class="glass rounded-xl p-6 w-full max-w-lg mx-4" @click.stop>
                <h3 class="text-lg font-semibold mb-5">Import Configuration</h3>

                <!-- File upload area -->
                <template x-if="!importFile">
                  <div class="border-2 border-dashed border-vault-border/40 rounded-xl p-10 text-center cursor-pointer hover:border-vault-accent/40 transition group"
                    @click="$refs.importFileInput.click()"
                    @dragover.prevent="$event.currentTarget.classList.add('border-vault-accent/60')"
                    @dragleave.prevent="$event.currentTarget.classList.remove('border-vault-accent/60')"
                    @drop.prevent="handleImportDrop($event)">
                    <svg class="w-10 h-10 mx-auto mb-3 text-vault-muted group-hover:text-vault-accent/60 transition" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m6.75 12-3-3m0 0-3 3m3-3v6m-1.5-15H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/></svg>
                    <p class="text-sm text-vault-muted mb-1">Drop a JSON file here or click to browse</p>
                    <p class="text-xs text-vault-muted/60">Accepts .json files exported from Arca</p>
                    <input type="file" accept=".json" x-ref="importFileInput" class="hidden" @change="handleImportFile($event.target.files[0])">
                  </div>
                </template>

                <!-- File loaded: preview -->
                <template x-if="importFile && !importResults">
                  <div>
                    <div class="glass rounded-lg p-4 mb-5">
                      <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">
                          <svg class="w-4 h-4 text-vault-accent shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/></svg>
                          <span class="text-sm font-medium text-vault-text" x-text="importFile.name"></span>
                        </div>
                        <button @click="importFile = null; importPreview = null" class="text-xs text-vault-muted hover:text-red-400 transition">Remove</button>
                      </div>
                      <template x-if="importPreview">
                        <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-vault-muted">
                          <template x-if="importPreview.version"><span>v<span class="text-vault-text" x-text="importPreview.version"></span></span></template>
                          <template x-if="importPreview.settings !== undefined"><span><span class="text-vault-text" x-text="importPreview.settings"></span> settings</span></template>
                          <template x-if="importPreview.users !== undefined"><span><span class="text-vault-text" x-text="importPreview.users"></span> users</span></template>
                          <template x-if="importPreview.teams !== undefined"><span><span class="text-vault-text" x-text="importPreview.teams"></span> teams</span></template>
                          <template x-if="importPreview.grants !== undefined"><span><span class="text-vault-text" x-text="importPreview.grants"></span> grants</span></template>
                          <template x-if="importPreview.credentials !== undefined"><span><span class="text-vault-text" x-text="importPreview.credentials"></span> credentials</span></template>
                          <template x-if="importPreview.buckets !== undefined"><span><span class="text-vault-text" x-text="importPreview.buckets"></span> buckets</span></template>
                          <template x-if="importPreview.bucket_configs !== undefined"><span><span class="text-vault-text" x-text="importPreview.bucket_configs"></span> bucket configs</span></template>
                        </div>
                      </template>
                    </div>

                    <div class="mb-5">
                      <span class="text-sm font-medium text-vault-text block mb-2">Conflict mode</span>
                      <div class="space-y-1">
                        <label class="flex items-center gap-2.5 text-sm cursor-pointer rounded-lg px-2.5 py-2 -mx-2.5 hover:bg-white/[0.03] transition">
                          <input type="radio" x-model="importMode" value="skip" name="importMode" class="text-vault-accent focus:ring-vault-accent/30">
                          <span class="text-vault-text">Skip existing</span>
                        </label>
                        <label class="flex items-center gap-2.5 text-sm cursor-pointer rounded-lg px-2.5 py-2 -mx-2.5 hover:bg-white/[0.03] transition">
                          <input type="radio" x-model="importMode" value="overwrite" name="importMode" class="text-vault-accent focus:ring-vault-accent/30">
                          <span class="text-vault-text">Overwrite existing</span>
                        </label>
                        <label class="flex items-center gap-2.5 text-sm cursor-pointer rounded-lg px-2.5 py-2 -mx-2.5 hover:bg-white/[0.03] transition">
                          <input type="radio" x-model="importMode" value="dry_run" name="importMode" class="text-vault-accent focus:ring-vault-accent/30">
                          <span class="text-vault-text">Dry run</span>
                          <span class="text-vault-muted text-xs">(preview only, no changes)</span>
                        </label>
                      </div>
                      <p x-show="importMode === 'overwrite'" class="text-xs text-amber-400 mt-2 ml-0.5 flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/></svg>
                        Existing items will be replaced with imported values
                      </p>
                    </div>

                    <div class="flex items-center justify-end gap-3">
                      <button @click="closeImportModal()" class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Cancel</button>
                      <button @click="doImport()" :disabled="importBusy"
                        class="px-4 py-2 rounded-lg bg-vault-accent/20 text-vault-accent border border-vault-accent/30 text-sm font-medium hover:bg-vault-accent/30 transition disabled:opacity-50">
                        <span x-show="!importBusy">Import</span>
                        <span x-show="importBusy" class="flex items-center gap-1.5">
                          <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                          Importing...
                        </span>
                      </button>
                    </div>
                  </div>
                </template>

                <!-- Import results -->
                <template x-if="importResults">
                  <div>
                    <div class="glass rounded-lg p-4 mb-4">
                      <div class="flex items-center gap-2 mb-3">
                        <svg class="w-4 h-4 shrink-0" :class="importResults.mode === 'dry_run' ? 'text-vault-indigo' : 'text-vault-accent'" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                        <span class="text-sm font-medium" :class="importResults.mode === 'dry_run' ? 'text-vault-indigo' : 'text-vault-accent'" x-text="importResults.mode === 'dry_run' ? 'Dry Run Results' : 'Import Complete'"></span>
                      </div>
                      <div class="space-y-1.5">
                        <template x-for="(result, section) in importResults.results" :key="section">
                          <div class="flex items-center justify-between text-xs py-1 px-2 rounded -mx-2" :class="(result.created || result.applied) ? 'bg-white/[0.02]' : ''">
                            <span class="text-vault-text capitalize" x-text="section.replace('_', ' ')"></span>
                            <div class="flex gap-3 text-vault-muted">
                              <span x-show="result.created" class="text-green-400" x-text="result.created + ' created'"></span>
                              <span x-show="result.applied" class="text-vault-accent" x-text="result.applied + ' applied'"></span>
                              <span x-show="result.skipped" x-text="result.skipped + ' skipped'"></span>
                              <span x-show="result.errors" class="text-red-400" x-text="result.errors + ' errors'"></span>
                              <span x-show="!result.created && !result.applied && !result.skipped && !result.errors" class="italic">no items in export</span>
                            </div>
                          </div>
                        </template>
                      </div>
                    </div>
                    <template x-if="importResults.errors && importResults.errors.length > 0">
                      <div class="glass rounded-lg p-4 mb-4 border border-red-500/20">
                        <span class="text-xs font-medium text-red-400 block mb-1.5">Errors</span>
                        <div class="space-y-0.5">
                          <template x-for="err in importResults.errors" :key="err">
                            <p class="text-xs text-vault-muted font-mono" x-text="err"></p>
                          </template>
                        </div>
                      </div>
                    </template>
                    <div class="flex justify-end">
                      <button @click="closeImportModal()" class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Close</button>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>

      </main>
    </div>
  </template>

  <!-- ==================== TOAST NOTIFICATION ==================== -->
  <div x-show="toast" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-1 translate-y-0"
    x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-1" x-transition:leave-end="opacity-0"
    class="fixed bottom-6 left-4 right-4 md:left-auto md:right-6 z-50 glass rounded-lg px-4 py-3 text-sm max-w-sm mx-auto md:mx-0"
    :class="toastType === 'error' ? 'border-red-500/30 text-red-400' : 'border-vault-accent/30 text-vault-accent'">
    <span x-text="toast"></span>
  </div>

</body>
</html>
