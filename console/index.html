                  <button @click="showDeleteObjModal = false" class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Cancel</button>
                  <button @click="deleteObject()" :disabled="deleting" class="px-4 py-2 rounded-lg bg-red-500/20 text-red-400 border border-red-500/30 text-sm font-medium hover:bg-red-500/30 transition disabled:opacity-50" x-text="deleting ? 'Deleting...' : 'Delete'"></button>
                </div>
              </div>
            </div>

            <!-- Batch delete confirm modal -->
            <div x-show="showDeleteBatchModal" x-transition.opacity class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="showDeleteBatchModal = false">
              <div class="glass rounded-xl p-6 w-full max-w-sm mx-4" @click.stop>
                <h3 class="text-lg font-semibold mb-2">Delete Selected Items</h3>
                <p class="text-sm text-vault-muted mb-3">Are you sure you want to delete
                  <span class="text-vault-text font-medium" x-text="deleteBatchFileCount + deleteBatchDirCount"></span> selected item<span x-show="deleteBatchFileCount + deleteBatchDirCount > 1">s</span>?
                </p>
                <template x-if="deleteBatchFileCount + deleteBatchDirCount > 1">
                  <div class="mb-3 p-2.5 rounded-lg bg-amber-500/10 border border-amber-500/20">
                    <p class="text-xs text-amber-400 flex items-start gap-1.5">
                      <svg class="w-4 h-4 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
                      <span>You are about to delete <strong x-text="deleteBatchFileCount + deleteBatchDirCount"></strong> items. This action cannot be undone.</span>
                    </p>
                  </div>
                </template>
                <template x-if="deleteBatchDirCount > 0">
                  <div class="mb-3 p-2.5 rounded-lg bg-red-500/10 border border-red-500/20">
                    <p class="text-xs text-red-400 flex items-start gap-1.5">
                      <svg class="w-4 h-4 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
                      <span><strong x-text="deleteBatchDirCount"></strong> folder<span x-show="deleteBatchDirCount > 1">s</span> selected: all contents will be deleted recursively.</span>
                    </p>
                  </div>
                </template>
                <div class="flex gap-3 justify-end">
                  <button @click="showDeleteBatchModal = false" class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Cancel</button>
                  <button @click="showDeleteBatchModal = false; deleteSelected()" class="px-4 py-2 rounded-lg bg-red-500/20 text-red-400 border border-red-500/30 text-sm font-medium hover:bg-red-500/30 transition">Delete</button>
                </div>
              </div>
            </div>

            <!-- Create folder modal -->
            <div x-show="showCreateFolderModal" x-transition.opacity x-effect="if (showCreateFolderModal) $nextTick(() => $refs.folderNameInput?.focus())" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="showCreateFolderModal = false">
              <div class="glass rounded-xl p-6 w-full max-w-sm mx-4" @click.stop>
                <h3 class="text-lg font-semibold mb-4">Create Folder</h3>
                <form @submit.prevent="createFolder()">
                  <input type="text" x-model="newFolderName" x-ref="folderNameInput" required
                    placeholder="folder-name"
                    class="w-full px-3.5 py-2.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 focus:ring-1 focus:ring-vault-accent/30 transition text-sm font-mono mb-1">
                  <p class="text-[10px] text-vault-muted mb-4">Folder name. Avoid leading/trailing slashes.</p>
                  <div class="flex gap-3 justify-end">
                    <button type="button" @click="showCreateFolderModal = false" class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 rounded-lg bg-vault-accent text-vault-bg text-sm font-medium hover:opacity-90 transition">Create</button>
                  </div>
                  <p x-show="createFolderError" x-text="createFolderError" class="text-red-400 text-xs mt-2"></p>
                </form>
              </div>
            </div>

            <!-- Share (presigned URL) modal -->
            <div x-show="showShareModal" x-transition.opacity class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="showShareModal = false">
              <div class="glass rounded-xl p-6 w-full max-w-md mx-4" @click.stop>
                <h3 class="text-lg font-semibold mb-1">Share Object</h3>
                <p class="text-sm text-vault-muted mb-4 font-mono break-all" x-text="shareKey"></p>

                <!-- Expiry selector -->
                <div x-show="!shareUrl" class="mb-4">
                  <label class="text-xs text-vault-muted mb-2 block">Link expires in</label>
                  <div class="flex gap-2">
                    <template x-for="opt in shareExpiryOptions" :key="opt.value">
                      <button @click="shareExpiry = opt.value"
                        :class="shareExpiry === opt.value ? 'bg-vault-accent/20 text-vault-accent border-vault-accent/40' : 'text-vault-muted border-vault-border/50 hover:border-vault-accent/30'"
                        class="flex-1 py-2 rounded-lg border text-sm font-medium transition"
                        x-text="opt.label"></button>
                    </template>
                  </div>
                </div>

                <!-- Generate button -->
                <div x-show="!shareUrl" class="flex gap-3 justify-end">
                  <button @click="showShareModal = false" class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Cancel</button>
                  <button @click="generateShareUrl()" :disabled="shareGenerating"
                    class="px-4 py-2 rounded-lg bg-vault-accent text-vault-bg text-sm font-medium hover:opacity-90 transition disabled:opacity-50"
                    x-text="shareGenerating ? 'Generating...' : 'Generate Link'"></button>
                </div>

                <!-- Result -->
                <div x-show="shareUrl">
                  <label class="text-xs text-vault-muted mb-1.5 block">Presigned URL</label>
                  <div class="flex gap-2 mb-2">
                    <input type="text" :value="shareUrl" readonly
                      class="flex-1 px-3 py-2 rounded-lg bg-vault-bg border border-vault-border text-vault-text text-sm font-mono focus:outline-none select-all truncate">
                    <button @click="copyShareUrl()"
                      :class="shareCopied ? 'bg-green-500/20 text-green-400 border-green-500/30' : 'bg-vault-accent/10 text-vault-accent border-vault-accent/20 hover:bg-vault-accent/20'"
                      class="px-3 py-2 rounded-lg border text-sm font-medium transition whitespace-nowrap"
                      x-text="shareCopied ? 'Copied!' : 'Copy'"></button>
                  </div>
                  <p class="text-[10px] text-vault-muted" x-show="shareExpiresAt">
                    Expires: <span x-text="shareExpiresAt"></span>
                  </p>
                  <div class="flex gap-3 justify-end mt-4">
                    <button @click="showShareModal = false" class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Close</button>
                  </div>
                </div>

                <p x-show="shareError" x-text="shareError" class="text-red-400 text-xs mt-2"></p>
              </div>
            </div>

            <!-- Presigned URL detail modal -->
            <div x-show="showPresignedDetail" x-transition.opacity class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="showPresignedDetail = false">
              <div class="glass rounded-xl p-6 w-full max-w-lg mx-4" @click.stop>
                <h3 class="text-lg font-semibold mb-1">Active Shared Links</h3>
                <p class="text-sm text-vault-muted mb-4 font-mono break-all" x-text="fileName(presignedDetailKey)"></p>

                <div class="space-y-3 max-h-80 overflow-y-auto">
                  <template x-for="record in presignedDetailRecords" :key="record.id">
                    <div class="p-3 rounded-lg bg-vault-border/20 border border-vault-border/30">
                      <div class="flex items-center gap-2 mb-2">
                        <span class="text-[9px] px-1.5 py-0.5 rounded bg-blue-500/15 text-blue-400 font-medium uppercase" x-text="record.method"></span>
                        <span class="text-xs text-vault-muted">Created <span x-text="new Date(record.created_at).toLocaleString()"></span></span>
                      </div>
                      <div class="flex items-center justify-between text-xs text-vault-muted mb-2">
                        <span>Duration: <span class="text-vault-text" x-text="formatDuration(record.expires_seconds)"></span></span>
                        <span>Remaining: <span class="text-blue-400 font-medium" x-text="remainingTime(record.expires_at)"></span></span>
                      </div>
                      <div class="flex items-center justify-between text-xs text-vault-muted mb-3">
                        <span>Expires: <span x-text="new Date(record.expires_at).toLocaleString()"></span></span>
                        <span>By: <span class="font-mono text-vault-text" x-text="record.access_key_id.slice(0,8) + '...'"></span></span>
                      </div>
                      <button @click="deletePresignedUrl(record.id)"
                        class="w-full py-1.5 rounded-lg bg-red-500/10 text-red-400 text-xs font-medium hover:bg-red-500/20 transition border border-red-500/20">
                        Remove from tracking
                      </button>
                      <p class="text-[10px] text-vault-muted mt-1 italic">The link itself remains valid until expiry. This only removes it from the list.</p>
                    </div>
                  </template>
                </div>

                <div class="flex gap-3 justify-end mt-4">
                  <button @click="openShareModal(presignedDetailKey); showPresignedDetail = false"
                    class="px-4 py-2 rounded-lg bg-vault-accent/10 text-vault-accent text-sm font-medium hover:bg-vault-accent/20 transition">New Link</button>
                  <button @click="showPresignedDetail = false"
                    class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Close</button>
                </div>
              </div>
            </div>

            <!-- Delete version confirm modal -->
            <div x-show="showDeleteVersionModal" x-transition.opacity class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="showDeleteVersionModal = false">
              <div class="glass rounded-xl p-6 w-full max-w-sm mx-4" @click.stop>
                <h3 class="text-lg font-semibold mb-2" x-text="deleteVersionIsMarker ? 'Remove Delete Marker' : 'Delete Version'"></h3>
                <p class="text-sm text-vault-muted mb-1" x-text="deleteVersionIsMarker ? 'This will remove the delete marker, restoring the object.' : 'This will permanently delete this version. This cannot be undone.'"></p>
                <div class="mb-3 p-2.5 rounded-lg bg-vault-border/20 border border-vault-border/30">
                  <div class="text-xs text-vault-muted space-y-1">
                    <div x-show="deleteVersionIsLatest">
                      <span class="text-[9px] px-1 py-0.5 rounded bg-vault-accent/20 text-vault-accent font-medium uppercase">Latest</span>
                    </div>
                    <div>Version: <span class="font-mono text-vault-text" x-text="deleteVersionId"></span></div>
                    <div>Key: <span class="font-mono text-vault-text" x-text="deleteVersionKey"></span></div>
                  </div>
                </div>
                <p x-show="deleteVersionError" x-text="deleteVersionError" class="text-red-400 text-xs mb-3"></p>
                <div class="flex gap-3 justify-end">
                  <button @click="showDeleteVersionModal = false" class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Cancel</button>
                  <button @click="performDeleteVersion()" :disabled="deletingVersion"
                    class="px-4 py-2 rounded-lg bg-red-500/20 text-red-400 border border-red-500/30 text-sm font-medium hover:bg-red-500/30 transition disabled:opacity-50"
                    x-text="deletingVersion ? 'Deleting...' : (deleteVersionIsMarker ? 'Remove Marker' : 'Delete Version')"></button>
                </div>
              </div>
            </div>
          </div>
        </template>

        <!-- ==================== CREDENTIALS ==================== -->
        <template x-if="view === 'credentials'">
          <div class="p-6 max-w-6xl" x-data="credentialsView" x-init="load()">
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-xl font-semibold tracking-tight">Credentials</h2>
              <button @click="showCreateModal = true"
                class="px-3.5 py-1.5 rounded-lg bg-vault-accent/10 text-vault-accent border border-vault-accent/20 text-sm font-medium hover:bg-vault-accent/20 transition">
                + Create Credential
              </button>
            </div>

            <!-- Search bar -->
            <div x-show="!loading && credentials.length > 0" class="relative mb-4">
              <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-vault-muted pointer-events-none" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
              </svg>
              <input type="text" x-model.debounce.300ms="searchQuery" placeholder="Search credentials..."
                class="w-full bg-transparent border-b border-vault-border/50 hover:border-vault-border focus:border-vault-accent text-sm text-vault-text placeholder-vault-muted/50 focus:outline-none pl-9 pr-8 py-2 transition">
              <button x-show="searchQuery" @click="searchQuery = ''"
                class="absolute right-2 top-1/2 -translate-y-1/2 p-0.5 rounded text-vault-muted hover:text-vault-text transition">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
                </svg>
              </button>
            </div>

            <!-- Warning: only one credential -->
            <div x-show="credentials.filter(c => c.active).length <= 1 && credentials.length > 0"
              class="mb-4 px-4 py-3 rounded-lg bg-amber-500/10 border border-amber-500/20 text-amber-400 text-sm flex items-center gap-2">
              <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
              Only one active credential remains. Deleting it will lock you out.
            </div>

            <!-- Credential cards -->
            <div x-show="!loading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              <template x-for="cred in filteredCredentials" :key="cred.access_key_id">
                <div class="glass rounded-xl p-5 glass-hover transition">
                  <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                      <svg class="w-5 h-5 text-vault-indigo" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z"/></svg>
                      <span :class="cred.active ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'"
                        class="text-[10px] px-1.5 py-0.5 rounded font-medium uppercase" x-text="cred.active ? 'Active' : 'Inactive'"></span>
                      <span :class="cred.admin ? 'bg-violet-500/20 text-violet-400' : 'bg-slate-500/20 text-slate-400'"
                        class="text-[10px] px-1.5 py-0.5 rounded font-medium uppercase" x-text="cred.admin ? 'Admin' : 'User'"></span>
                    </div>
                    <button @click="confirmDeleteCred(cred.access_key_id)"
                      class="p-1 rounded hover:bg-red-500/10 text-vault-muted hover:text-red-400 transition">
                      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
                    </button>
                  </div>
                  <div class="font-mono text-xs text-vault-text mb-2 break-all" x-text="cred.access_key_id"></div>
                  <div class="text-xs text-vault-muted" x-text="cred.description || '(no description)'"></div>
                  <div class="text-[10px] text-vault-muted/60 mt-2" x-text="'Created ' + new Date(cred.created_at).toLocaleDateString()"></div>
                </div>
              </template>
            </div>

            <div x-show="!loading && credentials.length > 0 && filteredCredentials.length === 0" class="text-center py-16">
              <svg class="w-10 h-10 mx-auto text-vault-border mb-3" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
              </svg>
              <p class="text-vault-muted text-sm">No results for "<span x-text="searchQuery" class="text-vault-text"></span>"</p>
            </div>

            <div x-show="loading" class="flex justify-center py-16">
              <svg class="animate-spin h-6 w-6 text-vault-accent" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            </div>

            <!-- Create credential modal -->
            <div x-show="showCreateModal" x-transition.opacity x-effect="if (showCreateModal && !newCredential) setTimeout(() => $refs.credDescInput?.focus(), 50)" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="showCreateModal = false; newCredential = null">
              <div class="glass rounded-xl p-6 w-full max-w-md mx-4" @click.stop>
                <!-- Create form -->
                <template x-if="!newCredential">
                  <div>
                    <h3 class="text-lg font-semibold mb-4">Create Credential</h3>
                    <form @submit.prevent="createCredential()">
                      <label class="block text-xs font-medium text-vault-muted mb-1.5 uppercase tracking-wider">Description (optional)</label>
                      <input type="text" x-model="newCredDescription" x-ref="credDescInput"
                        placeholder="My application"
                        class="w-full px-3.5 py-2.5 rounded-lg bg-vault-bg border border-vault-border text-vault-text placeholder-slate-500 focus:outline-none focus:border-vault-accent/50 focus:ring-1 focus:ring-vault-accent/30 transition text-sm mb-4">
                      <label class="flex items-center gap-2 mb-4 cursor-pointer">
                        <input type="checkbox" x-model="newCredAdmin"
                          class="w-4 h-4 rounded border-vault-border bg-vault-bg text-vault-accent focus:ring-vault-accent/30 focus:ring-offset-0">
                        <span class="text-sm text-vault-muted">Admin privileges</span>
                        <span class="text-[10px] text-vault-muted/60">(access to Admin API and console management)</span>
                      </label>
                      <div class="flex gap-3 justify-end">
                        <button type="button" @click="showCreateModal = false" class="px-4 py-2 rounded-lg text-sm text-vault-muted hover:text-vault-text transition">Cancel</button>
                        <button type="submit" :disabled="creating" class="px-4 py-2 rounded-lg bg-vault-accent text-vault-bg text-sm font-medium hover:opacity-90 transition disabled:opacity-50">Create</button>
                      </div>
                      <p x-show="createError" x-text="createError" class="text-red-400 text-xs mt-2"></p>
                    </form>
                  </div>
                </template>
                <!-- Show new credential (once) -->
                <template x-if="newCredential">
                  <div>
                    <h3 class="text-lg font-semibold mb-1">Credential Created</h3>
                    <p class="text-xs text-amber-400 mb-4">Save the secret key now — it won't be shown again.</p>
                    <div class="space-y-3">
                      <div>
                        <div class="text-xs text-vault-muted mb-1">Access Key ID</div>
                        <div class="flex items-center gap-2">
                          <code class="text-sm font-mono bg-vault-bg px-3 py-1.5 rounded flex-1 break-all" x-text="newCredential.access_key_id"></code>
                          <button @click="copyToClipboard(newCredential.access_key_id)" class="p-1.5 rounded hover:bg-white/5 text-vault-muted hover:text-vault-accent transition" title="Copy">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0013.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 01-.75.75H9.75a.75.75 0 01-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 01-2.25 2.25H6.75A2.25 2.25 0 014.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 011.927-.184"/></svg>
                          </button>
                        </div>
                      </div>
                      <div>
                        <div class="text-xs text-vault-muted mb-1">Secret Access Key</div>
                        <div class="flex items-center gap-2">
                          <code class="text-sm font-mono bg-vault-bg px-3 py-1.5 rounded flex-1 break-all text-amber-400" x-text="newCredential.secret_access_key"></code>
                          <button @click="copyToClipboard(newCredential.secret_access_key)" class="p-1.5 rounded hover:bg-white/5 text-vault-muted hover:text-vault-accent transition" title="Copy">

                    </div>

          </div>
          <!-- Search bar -->
          <div x-show="!loading && teams.length > 0" class="relative mb-4">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-vault-muted pointer-events-none" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
            </svg>
            <input type="text" x-model.debounce.300ms="searchQuery" placeholder="Search teams..."
              class="w-full bg-transparent border-b border-vault-border/50 hover:border-vault-border focus:border-vault-accent text-sm text-vault-text placeholder-vault-muted/50 focus:outline-none pl-9 pr-8 py-2 transition">

                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>
          <!-- Loading -->
          <div x-show="loading" class="flex justify-center py-12">
            <svg class="animate-spin h-6 w-6 text-vault-accent" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
          </div>

                  <span class="font-semibold text-vault-text" x-text="t.name"></span>
                  <button @click.stop="confirmDelete(t)" class="text-red-400/60 hover:text-red-400 transition-colors p-1"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg></button>
                </div>
                <p class="text-vault-muted text-sm truncate" x-text="t.description || 'No description'"></p>
                <div class="flex items-center gap-4 mt-3 text-xs text-vault-muted">

                  <span x-text="(t.grant_count || 0) + ' grant' + ((t.grant_count || 0) !== 1 ? 's' : '')"></span>
                </div>
              </div>
            </template>
          </div>
          <div x-show="!loading && teams.length > 0 && filteredTeams.length === 0" class="text-center py-16">
            <svg class="w-10 h-10 mx-auto text-vault-border mb-3" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
            </svg>
            <p class="text-vault-muted text-sm">No results for "<span x-text="searchQuery" class="text-vault-text"></span>"</p>

          <div x-show="!loading && teams.length === 0" class="text-center py-16">
            <p class="text-vault-muted text-sm">No teams yet. Create one to get started.</p>

                <div><label class="text-sm text-vault-muted block mb-1">Name</label><input x-model="newName" type="text" class="w-full bg-vault-bg/50 border border-vault-border rounded-lg px-3 py-2 text-sm text-vault-text focus:outline-none focus:border-vault-accent" placeholder="engineering"></div>
                <div><label class="text-sm text-vault-muted block mb-1">Description</label><input x-model="newDescription" type="text" class="w-full bg-vault-bg/50 border border-vault-border rounded-lg px-3 py-2 text-sm text-vault-text focus:outline-none focus:border-vault-accent" placeholder="Optional description"></div>

            <svg class="animate-spin h-6 w-6 text-vault-accent" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
          </div>
          <div x-show="!loading && team">

            <div class="mb-4 ml-10">
              <input type="text" :value="editDescription" @change="editDescription = $event.target.value; saveField({ description: editDescription })" class="w-full text-sm text-vault-muted bg-transparent border-b border-transparent hover:border-vault-border focus:border-vault-accent focus:outline-none py-0.5 transition" placeholder="(no description)">

              <button @click="activeTab = 'grants'" :class="activeTab === 'grants' ? 'text-vault-accent border-vault-accent' : 'text-vault-muted border-transparent hover:text-vault-text'" class="px-4 py-2 text-sm font-medium border-b-2 transition">Grants</button>
            </div>

            <!-- Members tab -->
            <div x-show="activeTab === 'members'">
              <div class="flex flex-col md:flex-row gap-3 md:items-stretch md:min-h-[280px]"

                  <div class="glass rounded-xl p-2 flex-1 overflow-y-auto" @dragover.prevent @drop="membersDrop('right', $event)">

                      <div @click="membersToggle('right', m.user_id, $event)"
                           @dblclick="membersDblClick('right', m.user_id)"
                           draggable="true" @dragstart="membersDragStart('right', m.user_id, $event)"

                <!-- Assigned (left) -->

                  <div class="glass rounded-xl p-2 flex-1 overflow-y-auto" @dragover.prevent @drop="grantsDrop('right', $event)">
                    <template x-for="g in grantsAssigned" :key="g.grant_id">
                      <div @click="grantsToggle('right', g.grant_id, $event)"

                  <button @click="grantsMoveAllRight()" :disabled="grantsAvailable.length === 0 || grantsMoving" class="p-1.5 rounded-lg bg-vault-accent/10 text-vault-accent border border-vault-accent/20 hover:bg-vault-accent/20 transition disabled:opacity-30 disabled:cursor-default" title="Add all"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m18.75 4.5-7.5 7.5 7.5 7.5m-6-15-7.5 7.5 7.5 7.5"/></svg></button>
                  <button @click="grantsMoveLeft()" :disabled="grantsSelRight.length === 0 || grantsMoving" class="p-1.5 rounded-lg bg-vault-accent/10 text-vault-accent border border-vault-accent/20 hover:bg-vault-accent/20 transition disabled:opacity-30 disabled:cursor-default" title="Remove selected"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg></button>
                  <button @click="grantsMoveAllLeft()" :disabled="grantsAssigned.length === 0 || grantsMoving" class="p-1.5 rounded-lg bg-vault-accent/10 text-vault-accent border border-vault-accent/20 hover:bg-vault-accent/20 transition disabled:opacity-30 disabled:cursor-default" title="Remove all"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m5.25 4.5 7.5 7.5-7.5 7.5m6-15 7.5 7.5-7.5 7.5"/></svg></button>
                </div>
                <!-- Available (right) -->
                <div class="flex-1 flex flex-col">
                  <div class="text-xs text-vault-muted mb-2 font-medium uppercase tracking-wide">Available Grants</div>
                  <div class="glass rounded-xl p-2 flex-1 overflow-y-auto" @dragover.prevent @drop="grantsDrop('left', $event)">
                    <template x-for="g in grantsAvailable" :key="g.grant_id">
                      <div @click="grantsToggle('left', g.grant_id, $event)"
                           @dblclick="grantsDblClick('left', g.grant_id)"
                           draggable="true" @dragstart="grantsDragStart('left', g.grant_id, $event)"
                           :class="grantsSelLeft.includes(g.grant_id) ? 'bg-vault-accent/20 border-vault-accent/50' : 'hover:bg-white/5 border-transparent'"

                        <span x-text="g.name"></span>
                      </div>
                    </template>
                    <div x-show="grantsAvailable.length === 0" class="text-vault-muted/50 text-xs text-center py-6">No grants available</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ==================== GRANTS LIST ==================== -->
        <div x-show="view === 'grants'" x-data="grantsView" x-init="$watch('$store', () => {}); if(view === 'grants') load();" x-effect="if(view === 'grants') load()" class="p-6 max-w-6xl">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold text-vault-text">Grants</h2>
            <button @click="showCreateModal = true" class="bg-vault-accent text-vault-bg font-medium rounded-lg px-4 py-2 hover:bg-vault-accent/90 text-sm">+ Create Grant</button>
          </div>
          <!-- Search bar -->
          <div x-show="!loading && grants.length > 0" class="relative mb-4">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-vault-muted pointer-events-none" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
            </svg>
            <input type="text" x-model.debounce.300ms="searchQuery" placeholder="Search grants..."
              class="w-full bg-transparent border-b border-vault-border/50 hover:border-vault-border focus:border-vault-accent text-sm text-vault-text placeholder-vault-muted/50 focus:outline-none pl-9 pr-8 py-2 transition">
            <button x-show="searchQuery" @click="searchQuery = ''"
              class="absolute right-2 top-1/2 -translate-y-1/2 p-0.5 rounded text-vault-muted hover:text-vault-text transition">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>
          <!-- Loading -->
          <div x-show="loading" class="flex justify-center py-12">
            <svg class="animate-spin h-6 w-6 text-vault-accent" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
          </div>
          <!-- Grant cards -->
          <div x-show="!loading" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            <template x-for="g in filteredGrants" :key="g.grant_id">
              <div @click="openGrant(g.grant_id)" class="glass glass-hover rounded-xl p-5 cursor-pointer transition-all duration-200">
                <div class="flex items-center justify-between mb-2">
                  <span class="font-semibold text-vault-text" x-text="g.name"></span>
                  <div class="flex items-center gap-2">
                    <span x-show="isBuiltIn(g)" class="text-xs px-2 py-0.5 rounded-full bg-violet-500/20 text-violet-400">built-in</span>
                    <button x-show="!isBuiltIn(g)" @click.stop="confirmDelete(g)" class="text-red-400/60 hover:text-red-400 transition-colors p-1"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg></button>
                  </div>
                </div>
                <p class="text-vault-muted text-sm truncate" x-text="g.description || 'No description'"></p>
              </div>
            </template>
          </div>
          <div x-show="!loading && grants.length > 0 && filteredGrants.length === 0" class="text-center py-16">
            <svg class="w-10 h-10 mx-auto text-vault-border mb-3" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
            </svg>
            <p class="text-vault-muted text-sm">No results for "<span x-text="searchQuery" class="text-vault-text"></span>"</p>
          </div>
          <div x-show="!loading && grants.length === 0" class="text-center py-16">
            <p class="text-vault-muted text-sm">No grants yet. Create one to get started.</p>
          </div>
          <!-- Create grant modal -->
          <div x-show="showCreateModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" x-cloak>
            <div class="glass rounded-2xl p-6 w-full max-w-lg mx-4" @click.outside="showCreateModal = false">
              <h3 class="text-lg font-semibold text-vault-text mb-4">Create Grant</h3>
              <div class="space-y-4">
                <div><label class="text-sm text-vault-muted block mb-1">Name</label><input x-model="newName" type="text" class="w-full bg-vault-bg/50 border border-vault-border rounded-lg px-3 py-2 text-sm text-vault-text focus:outline-none focus:border-vault-accent" placeholder="s3-readonly"></div>
                <div><label class="text-sm text-vault-muted block mb-1">Description</label><input x-model="newDescription" type="text" class="w-full bg-vault-bg/50 border border-vault-border rounded-lg px-3 py-2 text-sm text-vault-text focus:outline-none focus:border-vault-accent" placeholder="Optional description"></div>
                <div>
                  <div class="flex items-center justify-between mb-1">
                    <label class="text-sm text-vault-muted">Policy Document (JSON)</label>
                    <div class="flex gap-1">
                      <button @click="applyTemplate('full-access')" class="text-[10px] px-1.5 py-0.5 rounded bg-vault-border/50 text-vault-muted hover:text-vault-accent transition">Full Access</button>
                      <button @click="applyTemplate('s3-full-access')" class="text-[10px] px-1.5 py-0.5 rounded bg-vault-border/50 text-vault-muted hover:text-vault-accent transition">S3 Full</button>
                      <button @click="applyTemplate('s3-read-only')" class="text-[10px] px-1.5 py-0.5 rounded bg-vault-border/50 text-vault-muted hover:text-vault-accent transition">S3 Read</button>
                      <button @click="formatNewDocument()" class="text-[10px] px-1.5 py-0.5 rounded bg-vault-border/50 text-vault-muted hover:text-vault-accent transition">Format</button>
                    </div>
                  </div>
                  <textarea x-model="newDocument" rows="10" class="w-full bg-vault-bg/50 border border-vault-border rounded-lg px-3 py-2 text-sm text-vault-text font-mono focus:outline-none focus:border-vault-accent resize-y"></textarea>
                </div>
                <p x-show="createError" class="text-red-400 text-sm" x-text="createError"></p>
              </div>
              <div class="flex justify-end gap-3 mt-6">
                <button @click="showCreateModal = false" class="px-4 py-2 text-sm text-vault-muted hover:text-vault-text">Cancel</button>
                <button @click="createGrant()" :disabled="creating" class="bg-vault-accent text-vault-bg font-medium rounded-lg px-4 py-2 text-sm hover:bg-vault-accent/90 disabled:opacity-50" x-text="creating ? 'Creating...' : 'Create'"></button>
              </div>
            </div>
          </div>
          <!-- Delete grant modal -->
          <div x-show="showDeleteModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" x-cloak>
            <div class="glass rounded-2xl p-6 w-full max-w-md mx-4" @click.outside="showDeleteModal = false">
              <h3 class="text-lg font-semibold text-vault-text mb-2">Delete Grant</h3>
              <p class="text-vault-muted text-sm mb-4">Are you sure you want to delete grant <strong class="text-vault-text" x-text="deleteGrant?.name"></strong>? This cannot be undone.</p>
              <p x-show="deleteError" class="text-red-400 text-sm mb-4" x-text="deleteError"></p>
              <div class="flex justify-end gap-3">
                <button @click="showDeleteModal = false" class="px-4 py-2 text-sm text-vault-muted hover:text-vault-text">Cancel</button>
                <button @click="performDelete()" class="bg-red-500 text-white font-medium rounded-lg px-4 py-2 text-sm hover:bg-red-600">Delete</button>
              </div>
            </div>
          </div>
        </div>

        <!-- ==================== GRANT DETAIL ==================== -->
        <div x-show="view === 'grant-detail'" x-data="grantDetailView" x-effect="if(view === 'grant-detail') load()" class="p-6 max-w-4xl">
          <!-- Header -->
          <div class="flex items-center gap-3 mb-2">
            <a href="#/grants" class="p-1.5 rounded-lg hover:bg-white/5 text-vault-muted hover:text-vault-text transition">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>
            </a>
            <input x-show="!isBuiltIn()" type="text" :value="editName" @change="editName = $event.target.value; saveField({ name: editName })" class="text-xl font-semibold tracking-tight text-vault-text bg-transparent border-b border-transparent hover:border-vault-border focus:border-vault-accent focus:outline-none py-0.5 transition flex-1" placeholder="Grant name">
            <h2 x-show="isBuiltIn()" class="text-xl font-semibold tracking-tight" x-text="grant?.name || 'Grant'"></h2>
            <span x-show="isBuiltIn()" class="text-xs px-2 py-0.5 rounded-full bg-violet-500/20 text-violet-400">built-in</span>
          </div>
          <!-- Loading -->
          <div x-show="loading" class="flex justify-center py-12">
            <svg class="animate-spin h-6 w-6 text-vault-accent" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
          </div>
          <div x-show="!loading && grant" class="space-y-6">
            <!-- Description -->
            <div class="ml-10" x-show="!isBuiltIn()">
              <input type="text" :value="editDescription" @change="editDescription = $event.target.value; saveField({ description: editDescription })" class="w-full text-sm text-vault-muted bg-transparent border-b border-transparent hover:border-vault-border focus:border-vault-accent focus:outline-none py-0.5 transition" placeholder="(no description)">
            </div>
            <p x-show="isBuiltIn() && grant?.description" class="text-vault-muted text-sm ml-10" x-text="grant?.description"></p>

            <!-- Policy Editor -->
            <div class="glass rounded-xl p-5">
              <div class="flex items-center justify-between mb-3">
                <label class="text-sm font-semibold uppercase tracking-wider text-vault-muted">Policy Document</label>
                <div class="flex gap-1" x-show="!isBuiltIn()">
                  <button @click="applyTemplate('full-access')" class="text-[10px] px-1.5 py-0.5 rounded bg-vault-border/50 text-vault-muted hover:text-vault-accent transition">Full Access</button>
                  <button @click="applyTemplate('s3-full-access')" class="text-[10px] px-1.5 py-0.5 rounded bg-vault-border/50 text-vault-muted hover:text-vault-accent transition">S3 Full</button>
                  <button @click="applyTemplate('s3-read-only')" class="text-[10px] px-1.5 py-0.5 rounded bg-vault-border/50 text-vault-muted hover:text-vault-accent transition">S3 Read</button>
                  <button @click="formatDocument()" class="text-[10px] px-1.5 py-0.5 rounded bg-vault-border/50 text-vault-muted hover:text-vault-accent transition">Format</button>
                </div>
              </div>
              <textarea x-model="editDocument" rows="12" :disabled="isBuiltIn()" class="w-full bg-vault-bg/50 border border-vault-border rounded-lg px-3 py-2 text-sm text-vault-text font-mono focus:outline-none focus:border-vault-accent resize-y disabled:opacity-50"></textarea>
            </div>

            <!-- Visual preview -->
            <div x-show="parsedStatements.length > 0" class="glass rounded-xl p-5">
              <h3 class="text-sm font-semibold uppercase tracking-wider text-vault-muted mb-3">Statement Preview</h3>
              <div class="space-y-3">
                <template x-for="(stmt, i) in parsedStatements" :key="i">
                  <div class="rounded-lg p-3" :class="stmt.effect === 'Allow' ? 'bg-green-500/10 border border-green-500/20' : 'bg-red-500/10 border border-red-500/20'">
                    <div class="flex items-center gap-2 mb-2">
                      <span :class="stmt.effect === 'Allow' ? 'text-green-400' : 'text-red-400'" class="text-xs font-semibold uppercase" x-text="stmt.effect"></span>
                    </div>
                    <div class="text-xs text-vault-muted space-y-1">
                      <div><span class="text-vault-text">Actions:</span> <span x-text="stmt.actions.join(', ')"></span></div>
                      <div><span class="text-vault-text">Resources:</span> <span x-text="stmt.resources.join(', ')"></span></div>
                    </div>
                  </div>
                </template>
              </div>
            </div>

            <!-- Attachments -->
            <div class="glass rounded-xl p-5">
              <h3 class="text-sm font-semibold uppercase tracking-wider text-vault-muted mb-3">Attached To</h3>
              <div class="grid gap-3 sm:grid-cols-2">
                <div>
                  <span class="text-xs text-vault-muted block mb-2">Users</span>
                  <template x-for="u in attachedUsers" :key="u.user_id">
                    <a :href="'#/users/' + u.user_id" class="block text-sm text-vault-text hover:text-vault-accent transition mb-1" x-text="u.username"></a>
                  </template>
                  <div x-show="attachedUsers.length === 0" class="text-xs text-vault-muted/60">None</div>
                </div>
                <div>
                  <span class="text-xs text-vault-muted block mb-2">Teams</span>
                  <template x-for="t in attachedTeams" :key="t.team_id">
                    <a :href="'#/teams/' + t.team_id" class="block text-sm text-vault-text hover:text-vault-accent transition mb-1" x-text="t.name"></a>
                  </template>
                  <div x-show="attachedTeams.length === 0" class="text-xs text-vault-muted/60">None</div>
                </div>
              </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <button x-show="!isBuiltIn()" @click="save()" :disabled="saving" class="bg-vault-accent text-vault-bg font-medium rounded-lg px-4 py-2 text-sm hover:bg-vault-accent/90 disabled:opacity-50" x-text="saving ? 'Saving...' : 'Save Policy'"></button>
                <span x-show="saveSuccess" class="text-green-400 text-sm">Saved!</span>
                <p x-show="saveError" class="text-red-400 text-sm" x-text="saveError"></p>
              </div>
              <button x-show="!isBuiltIn()" @click="confirmDelete()" class="px-4 py-2 rounded-lg bg-red-500/10 text-red-400 border border-red-500/30 text-sm font-medium hover:bg-red-500/20 transition">Delete Grant</button>
            </div>
          </div>

          <!-- Delete grant modal -->
          <div x-show="showDeleteModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" x-cloak>
            <div class="glass rounded-2xl p-6 w-full max-w-md mx-4" @click.outside="showDeleteModal = false">
              <h3 class="text-lg font-semibold text-vault-text mb-2">Delete Grant</h3>

                <button @click="showDeleteModal = false" class="px-4 py-2 text-sm text-vault-muted hover:text-vault-text">Cancel</button>
                <button @click="performDelete()" class="bg-red-500 text-white font-medium rounded-lg px-4 py-2 text-sm hover:bg-red-600">Delete</button>
              </div>
            </div>
          </div>
        </div>

        <!-- ==================== AUDIT LOG ==================== -->
        <template x-if="view === 'audit'">
          <div class="p-6 max-w-7xl" x-data="auditView" x-init="init()" @destroy="destroy()">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
              <h2 class="text-xl font-semibold tracking-tight">Audit Log</h2>
              <div class="flex items-center gap-3">
                <span class="text-xs text-vault-muted" x-text="total + ' entries'"></span>
                <button x-show="hasAnyFilter" @click="clearAllFilters()" class="text-xs text-vault-muted hover:text-vault-text transition">Clear filters</button>
                <button @click="showClearModal = true; clearConfirmText = ''" class="px-2.5 py-1 rounded-lg text-xs border border-red-500/30 text-red-400 hover:bg-red-500/10 transition">Clear All</button>
              </div>
            </div>

            <!-- Pagination bar -->
            <div class="flex flex-wrap items-center justify-end gap-3 mb-4">
              <div class="flex items-center gap-3 flex-shrink-0">
                <div class="flex items-center gap-1.5">
                  <span class="text-[11px] text-vault-muted">Show</span>
                  <select x-model="limit" @change="limit = Number($event.target.value) || 50; page = 0; sessionStorage.setItem('audit_page_size', limit)" class="setting-number px-2 py-1 rounded-lg bg-vault-bg border border-vault-border text-vault-text text-xs focus:outline-none focus:border-vault-accent/50 transition">
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                  </select>
                </div>
                <span class="text-xs text-vault-muted" x-text="'Page ' + currentPage + ' of ' + totalPages"></span>
                <div class="flex gap-0.5">
                  <button @click="firstPage()" :disabled="page === 0" class="p-1 rounded-lg border border-vault-border text-vault-muted hover:text-vault-text transition disabled:opacity-30" title="First page"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M18.75 19.5l-7.5-7.5 7.5-7.5m-6 15L5.25 12l7.5-7.5"/></svg></button>
                  <button @click="prevPage()" :disabled="page === 0" class="p-1 rounded-lg border border-vault-border text-vault-muted hover:text-vault-text transition disabled:opacity-30" title="Previous page"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg></button>
                  <button @click="nextPage()" :disabled="currentPage >= totalPages" class="p-1 rounded-lg border border-vault-border text-vault-muted hover:text-vault-text transition disabled:opacity-30" title="Next page"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg></button>
                  <button @click="lastPage()" :disabled="currentPage >= totalPages" class="p-1 rounded-lg border border-vault-border text-vault-muted hover:text-vault-text transition disabled:opacity-30" title="Last page"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 4.5l7.5 7.5-7.5 7.5m6-15l7.5 7.5-7.5 7.5"/></svg></button>
                </div>
              </div>
            </div>

            <!-- Loading -->
            <div x-show="loading" class="flex justify-center py-16">
              <svg class="animate-spin h-6 w-6 text-vault-accent" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            </div>

            <!-- Table with inline header filters -->
            <div x-show="!loading" class="glass rounded-xl overflow-x-auto">
              <table class="w-full text-sm min-w-[700px]">
                <thead>
                  <tr class="text-left text-[11px] uppercase tracking-wider text-vault-muted border-b border-vault-border/30">
                    <!-- TIME header (date range popover) -->
                    <th class="px-4 py-3 w-[180px]">
                      <div class="col-filter" :class="{ active: filterFrom || filterTo }" @click.outside="timeOpen = false">
                        <div class="col-label" @click="timeOpen = !timeOpen" x-show="!filterFrom && !filterTo">
                          Time <svg class="fi" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z"/></svg>
                        </div>
                        <div x-show="filterFrom || filterTo" class="filter-badge" @click="timeOpen = !timeOpen">
                          <span class="val" x-text="timeLabel()"></span>
                          <span class="fbx" @click.stop="filterFrom = ''; filterTo = ''; timeOpen = false; load()"><svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></span>
                        </div>
                        <div class="time-pop" x-show="timeOpen" x-cloak>

                          <div><label>To</label><input type="datetime-local" x-model="filterTo" @change="page = 0; load()"></div>
                        </div>
                      </div>
                    </th>
                    <!-- OPERATION header (tag filter popover) -->
                    <th class="px-4 py-3">
                      <div class="col-filter" :class="{ active: opTags.length > 0 }" @click.outside="opOpen = false; opExpandedCat = null">
                        <div class="col-label" @click="opOpen = !opOpen" x-show="opTags.length === 0">
                          Operation <svg class="fi" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z"/></svg>
                        </div>
                        <div x-show="opTags.length > 0" class="filter-badge" @click="opOpen = !opOpen">
                          <span :class="opMode === 'include' ? 'text-vault-accent' : 'text-red-400'" class="text-[9px] font-bold uppercase" x-text="opMode === 'include' ? 'IN' : 'EX'"></span>

                          <span class="fbx" @click.stop="clearOpTags(); opOpen = false"><svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></span>
                        </div>
                        <!-- Operation filter popover -->
                        <div class="col-popover" x-show="opOpen" x-cloak style="min-width:min(340px, calc(100vw - 2rem))" @click.stop @click.outside="opOpen = false; opExpandedCat = null">
                          <!-- Mode toggle -->
                          <div class="flex gap-1 p-2 border-b border-vault-border/30">
                            <button @click="toggleOpMode()" class="text-[10px] font-bold uppercase tracking-wide px-2 py-1 rounded transition flex-1 text-center"
                              :class="opMode === 'include' ? 'bg-vault-accent/15 text-vault-accent' : 'bg-vault-border/20 text-vault-muted'">Include</button>
                            <button @click="toggleOpMode()" class="text-[10px] font-bold uppercase tracking-wide px-2 py-1 rounded transition flex-1 text-center"
                              :class="opMode === 'exclude' ? 'bg-red-500/15 text-red-400' : 'bg-vault-border/20 text-vault-muted'">Exclude</button>
                          </div>
                          <!-- Presets -->
                          <div class="border-b border-vault-border/30">
                            <div class="px-2.5 pt-2 text-[9px] text-vault-muted uppercase tracking-widest font-semibold">Presets</div>
                            <div class="op-presets">
                              <template x-for="(ops, name) in opPresets" :key="name">
                                <button class="op-preset-btn" :class="opActivePreset === name ? 'active' : ''"
                                  @click="applyOpPreset(name)" x-text="name"></button>
                              </template>
                            </div>
                          </div>
                          <!-- All / None + count -->
                          <div class="flex justify-between items-center px-2.5 py-1.5 border-b border-vault-border/30">
                            <span class="text-[11px] text-vault-muted"><strong class="text-vault-accent" x-text="opTags.length"></strong> selected</span>
                            <div class="flex gap-1.5">
                              <button @click="selectAllOps()" class="text-[10px] font-semibold text-vault-accent uppercase tracking-wide hover:bg-vault-accent/10 px-1.5 py-0.5 rounded transition">All</button>
                              <button @click="clearOpTags()" class="text-[10px] font-semibold text-vault-accent uppercase tracking-wide hover:bg-vault-accent/10 px-1.5 py-0.5 rounded transition">None</button>
                            </div>
                          </div>
                          <!-- Category chips -->
                          <div class="op-chips">
                            <template x-for="cat in opCatNames" :key="cat">
                              <div style="position:relative;display:inline-flex">
                                <button class="op-chip" :class="opCatClass(cat)"
                                  @click="toggleOpCat(cat)" :title="'Toggle all ' + cat + ' operations'">
                                  <span x-text="cat"></span>
                                  <span x-show="opCatSelected(cat) > 0" class="op-chip-count"
                                    x-text="opCatSelected(cat) + '/' + opCategories[cat].length"></span>
                                  <svg class="op-chip-arrow" @click.stop="opExpandedCat = opExpandedCat === cat ? null : cat"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                                </button>
                                <!-- Drill-down dropdown -->
                                <div x-show="opExpandedCat === cat" class="op-chip-dd" @click.stop>
                                  <template x-for="op in opCategories[cat]" :key="op">
                                    <div class="op-chip-dd-item" :class="opTags.includes(op) ? 'checked' : ''"
                                      @click="toggleSingleOp(op)">
                                      <input type="checkbox" :checked="opTags.includes(op)" @click.stop="toggleSingleOp(op)">
                                      <span x-text="op"></span>
                                    </div>
                                  </template>
                                </div>
                              </div>
                            </template>
                          </div>
                        </div>
                      </div>
                    </th>
                    <!-- BUCKET header (value list dropdown) -->
                    <th class="px-4 py-3">
                      <div class="col-filter" :class="{ active: selectedBuckets.size > 0 }" @click.outside="bucketOpen = false">
                        <div class="col-label" @click="bucketOpen = !bucketOpen" x-show="selectedBuckets.size === 0">
                          Bucket <svg class="fi" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z"/></svg>
                        </div>
                        <div x-show="selectedBuckets.size > 0" class="filter-badge" @click="bucketOpen = !bucketOpen">
                          <span class="val" x-text="[...selectedBuckets].join(', ')"></span>
                          <span class="fbx" @click.stop="selectedBuckets = new Set(); bucketOpen = false; page = 0"><svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></span>
                        </div>
                        <div class="col-popover" x-show="bucketOpen" x-cloak style="min-width:min(180px, calc(100vw - 2rem))">
                          <div class="pop-search"><input type="text" x-model="bucketSearch" placeholder="Search..."></div>
                          <div class="pop-list">
                            <template x-for="item in bucketValues" :key="item.name">
                              <div class="pop-item" :class="{ selected: selectedBuckets.has(item.name) }"
                                x-show="!bucketSearch || item.name.toLowerCase().includes(bucketSearch.toLowerCase())"
                                @click="toggleSet(selectedBuckets, item.name); selectedBuckets = new Set(selectedBuckets); page = 0">
                                <div class="check"><svg fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="white"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg></div>
                                <span x-text="item.name"></span>
                                <span class="cnt" x-text="item.count"></span>
                              </div>
                            </template>
                          </div>
                        </div>
                      </div>
                    </th>
                    <!-- KEY header (inline text filter) -->
                    <th class="px-4 py-3">
                      <div class="col-filter" :class="{ active: filterKey }">
                        <div class="col-label" @click="keyEditing = true; $nextTick(() => $refs.keyInput.focus())" x-show="!keyEditing && !filterKey">
                          Key <svg class="fi" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z"/></svg>
                        </div>
                        <div x-show="filterKey && !keyEditing" class="filter-badge" @click="keyEditing = true; $nextTick(() => $refs.keyInput.focus())">
                          <span class="val" x-text="filterKey"></span>
                          <span class="fbx" @click.stop="filterKey = ''; page = 0"><svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></span>
                        </div>
                        <input type="text" x-ref="keyInput" x-model="filterKey" x-show="keyEditing" class="key-inline"
                          @focus="keyEditing = true" @blur="keyEditing = false"
                          @keydown.enter="keyEditing = false; $refs.keyInput.blur(); page = 0"
                          @keydown.escape="filterKey = ''; keyEditing = false; $refs.keyInput.blur(); page = 0"
                          placeholder="filter key...">
                      </div>
                    </th>
                    <!-- USER header (value list dropdown) -->
                    <th class="px-4 py-3">
                      <div class="col-filter" :class="{ active: selectedUsers.size > 0 }" @click.outside="userOpen = false">
                        <div class="col-label" @click="userOpen = !userOpen" x-show="selectedUsers.size === 0">
                          User <svg class="fi" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z"/></svg>
                        </div>
                        <div x-show="selectedUsers.size > 0" class="filter-badge" @click="userOpen = !userOpen">
                          <span class="val" x-text="[...selectedUsers].join(', ')"></span>
                          <span class="fbx" @click.stop="selectedUsers = new Set(); userOpen = false; page = 0"><svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></span>
                        </div>
                        <div class="col-popover" x-show="userOpen" x-cloak style="min-width:min(160px, calc(100vw - 2rem))">
                          <div class="pop-search"><input type="text" x-model="userSearch" placeholder="Search..."></div>
                          <div class="pop-list">
                            <template x-for="item in userValues" :key="item.name">
                              <div class="pop-item" :class="{ selected: selectedUsers.has(item.name) }"
                                x-show="!userSearch || item.name.toLowerCase().includes(userSearch.toLowerCase())"
                                @click="toggleSet(selectedUsers, item.name); selectedUsers = new Set(selectedUsers); page = 0">
                                <div class="check"><svg fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="white"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg></div>
                                <span x-text="item.name"></span>
                                <span class="cnt" x-text="item.count"></span>
                              </div>
                            </template>
                          </div>
                        </div>
                      </div>
                    </th>
                    <!-- STATUS header (value list dropdown) -->
                    <th class="px-4 py-3 text-right">
                      <div class="col-filter" :class="{ active: selectedStatuses.size > 0 }" @click.outside="statusOpen = false" style="display:flex;justify-content:flex-end">
                        <div class="col-label" @click="statusOpen = !statusOpen" x-show="selectedStatuses.size === 0">
                          Status <svg class="fi" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z"/></svg>
                        </div>
                        <div x-show="selectedStatuses.size > 0" class="filter-badge" @click="statusOpen = !statusOpen">
                          <span class="val" x-text="[...selectedStatuses].join(', ')"></span>
                          <span class="fbx" @click.stop="selectedStatuses = new Set(); statusOpen = false; page = 0"><svg class="w-2.5 h-2.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></span>
                        </div>
                        <div class="col-popover" x-show="statusOpen" x-cloak style="min-width:min(120px, calc(100vw - 2rem));right:-8px;left:auto">
                          <div class="pop-list">
                            <template x-for="item in statusValues" :key="item.name">
                              <div class="pop-item" :class="{ selected: selectedStatuses.has(item.name) }"
                                @click="toggleSet(selectedStatuses, item.name); selectedStatuses = new Set(selectedStatuses); page = 0">
                                <div class="check"><svg fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="white"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg></div>
                                <span class="font-mono" :class="Number(item.name) < 300 ? 'text-green-400' : Number(item.name) < 500 ? 'text-amber-400' : 'text-red-400'" x-text="item.name"></span>
                                <span class="cnt" x-text="item.count"></span>
                              </div>
                            </template>
                          </div>
                        </div>
                      </div>
                    </th>
                    <th class="px-4 py-3 text-right">Duration</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="entry in filteredEntries" :key="entry.id">
                    <tr @click="selectEntry(entry)" class="border-b border-vault-border/10 hover:bg-white/[0.02] cursor-pointer transition"
                      :class="selectedEntry?.id === entry.id ? 'bg-vault-accent/5' : ''">
                      <td class="px-4 py-2.5 text-xs text-vault-muted whitespace-nowrap" x-text="formatTime(entry.timestamp)"></td>
                      <td class="px-4 py-2.5">
                        <span class="text-xs font-mono px-1.5 py-0.5 rounded bg-vault-border/20" x-text="entry.operation"></span>
                      </td>
                      <td class="px-4 py-2.5 text-xs text-vault-text" x-text="entry.bucket || '—'"></td>
                      <td class="px-4 py-2.5 text-xs text-vault-muted max-w-[200px] truncate" :title="entry.key" x-text="entry.key || '—'"></td>
                      <td class="px-4 py-2.5 text-xs text-vault-muted" x-text="entry.user_id || '—'"></td>
                      <td class="px-4 py-2.5 text-xs text-right font-mono" :class="statusClass(entry.http_status)" x-text="entry.http_status"></td>
                      <td class="px-4 py-2.5 text-xs text-right text-vault-muted" x-text="entry.duration_ms + ' ms'"></td>
                    </tr>
                  </template>
                </tbody>
              </table>

              <!-- Empty state -->
              <div x-show="filteredEntries.length === 0" class="py-12 text-center text-vault-muted text-sm">
                No audit log entries found
              </div>
            </div>

            <!-- Clear audit modal -->
            <div x-show="showClearModal" x-transition.opacity class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center" @click.self="showClearModal = false">
              <div class="glass rounded-xl p-6 w-full max-w-sm mx-4" @click.stop>
