[workspace]
resolver = "2"
members = [
    "crates/arca-core",
    "crates/arca-auth",
    "crates/arca-storage",
    "crates/arca-proto",
    "crates/arca-server",
]

[workspace.package]
version = "0.29.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
hyper = { version = "1", features = ["full"] }
http = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
quick-xml = { version = "0.40", features = ["serialize"] }
toml = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Database
tokio-rusqlite = "0.7"
rusqlite = { version = "0.37", features = ["bundled"] }
sqlx-core = { version = "0.9", features = ["chrono", "json", "_rt-tokio"] }
sqlx-postgres = { version = "0.9", features = ["chrono", "json"] }

# Streaming / bytes
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }

# Compression
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
zstd = "0.13"
lz4_flex = { version = "0.13", default-features = false, features = ["std"] }
snap = "1.1"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
brotli = { version = "8", default-features = false, features = ["std"] }
lzma-rs = "0.3"

# Hashing
hmac = "0.13"
md-5 = "0.11"
sha2 = "0.11"
hex = "0.4"
subtle = "2"

# Serialization (extra)
serde_json = "1"

# Encoding
base64 = "0.22"
urlencoding = "2"
form_urlencoded = "1"

# HTTP utilities
httpdate = "1"

# Rate limiting
governor = "0.10"

# Caching
moka = { version = "0.12", features = ["future"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
tempfile = "3"

# System
libc = "0.2"

# Cluster / service discovery (HA, Phase 29) — pure-Rust mDNS, no system daemon
mdns-sd = "0.20"

# Encryption
ring = "0.17"

# HTTP client (startup-only, Vault/OpenBAO KMS)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream"] }

# Notification connectors
redis = { version = "1", features = ["tokio-comp", "aio"] }
async-nats = "0.49"
rumqttc = "0.25"
sqlx-mysql = { version = "0.9", features = ["chrono"] }
mongodb = "3.1"
lapin = "4"
rdkafka = { version = "0.39", features = ["cmake-build"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls-tls", "hostname", "ring", "webpki-roots"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
prost = "0.14"
tonic-prost-build = "0.14"

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pki-types = "1"
arc-swap = "1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2", "service"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# PINNED =0.3.47: time 0.3.48 adds impls that clash (E0119 coherence) with
# rcgen's blanket From conversions when time's parsing/formatting features are
# enabled elsewhere in the graph. 0.3.47 already includes the CVE-2026-25727
# fix (TD-011). Unpin when rcgen or time resolves the conflict upstream.
time = "=0.3.47"

# Internal crates
arca-core = { path = "crates/arca-core" }
arca-auth = { path = "crates/arca-auth" }
arca-storage = { path = "crates/arca-storage" }
arca-proto = { path = "crates/arca-proto" }
arca-server = { path = "crates/arca-server" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
