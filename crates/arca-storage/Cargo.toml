[package]
name = "arca-storage"
version.workspace = true
license.workspace = true
edition = "2021"
description = "Storage implementations (filesystem + SQLite) for the Arca S3 server"

[dependencies]
arca-core = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
futures-core = { workspace = true }
hex = { workspace = true }
md-5 = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-rusqlite = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
ring = { workspace = true }
base64 = { workspace = true }
moka = { workspace = true }
sqlx-core = { workspace = true, optional = true }
sqlx-postgres = { workspace = true, optional = true }

# Compression codecs (transparent at-rest compression)
zstd = { workspace = true }
lz4_flex = { workspace = true }
snap = { workspace = true }
flate2 = { workspace = true }
brotli = { workspace = true }
lzma-rs = { workspace = true }

[features]
default = []
postgres = ["sqlx-core", "sqlx-postgres"]

[dev-dependencies]
tempfile = { workspace = true }
